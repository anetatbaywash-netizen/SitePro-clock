<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SitePro Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#090b13;--bg2:#0f1219;--card:#151923;--card2:#1c2130;--border:#252d42;--fg:#e4e6ec;--muted:#6a7199;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24;--purple:#c084fc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 50%,rgba(232,168,56,.05) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(56,189,248,.03) 0%,transparent 50%),radial-gradient(ellipse at 50% 90%,rgba(168,85,247,.025) 0%,transparent 50%);pointer-events:none;z-index:0}
body>*{position:relative;z-index:1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;transition:all .25s ease}
.card:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--border));box-shadow:0 4px 24px rgba(0,0,0,.2)}
.card-glass{background:linear-gradient(135deg,rgba(21,25,35,.9),rgba(28,33,48,.7));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:1.25rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:9px;font-weight:500;font-size:.85rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0c0e16;box-shadow:0 2px 12px rgba(232,168,56,.25)}.btn-primary:hover{box-shadow:0 4px 20px rgba(232,168,56,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-success{background:rgba(52,211,153,.12);color:var(--success);border:1px solid rgba(52,211,153,.25)}.btn-success:hover{background:rgba(52,211,153,.2)}
.btn-sm{padding:.35rem .7rem;font-size:.78rem;border-radius:7px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.55rem .75rem;border-radius:9px;font-family:inherit;font-size:.85rem;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,168,56,.1)}
select option{background:var(--card);color:var(--fg)}
textarea{resize:vertical;min-height:80px;font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.5}
label{font-size:.78rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.25rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.2rem;color:var(--muted);font-size:.85rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.04)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.07);border-left-color:var(--accent)}
.sidebar-link.active::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--accent);border-radius:1px}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{padding:.75rem 1.1rem;border-radius:10px;font-size:.83rem;display:flex;align-items:center;gap:.55rem;animation:toastIn .35s ease;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:auto;backdrop-filter:blur(8px)}
.toast-success{background:rgba(6,95,70,.9);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.toast-error{background:rgba(127,29,29,.9);border:1px solid rgba(248,113,113,.3);color:#fecaca}
.toast-info{background:rgba(12,74,110,.9);border:1px solid rgba(56,189,248,.3);color:#bae6fd}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 40px rgba(52,211,153,.12),inset 0 0 40px rgba(52,211,153,.03)}50%{box-shadow:0 0 70px rgba(52,211,153,.25),inset 0 0 60px rgba(52,211,153,.06)}}
@keyframes breatheOut{0%,100%{box-shadow:0 0 40px rgba(248,113,113,.12),inset 0 0 40px rgba(248,113,113,.03)}50%{box-shadow:0 0 70px rgba(248,113,113,.25),inset 0 0 60px rgba(248,113,113,.06)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .35s ease}
.fade-in-scale{animation:fadeInScale .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .2s}
.modal-overlay.show{opacity:1}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:1.5rem;transform:scale(.95);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.55rem .75rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--card);z-index:2}
td{padding:.55rem .75rem;font-size:.83rem;border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)}
tr:hover td{background:rgba(232,168,56,.025)}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:20px;font-size:.68rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.12);color:var(--success)}.badge-red{background:rgba(248,113,113,.12);color:var(--danger)}.badge-amber{background:rgba(232,168,56,.12);color:var(--accent)}.badge-blue{background:rgba(56,189,248,.12);color:var(--info)}.badge-purple{background:rgba(168,85,247,.12);color:var(--purple)}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}.conn-dot.loading{background:var(--warning);animation:pulseRing 1.2s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;transition:all .2s;background:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-btn:hover{color:var(--fg)}
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .6s ease}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.15rem;position:relative;overflow:hidden;transition:all .25s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.sc-amber::before{background:var(--accent)}.sc-green::before{background:var(--success)}.sc-blue::before{background:var(--info)}.sc-red::before{background:var(--danger)}.sc-purple::before{background:var(--purple)}
.search-box{position:relative}.search-box input{padding-left:2.2rem}.search-box i{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
.clock-face{position:relative;width:260px;height:260px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;user-select:none}
.clock-face.ci{background:radial-gradient(circle at 38% 32%,rgba(52,211,153,.1),var(--card) 65%);border:2.5px solid var(--success);animation:breathe 3s ease-in-out infinite}
.clock-face.ci:hover{transform:scale(1.05)}.clock-face.ci:active{transform:scale(.96)}
.clock-face.co{background:radial-gradient(circle at 38% 32%,rgba(248,113,113,.1),var(--card) 65%);border:2.5px solid var(--danger);animation:breatheOut 2.5s ease-in-out infinite}
.clock-face.co:hover{transform:scale(1.05)}.clock-face.co:active{transform:scale(.96)}
.clock-face.idle{background:radial-gradient(circle at 38% 32%,rgba(232,168,56,.06),var(--card) 65%);border:2.5px solid var(--border)}
.clock-face.idle:hover{border-color:var(--accent)}
.clock-ring{position:absolute;inset:-16px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--border) 60%,transparent);animation:spinSlow 40s linear infinite;pointer-events:none}
.clock-face::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid;opacity:0;animation:pulseRing 2.5s ease-out infinite;pointer-events:none}
.clock-face.ci::after{border-color:var(--success)}.clock-face.co::after{border-color:var(--danger)}
.cf-icon{font-size:2.2rem;margin-bottom:.2rem}.cf-label{font-size:.95rem;font-weight:700;letter-spacing:.04em}.cf-sub{font-size:.68rem;color:var(--muted);margin-top:.1rem}
.emp-hero{background:linear-gradient(180deg,rgba(232,168,56,.04) 0%,transparent 60%);border-radius:18px;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.emp-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,56,.07),transparent 70%);pointer-events:none}
.emp-avatar{width:60px;height:60px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;margin-bottom:.6rem;border:2px solid var(--accent);color:var(--accent);background:var(--card)}
.chart-canvas{width:100%;border-radius:10px}
.filter-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.filter-row .fg{display:flex;flex-direction:column;gap:.2rem;min-width:140px;flex:1}
.filter-row .fg label{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}.empty-state i{font-size:2.5rem;margin-bottom:.75rem;opacity:.3}
.tier-legend{display:flex;gap:1rem;flex-wrap:wrap}
.tier-legend span{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--muted)}
.tier-legend .td{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.format-hint{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.6;white-space:pre;overflow-x:auto}
.format-hint b{color:var(--accent);font-weight:600}
.import-preview{max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:.75rem}
.import-preview table{margin:0}.import-preview th{background:var(--bg2);font-size:.65rem;padding:.4rem .6rem}.import-preview td{font-size:.78rem;padding:.4rem .6rem}
.err-row td{background:rgba(248,113,113,.06)!important}.ok-row td{background:rgba(52,211,153,.04)!important}
.jarrison-info{background:linear-gradient(135deg,rgba(56,189,248,.06),rgba(168,85,247,.04));border:1px solid rgba(56,189,248,.15);border-radius:10px;padding:1rem 1.15rem}
.jarrison-info h4{font-size:.85rem;font-weight:600;color:var(--info);margin-bottom:.4rem}
.jarrison-info p{font-size:.78rem;color:var(--muted);line-height:1.5}
.jarrison-info code{background:var(--bg2);padding:.1rem .35rem;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--fg)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-face{width:210px;height:210px}.filter-row{flex-direction:column}.filter-row .fg{min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div id="loading-screen" class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing...</p></div></div>
<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card-glass w-full max-w-md fade-in-scale" style="border-color:color-mix(in srgb,var(--accent) 15%,var(--border))">
    <div class="text-center mb-6"><div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a);box-shadow:0 4px 20px rgba(232,168,56,.3)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div><h1 class="text-2xl font-bold tracking-tight">SitePro Clock In</h1><p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p></div>
    <div class="flex mb-5 border-b" style="border-color:var(--border)"><button class="tab-btn flex-1" onclick="switchLoginTab('admin')"><i class="fas fa-shield-halved mr-1"></i> Admin</button><button class="tab-btn active flex-1" onclick="switchLoginTab('employee')"><i class="fas fa-user mr-1"></i> Employee</button></div>
    <div id="login-admin" class="hidden"><div class="mb-3"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div><div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div><button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button></div>
    <div id="login-employee"><div class="mb-3"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off" style="text-transform:uppercase"></div><div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4" inputmode="numeric"></div><button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button></div>
  </div>
</div>
<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-4 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div class="min-w-0"><div class="font-bold text-sm truncate">SitePro</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div></div>
    <nav class="py-2 flex-1 overflow-y-auto" id="admin-nav">
      <div class="px-4 py-1.5 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Overview</div>
      <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-gauge-high w-5 text-center"></i> Dashboard</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Management</div>
      <a class="sidebar-link" data-page="sites"><i class="fas fa-location-dot w-5 text-center"></i> Sites</a>
      <a class="sidebar-link" data-page="employees"><i class="fas fa-users w-5 text-center"></i> Employees</a>
      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Data</div>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Export</a>
      <a class="sidebar-link" data-page="recyclebin"><i class="fas fa-recycle w-5 text-center"></i> Recycle Bin</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">System</div>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="p-3 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="toggleSidebar()" style="border-radius:10px"><i class="fas fa-bars"></i></button>
</div>
<div id="employee-layout" class="hidden">
  <div class="min-h-screen flex flex-col">
    <header class="p-3 flex items-center justify-between border-b" style="border-color:var(--border);background:var(--bg2)">
      <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xs" style="color:#0c0e16"></i></div><span class="font-bold text-sm">SitePro</span><span class="conn-dot on" id="emp-conn-dot"></span></div>
      <div class="flex items-center gap-2"><span id="emp-header-name" class="text-sm hidden sm:inline" style="color:var(--muted)"></span><button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i></button></div>
    </header>
    <div class="flex-1 flex">
      <nav class="w-14 sm:w-44 border-r flex flex-col pt-3 gap-1" style="border-color:var(--border);background:var(--bg2)" id="emp-nav">
        <a class="sidebar-link active" data-epage="clock" style="padding:.65rem .4rem;justify-content:center;flex-direction:column;gap:1px;font-size:.7rem"><i class="fas fa-fingerprint text-base"></i><span class="hidden sm:inline mt-0.5">Clock</span></a>
        <a class="sidebar-link" data-epage="history" style="padding:.65rem .4rem;justify-content:center;flex-direction:column;gap:1px;font-size:.7rem"><i class="fas fa-history text-base"></i><span class="hidden sm:inline mt-0.5">History</span></a>
      </nav>
      <main class="flex-1 p-4 sm:p-6 overflow-y-auto" id="emp-content"></main>
    </div>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modal-box"></div></div>

<script>
/* ===== Firebase Config ===== */
var FB_CONFIG = {
  apiKey: "AIzaSyAkHU3eWCWTUt3Ks0Vxq3PkgcATtin0Zaw",
  authDomain: "baywashclock.firebaseapp.com",
  databaseURL: "https://baywashclock-default-rtdb.firebaseio.com",
  projectId: "baywashclock",
  storageBucket: "baywashclock.firebasestorage.app",
  messagingSenderId: "207388184141",
  appId: "1:207388184141:web:718d4348bc91672a369604"
};

var db = null, fbConnected = false, loadCount = 0, ready = false;
var D = { sites: [], employees: [], shifts: [], records: [], settings: {}, admin: {}, recycleBin: {} };
var S = {
  loggedIn: false, role: null, page: 'dashboard', empPage: 'clock', emp: null,
  clockState: 'idle', activeRec: null, gpsDist: null, gpsLat: null, gpsLng: null,
  timerInt: null, clockInt: null, dashInt: null, searchTerms: {},
  recFilterDate: '', recFilterStatus: '', recFilterSite: '', pendingImport: []
};

/* ===== Firebase Init — FIXED: proper closing braces ===== */
function initFirebase(cfg) {
  firebase.initializeApp(cfg);
  db = firebase.database();
  db.ref('.info/connected').on('value', function(s) {
    fbConnected = (s.val() === true);
    updateDots();
  });
  var OBJ = { 'recycleBin': 1, 'admin': 1 };
  ['sites', 'employees', 'shifts', 'records', 'settings', 'admin', 'recycleBin'].forEach(function(p) {
    db.ref(p).on('value', function(s) {
      D[p] = OBJ[p] ? (s.val() || {}) : (s.val() ? Object.values(s.val()) : []);
      loadCount++;

/* ===== Hours System ===== */
function isHol(ds) { return hols().indexOf(ds) !== -1; }
function dayType(ds) {

}

}
function getDailyTarget(dt) {
  var s = sett();
  if (dt === 'Weekday') return s.weekdayDailyTarget || 8;
  if (dt === 'Saturday') return s.saturdayDailyTarget || 5;
  return 0;
}
function getWeeklyTarget() { return sett().weeklyTarget || 45; }
function weekStart(ds) {

}
function weekEnd(ws) { var d = new Date(ws + 'T12:00:00'); d.setDate(d.getDate() + 5); return fmtDate(d); }

function calcHours(ci, co, bm, dt) {
  var ms = new Date(co) - new Date(ci), min = Math.max(0, ms / 60000 - bm), th = Math.round(min / 6) / 10;
  if (dt === 'Sunday' || dt === 'Holiday') return { regularHours: 0, unauthOT: 0, doubleTimeHours: th, totalHours: th };
  var tgt = getDailyTarget(dt), reg = Math.min(th, tgt), uot = Math.max(0, th - tgt);
  return { regularHours: reg, unauthOT: uot, doubleTimeHours: 0, totalHours: th };
}

function getUOT(r) { return (r.unauthOT != null ? r.unauthOT : (r.overtimeHours || 0)); }

function empWeekTotal(eid, curDate) {
  var ws = weekStart(curDate), we = weekEnd(ws);
  return recs().filter(function(r) {
    return r.employeeId === eid && r.status === 'completed' && r.clockIn && r.clockIn.slice(0, 10) >= ws && r.clockIn.slice(0, 10) <= we;
  }).reduce(function(s, r) { return s + (r.totalHours || 0); }, 0);
}

function mondaysInMonth(y, m) {
  var c = 0, d = new Date(y, m, 1), dw = d.getDay(), toM = dw === 0 ? 1 : (dw === 1 ? 0 : 8 - dw);
  d.setDate(d.getDate() + toM);
  while (d.getMonth() === m && d.getFullYear() === y) { c++; d.setDate(d.getDate() + 7); }
  return c;
}

function empMonthHours(eid, y, m) {
  var ms = y + '-' + String(m + 1).padStart(2, '0');
  var rs = recs().filter(function(r) { return r.employeeId === eid && r.status === 'completed' && r.clockIn && r.clockIn.slice(0, 7) === ms; });
  var t = { regular: 0, unauthOT: 0, doubleTime: 0, total: 0, count: rs.length };
  rs.forEach(function(r) { t.regular += (r.regularHours || 0); t.unauthOT += getUOT(r); t.doubleTime += (r.doubleTimeHours || 0); t.total += (r.totalHours || 0); });
  t.target = getWeeklyTarget() * mondaysInMonth(y, m);
  t.overTarget = Math.max(0, t.total - t.target);
  return t;
}

    var reg = 0, uot = 0, dt = 0;

  });

function drawBar(canvas, data, maxVal) {
  if (!canvas) return;
  var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height, pad = { t: 10, r: 10, b: 30, l: 10 }, ch = H - pad.t - pad.b, n = data.length;
  maxVal = Math.max(maxVal * 1.2, 1);
  if (!n) { ctx.fillStyle = '#6a7199'; ctx.font = '13px Space Grotesk'; ctx.textAlign = 'center'; ctx.fillText('No data', W / 2, H / 2); return; }
  var cw = W - pad.l - pad.r, gap = Math.max(4, Math.min(12, cw / n * .3)), bw = Math.max(8, (cw - gap * (n + 1)) / n);
  var ty = pad.t + ch * (1 - maxVal / maxVal);
  ctx.strokeStyle = 'rgba(232,168,56,.3)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, ty); ctx.lineTo(W - pad.r, ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(232,168,56,.5)'; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'left';
  ctx.fillText(fmtHM(maxVal), pad.l + 2, ty - 4);
  data.forEach(function(d, i) {
    var x = pad.l + gap + (bw + gap) * i;
    var rh = Math.max(0, (d.reg / maxVal) * ch), ry = pad.t + ch - rh;
    ctx.fillStyle = '#34d399'; rR(ctx, x, ry, bw * .55, rh, 3);
    var uh = Math.max(0, (d.uot / maxVal) * ch), uy = ry - uh;
    ctx.fillStyle = '#f87171'; rR(ctx, x + bw * .55, uy, uh, 3);
    if (d.dt > 0) { ctx.fillStyle = '#c084fc'; ctx.beginPath(); ctx.arc(x + bw / 2, uy - 6, 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#6a7199'; ctx.font = '10px Space Grotesk'; ctx.textAlign = 'center';
    ctx.save(); ctx.translate(x + bw / 2, H - pad.b + 14); ctx.rotate(-0.4); ctx.fillText(d.label, 0, 0); ctx.restore();
  });
}

function drawDonut(canvas, segs) {
  if (!canvas) return;
  var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height, cx = W / 2, cy = H / 2 - 5, r = Math.min(W, H) / 2 - 20, ir = r * .6;
  var total = segs.reduce(function(s, x) { return s + x.v; }, 0);
  if (total === 0) { ctx.strokeStyle = '#252d42'; ctx.lineWidth = r - ir; ctx.beginPath(); ctx.arc(cx, cy, (r + ir) / 2, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#6a7199'; ctx.font = '13px Space Grotesk'; ctx.textAlign = 'center'; ctx.fillText('No data', cx, cy + 4); return; }
  var angle = -Math.PI / 2;
  segs.forEach(function(seg) {
    if (seg.v <= 0) return;
    var sw = (seg.v / total) * Math.PI * 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, angle, angle + sw); ctx.arc(cx, cy, ir, angle + sw, angle, true); ctx.closePath();
    ctx.fillStyle = seg.c; ctx.fill(); angle += sw;
  });
  ctx.fillStyle = '#e4e6ec'; ctx.font = '700 16px JetBrains Mono'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fmtDec(total), cx, cy - 4);
  ctx.fillStyle = '#6a7199'; ctx.font = '11px Space Grotesk'; ctx.fillText('total hrs', cx, cy + 14); ctx.textBaseline = 'alphabetic';
}

function rR(ctx, x, y, w, h, r) {
  if (h <= 0) return; r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill();
}

function saveShift(sid) {
  var empId = document.getElementById('msh-emp').value, siteId = document.getElementById('msh-site').value;
  var date = document.getElementById('msh-date').value, start = document.getElementById('msh-start').value, end = document.getElementById('msh-end').value;
  if (!empId || !siteId || !date || !start || !end) { toast('All fields required', 'error'); return; }
  var obj = { employeeId: empId, siteId: siteId, date: date, startTime: start, endTime: end };
  if (sid) fbUpd('shifts/' + sid, obj);
  else { var id = db.ref('shifts').push().key; obj.id = id; fbSet('shifts/' + id, obj); }
  closeModal(); nav('shifts'); toast(sid ? 'Updated' : 'Added', 'success');
}

function delShift(id) {
  var s = shifts().find(function(x) { return x.id === id; });
  var rec = recs().find(function(r) { return r.shiftId === id && r.status === 'clocked_in'; });
  if (rec) { toast('Active clock record exists', 'error'); return; }
  toBin('shifts', id, s); nav('shifts'); toast('Moved to bin', 'info');
}

/* ===== Clock Records ===== */
function renderRecords() {
  var rc = recs(), td = S.recFilterDate || today(), st = S.recFilterStatus, si = S.recFilterSite;
  var filtered = rc.filter(function(r) {
    if (td && r.clockIn && r.clockIn.slice(0, 10) !== td) return false;
    if (st && r.status !== st) return false;
    if (si && r.siteId !== si) return false;
    return true;
  }).sort(function(a, b) { return new Date(b.clockIn || 0) - new Date(a.clockIn || 0); });
  var ss = sites();
  var sOpts = '<option value="">All Sites</option>';
  ss.forEach(function(s) { sOpts += '<option value="' + s.id + '"' + (si === s.id ? ' selected' : '') + '>' + escHtml(s.name) + '</option>'; });
  var h = '<div class="fade-in"><h2 class="text-xl font-bold tracking-tight mb-4">Clock Records</h2>';
  h += '<div class="filter-row"><div class="fg"><label>Date</label><input type="date" value="' + td + '" onchange="S.recFilterDate=this.value;nav(\'records\')"></div><div class="fg"><label>Status</label><select onchange="S.recFilterStatus=this.value;nav(\'records\')"><option value="">All</option><option value="clocked_in"' + (st === 'clocked_in' ? ' selected' : '') + '>Clocked In</option><option value="completed"' + (st === 'completed' ? ' selected' : '') + '>Completed</option></select></div><div class="fg"><label>Site</label><select onchange="S.recFilterSite=this.value;nav(\'records\')">' + sOpts + '</select></div></div>';
  if (filtered.length) {
    h += '<div style="overflow-x:auto"><table><thead><tr><th>Employee</th><th>Site</th><th>Clock In</th><th>Clock Out</th><th>NT / OT / DT</th><th>Total</th><th>Status</th></tr></thead><tbody>';
    filtered.forEach(function(r) {
      var dt = r.clockIn ? dayType(r.clockIn.slice(0, 10)) : '';
      h += '<tr><td><div class="font-medium">' + escHtml(empFullName(r.employeeId)) + '</div><div class="text-xs" style="color:var(--muted)">' + dayBadge(dt) + '</div></td><td class="text-sm" style="color:var(--muted)">' + escHtml(siteName(r.siteId)) + '</td><td class="mono text-xs">' + (r.clockIn ? fmtTime(r.clockIn) + ' ' + r.clockIn.slice(0, 10) : '—') + '</td><td class="mono text-xs">' + (r.clockOut ? fmtTime(r.clockOut) : '—') + '</td><td class="mono text-xs">' + hrsBreakdown(r) + '</td><td class="mono text-sm font-semibold">' + fmtDec(r.totalHours || 0) + '</td><td>' + statusBadge(r.status) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="empty-state card"><i class="fas fa-clock-rotate-left block"></i><p>No records found</p></div>';
  }
  return h + '</div>';
}

/* ===== Export ===== */
function renderExport() {
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  var h = '<div class="fade-in"><h2 class="text-xl font-bold tracking-tight mb-4">Export Timesheet</h2>';
  h += '<div class="card mb-4"><div class="grid gap-3" style="max-width:400px"><div class="grid grid-cols-2 gap-3"><div><label>Year</label><select id="exp-y">';
  for (var i = y - 1; i <= y + 1; i++) h += '<option value="' + i + '"' + (i === y ? ' selected' : '') + '>' + i + '</option>';
  h += '</select></div><div><label>Month</label><select id="exp-m">';
  var mn = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  mn.forEach(function(n, idx) { h += '<option value="' + idx + '"' + (idx === m ? ' selected' : '') + '>' + n + '</option>'; });
  h += '</select></div></div><button class="btn btn-primary" onclick="generateExport()"><i class="fas fa-download"></i> Generate CSV</button></div></div>';
  h += '<div class="jarrison-info mb-4"><h4><i class="fas fa-info-circle mr-1"></i> Format Info</h4><p>CSV uses decimal hours: <code>8.00</code> = 8h, <code>1.50</code> = 1h30m, <code>0.25</code> = 15m. Columns: Employee, ID, Site, Date, Day Type, Clock In, Clock Out, Break (min), Normal Time, Over Time, Double Time, Total Hours.</p></div>';
  h += '<div id="export-result"></div></div>';
  return h;
}

function generateExport() {
  var y = parseInt(document.getElementById('exp-y').value), m = parseInt(document.getElementById('exp-m').value);
  var prefix = y + '-' + String(m + 1).padStart(2, '0');
  var es = emps().filter(function(e) { return e.active; });
  var rows = [['Employee', 'ID', 'Site', 'Date', 'Day Type', 'Clock In', 'Clock Out', 'Break (min)', 'Normal Time', 'Over Time', 'Double Time', 'Total Hours']];
  var grandTotal = 0;
  es.forEach(function(e) {
    var ers = recs().filter(function(r) { return r.employeeId === e.id && r.status === 'completed' && r.clockIn && r.clockIn.slice(0, 7) === prefix; });
    ers.sort(function(a, b) { return a.clockIn.localeCompare(b.clockIn); });
    ers.forEach(function(r) {
      var ds = r.clockIn.slice(0, 10), dt = dayType(ds);
      rows.push([e.firstName + ' ' + e.lastName, e.employeeId, siteName(r.siteId), ds, dt, r.clockIn ? fmtTime(r.clockIn) : '', r.clockOut ? fmtTime(r.clockOut) : '', r.breakMinutes || 0, fmtDec(r.regularHours || 0), fmtDec(getUOT(r)), fmtDec(r.doubleTimeHours || 0), fmtDec(r.totalHours || 0)]);
      grandTotal += (r.totalHours || 0);
    });
    if (!ers.length) rows.push([e.firstName + ' ' + e.lastName, e.employeeId, siteName(e.siteId), '', '', '', '', '', '0.00', '0.00', '0.00', '0.00']);
  });
  var csv = rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var fname = 'timesheet_' + prefix + '.csv';
  document.getElementById('export-result').innerHTML = '<div class="card"><div class="flex items-center justify-between"><div><div class="font-semibold">Generated Successfully</div><div class="text-sm" style="color:var(--muted)">' + (rows.length - 1) + ' rows · ' + fmtDec(grandTotal) + ' total hours</div></div><button class="btn btn-primary" onclick="downloadFile(document.getElementById(\'exp-csv\').textContent,\'' + fname + '\',\'text/csv\')"><i class="fas fa-download"></i> Download</button></div><textarea id="exp-csv" style="display:none">' + escHtml(csv) + '</textarea></div>';
}

/* ===== Recycle Bin ===== */
function renderRecycleBin() {
  var bin = D.recycleBin, h = '<div class="fade-in"><div class="flex items-center justify-between mb-5"><div><h2 class="text-xl font-bold tracking-tight">Recycle Bin</h2><p class="text-sm" style="color:var(--muted)">Items auto-deleted after 30 days</p></div>';
  var total = 0;
  ['sites', 'employees', 'shifts', 'records'].forEach(function(t) { if (bin[t]) total += Object.keys(bin[t]).length; });
  if (total) h += '<button class="btn btn-danger btn-sm" onclick="emptyBin()"><i class="fas fa-trash"></i> Empty All</button>';
  h += '</div>';
  var hasAny = false;
  ['sites', 'employees', 'shifts', 'records'].forEach(function(type) {
    var items = bin[type] || {};
    var keys = Object.keys(items);
    if (!keys.length) return;
    hasAny = true;
    var icon = type === 'sites' ? 'fa-location-dot' : type === 'employees' ? 'fa-users' : type === 'shifts' ? 'fa-calendar-days' : 'fa-clock-rotate-left';
    h += '<div class="card mb-3"><h3 class="text-sm font-semibold mb-3"><i class="fas ' + icon + ' mr-2" style="color:var(--accent)"></i>' + type.charAt(0).toUpperCase() + type.slice(1) + ' <span class="badge badge-amber ml-1">' + keys.length + '</span></h3>';
    keys.forEach(function(bid) {
      var it = items[bid], d = it.data;
      var label = '';
      if (type === 'sites') label = d.name || 'Site';
      else if (type === 'employees') label = (d.firstName || '') + ' ' + (d.lastName || '');
      else if (type === 'shifts') label = empFullName(d.employeeId) + ' - ' + (d.date || '');
      else label = empFullName(d.employeeId) + ' - ' + (d.clockIn ? d.clockIn.slice(0, 10) : '');
      var ago = it.at ? timeAgo(it.at) : '';
      h += '<div class="flex items-center justify-between py-2 border-b" style="border-color:var(--border)"><div><div class="text-sm font-medium">' + escHtml(label) + '</div><div class="text-xs" style="color:var(--muted)">Deleted ' + ago + '</div></div><div class="flex gap-1"><button class="btn btn-success btn-sm" onclick="fromBin(\'' + type + '\',\'' + bid + '\')"><i class="fas fa-rotate-left"></i></button><button class="btn btn-danger btn-sm" onclick="permDelBin(\'' + type + '\',\'' + bid + '\')"><i class="fas fa-trash"></i></button></div></div>';
    });
    h += '</div>';
  });
  if (!hasAny) h += '<div class="empty-state card"><i class="fas fa-recycle block"></i><p>Bin is empty</p></div>';
  return h + '</div>';
}

/* ===== Settings ===== */
function renderSettings() {
  var s = sett();
  var h = '<div class="fade-in"><h2 class="text-xl font-bold tracking-tight mb-5">Settings</h2>';
  h += '<div class="grid gap-4" style="max-width:600px">';
  h += '<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-bullseye mr-2" style="color:var(--accent)"></i>Hour Targets</h3><div class="grid gap-3"><div class="grid grid-cols-2 gap-3"><div><label>Weekday Daily Target (hrs)</label><input type="number" id="set-wd" value="' + (s.weekdayDailyTarget || 8) + '" min="0" max="24" step="0.5"></div><div><label>Saturday Daily Target (hrs)</label><input type="number" id="set-sat" value="' + (s.saturdayDailyTarget || 5) + '" min="0" max="24" step="0.5"></div></div><div><label>Weekly Target (hrs)</label><input type="number" id="set-wk" value="' + (s.weeklyTarget || 45) + '" min="0" max="168" step="0.5"></div><div><label>Default Break (minutes)</label><input type="number" id="set-bm" value="' + (s.defaultBreak || 30) + '" min="0" max="480" step="5"></div><button class="btn btn-primary" onclick="saveTargets()"><i class="fas fa-check"></i> Save Targets</button></div></div>';
  h += '<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-umbrella-beach mr-2" style="color:var(--purple)"></i>Holidays <span class="badge badge-purple ml-1">' + hols().length + '</span></h3><div class="flex gap-2 mb-3"><input type="date" id="set-hol" class="flex-1"><button class="btn btn-secondary btn-sm" onclick="addHol()"><i class="fas fa-plus"></i> Add</button></div><div class="flex flex-wrap gap-1" id="hol-list">';
  hols().forEach(function(d) { h += '<span class="badge badge-purple" style="cursor:pointer;padding:.25rem .6rem" onclick="rmHol(\'' + d + '\')">' + d + ' <i class="fas fa-xmark ml-1" style="font-size:.6rem"></i></span>'; });
  h += '</div></div>';
  h += '<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-shield-halved mr-2" style="color:var(--danger)"></i>Admin Credentials</h3><div class="grid gap-3"><div><label>Username</label><input id="set-au" value="' + escHtml(D.admin.username || '') + '"></div><div><label>New Password</label><input id="set-ap" type="password" placeholder="Leave blank to keep current"></div><button class="btn btn-primary" onclick="saveAdminCreds()"><i class="fas fa-check"></i> Update</button></div></div>';
  h += '</div></div>';
  return h;
}

function saveTargets() {
  var obj = {
    weekdayDailyTarget: parseFloat(document.getElementById('set-wd').value) || 8,
    saturdayDailyTarget: parseFloat(document.getElementById('set-sat').value) || 5,
    weeklyTarget: parseFloat(document.getElementById('set-wk').value) || 45,
    defaultBreak: parseInt(document.getElementById('set-bm').value) || 30,
    holidays: hols()
  };
  fbSet('settings', obj); D.settings = obj; toast('Targets saved', 'success');
}

function addHol() {
  var d = document.getElementById('set-hol').value;
  if (!d) return;
  var hs = hols();
  if (hs.indexOf(d) !== -1) { toast('Already exists', 'error'); return; }
  hs.push(d); hs.sort();
  var s = sett(); s.holidays = hs;
  fbSet('settings', s); D.settings = s; nav('settings'); toast('Holiday added', 'success');
}

function rmHol(d) {
  var hs = hols().filter(function(h) { return h !== d; });
  var s = sett(); s.holidays = hs;
  fbSet('settings', s); D.settings = s; nav('settings'); toast('Removed', 'info');
}

function saveAdminCreds() {
  var u = document.getElementById('set-au').value.trim(), p = document.getElementById('set-ap').value;
  if (!u) { toast('Username required', 'error'); return; }
  var obj = { username: u, password: p || D.admin.password };
  fbSet('admin', obj); D.admin = obj; toast('Credentials updated', 'success');
}

/* ===== Employee Clock Page ===== */
function renderClockPage() {
  var emp = S.emp, site = emp ? sites().find(function(s) { return s.id === emp.siteId; }) : null;
  var cls = S.clockState === 'clocked_in' ? 'ci' : S.clockState === 'idle' ? 'idle' : 'co';
  var icon = S.clockState === 'clocked_in' ? 'fa-fingerprint' : S.clockState === 'idle' ? 'fa-fingerprint' : 'fa-fingerprint';
  var label = S.clockState === 'clocked_in' ? 'CLOCK OUT' : 'CLOCK IN';
  var sub = S.clockState === 'clocked_in' ? 'Tap to end shift' : 'Tap to start shift';
  var elapsed = '00:00:00';
  if (S.clockState === 'clocked_in' && S.activeRec) {
    var ms = Date.now() - new Date(S.activeRec.clockIn).getTime();
    elapsed = fmtClock(ms / 3600000);
  }
  var h = '<div class="fade-in"><div class="emp-hero mb-6"><div class="emp-avatar">' + (emp ? emp.firstName.charAt(0) + emp.lastName.charAt(0) : '?') + '</div><div class="font-bold text-lg">' + (emp ? escHtml(emp.firstName + ' ' + emp.lastName) : '') + '</div><div class="text-sm" style="color:var(--muted)">' + (emp ? escHtml(emp.employeeId) : '') + '</div><div class="text-xs mt-1" style="color:var(--muted)"><i class="fas fa-location-dot mr-1" style="color:var(--accent)"></i>' + (site ? escHtml(site.name) : 'No site assigned') + '</div></div>';
  h += '<div class="flex flex-col items-center mb-6"><div class="clock-face ' + cls + '" id="clock-btn" onclick="toggleClock()"><div class="clock-ring"></div><div class="cf-icon"><i class="fas ' + icon + '" style="color:' + (S.clockState === 'clocked_in' ? 'var(--success)' : 'var(--accent)') + '"></i></div><div class="cf-label">' + label + '</div><div class="cf-sub">' + sub + '</div></div>';
  h += '<div class="mono text-3xl font-bold mt-4" id="elapsed-timer">' + elapsed + '</div>';
  if (S.gpsDist != null) {
    var inRange = S.gpsDist <= (site ? site.radius : 999);
    h += '<div class="flex items-center gap-2 mt-2 text-sm"><span class="conn-dot ' + (inRange ? 'on' : 'off') + '"></span><span style="color:' + (inRange ? 'var(--success)' : 'var(--danger)') + '">' + Math.round(S.gpsDist) + 'm from site' + (inRange ? ' (in range)' : ' (out of range)') + '</span></div>';
  } else {
    h += '<div class="text-xs mt-2" style="color:var(--muted)">GPS: acquiring...</div>';
  }
  h += '</div>';
  if (S.clockState === 'clocked_in' && S.activeRec) {
    var ws = weekStart(today()), wt = empWeekTotal(emp.id, today()), wTarget = getWeeklyTarget();
    var pct = Math.min(100, (wt / wTarget) * 100);
    h += '<div class="card"><h4 class="text-sm font-semibold mb-2">This Week</h4><div class="flex items-center justify-between text-sm mb-1"><span style="color:var(--muted)">Progress</span><span class="mono">' + fmtDec(wt) + ' / ' + wTarget + 'h</span></div><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;background:' + (pct >= 100 ? 'var(--success)' : 'var(--accent)') + '"></div></div></div>';
  }
  h += '</div>';
  return h;
}

function initClockPage() {
  clearInterval(S.timerInt); clearInterval(S.clockInt);
  getEmpGps();
  (function tickTimer() {
    var el = document.getElementById('elapsed-timer');
    if (!el) { clearInterval(S.timerInt); return; }
    if (S.clockState === 'clocked_in' && S.activeRec) {
      var ms = Date.now() - new Date(S.activeRec.clockIn).getTime();
      el.textContent = fmtClock(ms / 3600000);
    }
    S.timerInt = setInterval(tickTimer, 1000);
  })();
  S.clockInt = setInterval(getEmpGps, 30000);
}

function getEmpGps() {
  if (!navigator.geolocation || !S.emp) return;
  var site = sites().find(function(s) { return s.id === S.emp.siteId; });
  if (!site) { S.gpsDist = null; return; }
  navigator.geolocation.getCurrentPosition(function(p) {
    S.gpsLat = p.coords.latitude; S.gpsLng = p.coords.longitude;
    S.gpsDist = haversine(site.lat, site.lng, S.gpsLat, S.gpsLng);
    var dotEl = document.querySelector('#emp-content .conn-dot');
    if (dotEl) {
      var inRange = S.gpsDist <= site.radius;
      dotEl.className = 'conn-dot ' + (inRange ? 'on' : 'off');
    }
  }, function() { S.gpsDist = null; }, { enableHighAccuracy: true, timeout: 10000 });
}

function toggleClock() {
  if (S.clockState === 'idle' || S.clockState === 'completed') {
    // Clock IN
    var site = sites().find(function(s) { return s.id === S.emp.siteId; });
    if (!site) { toast('No site assigned', 'error'); return; }
    if (S.gpsDist != null && S.gpsDist > site.radius) {
      openModal('<h3 class="font-bold text-lg mb-3">Outside Geofence</h3><p class="text-sm mb-2" style="color:var(--muted)">You are <strong>' + Math.round(S.gpsDist) + 'm</strong> from site (radius: ' + site.radius + 'm).</p><p class="text-sm mb-4" style="color:var(--muted)">Clock in anyway?</p><div class="flex gap-3"><button class="btn btn-primary flex-1 justify-center" onclick="doClockIn(true)"><i class="fas fa-check"></i> Yes, Clock In</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');
      return;
    }
    doClockIn(false);
  } else if (S.clockState === 'clocked_in') {
    doClockOut();
  }
}

function doClockIn(force) {
  closeModal();
  var now = new Date(), id = db.ref('records').push().key;
  var rec = {
    id: id, employeeId: S.emp.id, siteId: S.emp.siteId,
    clockIn: now.toISOString(), clockOut: null,
    status: 'clocked_in', breakMinutes: 0,
    regularHours: 0, unauthOT: 0, doubleTimeHours: 0, totalHours: 0,
    gpsLat: S.gpsLat, gpsLng: S.gpsLng, gpsDist: S.gpsDist,
    forceGeo: !!force
  };
  fbSet('records/' + id, rec);
  S.clockState = 'clocked_in'; S.activeRec = rec;
  navEmp('clock'); toast('Clocked in', 'success');
}

function doClockOut() {
  if (!S.activeRec) return;
  var now = new Date(), rec = S.activeRec;
  var ds = rec.clockIn.slice(0, 10), dt = dayType(ds), bm = sett().defaultBreak || 30;
  var hrs = calcHours(rec.clockIn, now.toISOString(), bm, dt);
  var updates = {
    clockOut: now.toISOString(), status: 'completed', breakMinutes: bm,
    regularHours: hrs.regularHours, unauthOT: hrs.unauthOT,
    doubleTimeHours: hrs.doubleTimeHours, totalHours: hrs.totalHours
  };
  fbUpd('records/' + rec.id, updates);
  S.clockState = 'completed'; S.activeRec = null;
  navEmp('clock');
  toast('Clocked out — ' + fmtDec(hrs.totalHours) + 'h total', 'success');
}

/* ===== Employee History ===== */
function renderEmpHistory() {
  var emp = S.emp, rc = recs().filter(function(r) { return r.employeeId === emp.id; });
  rc.sort(function(a, b) { return new Date(b.clockIn || 0) - new Date(a.clockIn || 0); });
  var h = '<div class="fade-in"><h2 class="text-xl font-bold tracking-tight mb-4">My History</h2>';
  if (rc.length) {
    h += '<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Day</th><th>In</th><th>Out</th><th>NT / OT / DT</th><th>Total</th><th>Status</th></tr></thead><tbody>';
    rc.forEach(function(r) {
      var ds = r.clockIn ? r.clockIn.slice(0, 10) : '';
      var dt = ds ? dayType(ds) : '';
      h += '<tr><td class="mono text-xs">' + ds + '</td><td>' + dayBadge(dt) + '</td><td class="mono text-xs">' + (r.clockIn ? fmtTime(r.clockIn) : '—') + '</td><td class="mono text-xs">' + (r.clockOut ? fmtTime(r.clockOut) : '—') + '</td><td class="mono text-xs">' + hrsBreakdown(r) + '</td><td class="mono text-sm font-semibold">' + fmtDec(r.totalHours || 0) + '</td><td>' + statusBadge(r.status) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="empty-state card"><i class="fas fa-history block"></i><p>No records yet</p></div>';
  }
  return h + '</div>';
}

/* ===== Keyboard shortcuts for login ===== */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!document.getElementById('login-screen').classList.contains('hidden')) {
      var adminVisible = !document.getElementById('login-admin').classList.contains('hidden');
      if (adminVisible) adminLogin();
      else employeeLogin();
    }
  }
});

initFirebase(FB_CONFIG);
</script>
