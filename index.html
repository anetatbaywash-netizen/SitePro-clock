<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SitePro Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0e16;--bg2:#131620;--card:#1a1e2e;--card2:#212638;--border:#2a3048;--fg:#e2e4ea;--muted:#6b7094;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:8px;font-weight:500;font-size:.875rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#0c0e16}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.3)}.btn-danger:hover{background:rgba(248,113,113,.25)}
.btn-success{background:rgba(52,211,153,.15);color:var(--success);border:1px solid rgba(52,211,153,.3)}.btn-success:hover{background:rgba(52,211,153,.25)}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.6rem .8rem;border-radius:8px;font-family:inherit;font-size:.875rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--card);color:var(--fg)}
label{font-size:.8rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.3rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;color:var(--muted);font-size:.875rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.05)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.08);border-left-color:var(--accent)}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.8rem 1.2rem;border-radius:8px;font-size:.85rem;display:flex;align-items:center;gap:.6rem;animation:slideIn .3s ease;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-success{background:#065f46;border:1px solid #34d399;color:#a7f3d0}
.toast-error{background:#7f1d1d;border:1px solid #f87171;color:#fecaca}
.toast-info{background:#0c4a6e;border:1px solid #38bdf8;color:#bae6fd}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 30px rgba(52,211,153,.15)}50%{box-shadow:0 0 60px rgba(52,211,153,.3)}}
@keyframes breathe-out{0%,100%{box-shadow:0 0 30px rgba(248,113,113,.15)}50%{box-shadow:0 0 60px rgba(248,113,113,.3)}}
.fade-in{animation:fadeIn .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:1.5rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.6rem .8rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
td{padding:.6rem .8rem;font-size:.85rem;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}
tr:hover td{background:rgba(232,168,56,.03)}
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.15);color:var(--success)}
.badge-red{background:rgba(248,113,113,.15);color:var(--danger)}
.badge-amber{background:rgba(232,168,56,.15);color:var(--accent)}
.badge-blue{background:rgba(56,189,248,.15);color:var(--info)}
.badge-purple{background:rgba(168,85,247,.15);color:#c084fc}
.bg-pattern{background-image:radial-gradient(circle at 1px 1px,rgba(232,168,56,.04) 1px,transparent 0);background-size:40px 40px}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.conn-dot.loading{background:var(--warning);animation:pulse-ring 1s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--fg)}
.clock-face{position:relative;width:280px;height:280px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;user-select:none}
.clock-face.clock-in-face{background:radial-gradient(circle at 40% 35%,rgba(52,211,153,.12),var(--card) 70%);border:3px solid var(--success);animation:breathe 3s ease-in-out infinite}
.clock-face.clock-in-face:hover{transform:scale(1.04)}
.clock-face.clock-in-face:active{transform:scale(.97)}
.clock-face.clock-out-face{background:radial-gradient(circle at 40% 35%,rgba(248,113,113,.12),var(--card) 70%);border:3px solid var(--danger);animation:breathe-out 2s ease-in-out infinite}
.clock-face.clock-out-face:hover{transform:scale(1.04)}
.clock-face.clock-out-face:active{transform:scale(.97)}
.clock-face .cf-icon{font-size:2.5rem;margin-bottom:.25rem}
.clock-face .cf-label{font-size:1rem;font-weight:700;letter-spacing:.05em}
.clock-face .cf-sub{font-size:.7rem;color:var(--muted);font-weight:400;margin-top:.15rem}
.clock-face::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:2px solid;opacity:0;animation:pulse-ring 2.5s ease-out infinite;pointer-events:none}
.clock-in-face::after{border-color:var(--success)}
.clock-out-face::after{border-color:var(--danger)}
.big-time{font-family:'JetBrains Mono',monospace;font-size:3.5rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.big-date{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.emp-hero{background:linear-gradient(180deg,rgba(232,168,56,.04) 0%,transparent 60%);border-radius:16px;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.emp-hero .emp-avatar{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;margin-bottom:.75rem;border:2px solid var(--accent);color:var(--accent);background:var(--card)}
.ts-table{border-collapse:collapse;width:100%}
.ts-table th,.ts-table td{border:1px solid var(--border);padding:.45rem .6rem;font-size:.78rem;text-align:center;white-space:nowrap}
.ts-table th{background:var(--bg2);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.7rem}
.ts-table .row-label{background:var(--bg2);color:var(--muted);font-weight:600;text-align:left;min-width:80px;font-size:.75rem}
.ts-table .total-row{background:rgba(232,168,56,.06);font-weight:700}
.ts-table .pay-row{background:rgba(52,211,153,.06);font-weight:700;color:var(--success)}
.ts-table .day-header{color:var(--accent);font-weight:700}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.35rem;max-height:200px;overflow-y:auto;padding:.25rem}
.cb-grid label{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--fg);cursor:pointer;padding:.25rem .4rem;border-radius:6px;transition:background .15s;margin:0}
.cb-grid label:hover{background:rgba(232,168,56,.08)}
.cb-grid input[type=checkbox]{width:auto;accent-color:var(--accent)}
.dow-row{display:flex;flex-wrap:wrap;gap:.4rem}
.dow-row label{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;cursor:pointer;padding:.3rem .6rem;border:1px solid var(--border);border-radius:6px;margin:0}
.dow-row input[type=checkbox]{width:auto;accent-color:var(--accent)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-face{width:220px;height:220px}.clock-face .cf-icon{font-size:2rem}.big-time{font-size:2.5rem}}
@media print{.sidebar,.toast-container,header,nav{display:none!important}.main-content{margin-left:0!important;padding:1rem!important}.card{break-inside:avoid;border:1px solid #ccc}}
</style>
</head>
<body class="bg-pattern">
<div id="toast-container" class="toast-container"></div>
<div id="loading-screen" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing...</p></div>
</div>
<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md fade-in" style="border-color:color-mix(in srgb,var(--accent) 20%,var(--border))">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div>
      <h1 class="text-2xl font-bold">SitePro Clock In</h1>
      <p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p>
    </div>
    <div class="flex mb-6 border-b" style="border-color:var(--border)">
      <button class="tab-btn flex-1" onclick="switchLoginTab('admin')"><i class="fas fa-shield-halved mr-1"></i> Admin</button>
      <button class="tab-btn active flex-1" onclick="switchLoginTab('employee')"><i class="fas fa-user mr-1"></i> Employee</button>
    </div>
    <div id="login-admin" class="hidden">
      <div class="mb-4"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div>
      <div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div>
      <button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button>
    </div>
    <div id="login-employee">
      <div class="mb-4"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off"></div>
      <div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4"></div>
      <button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button>
    </div>
  </div>
</div>
<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div><div class="font-bold text-sm">SitePro Clock In</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div></div>
    <nav class="py-3" id="admin-nav">
      <div class="px-4 py-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Main</div>
      <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-gauge-high w-5 text-center"></i> Dashboard</a>
      <a class="sidebar-link" data-page="sites"><i class="fas fa-location-dot w-5 text-center"></i> Sites</a>
      <a class="sidebar-link" data-page="employees"><i class="fas fa-users w-5 text-center"></i> Employees</a>
      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <a class="sidebar-link" data-page="approvals"><i class="fas fa-clipboard-check w-5 text-center"></i> Approvals <span id="approval-badge" class="hidden badge badge-red ml-auto" style="font-size:.6rem">0</span></a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Data</div>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Timesheet Export</a>
      <a class="sidebar-link" data-page="recyclebin"><i class="fas fa-recycle w-5 text-center"></i> Recycle Bin</a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">System</div>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
</div>
<div id="employee-layout" class="hidden">
  <div class="min-h-screen flex flex-col">
    <header class="p-4 flex items-center justify-between border-b" style="border-color:var(--border);background:var(--bg2)">
      <div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xs" style="color:#0c0e16"></i></div><span class="font-bold text-sm">SitePro</span><span class="conn-dot on" id="emp-conn-dot"></span></div>
      <div class="flex items-center gap-3"><span id="emp-header-name" class="text-sm hidden sm:inline" style="color:var(--muted)"></span><button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i></button></div>
    </header>
    <div class="flex-1 flex">
      <nav class="w-16 sm:w-48 border-r flex flex-col pt-4" style="border-color:var(--border);background:var(--bg2)" id="emp-nav">
        <a class="sidebar-link active" data-epage="clock" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-fingerprint text-lg"></i><span class="text-xs hidden sm:inline mt-1">Clock</span></a>
        <a class="sidebar-link" data-epage="history" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-history text-lg"></i><span class="text-xs hidden sm:inline mt-1">History</span></a>
      </nav>
      <main class="flex-1 p-4 sm:p-6" id="emp-content"></main>
    </div>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box fade-in" id="modal-box"></div></div>

<script>
/* ============================================
   FIREBASE CONFIG & DATA
   ============================================ */
var EMBEDDED_FB = {
  apiKey:"AIzaSyAkHU3eWCWTUt3Ks0Vxq3PkgcATtin0Zaw",
  authDomain:"baywashclock.firebaseapp.com",
  databaseURL:"https://baywashclock-default-rtdb.firebaseio.com",
  projectId:"baywashclock",
  storageBucket:"baywashclock.firebasestorage.app",
  messagingSenderId:"207388184141",
  appId:"1:207388184141:web:718d4348bc91672a369604"
};

var db = null;
var fbConnected = false;
var dataLoaded = 0;
var initialLoadDone = false;
var D = { sites:[], employees:[], shifts:[], records:[], settings:{}, admin:{}, recycleBin:{} };

function initFirebase(config) {
  firebase.initializeApp(config);
  db = firebase.database();
  db.ref('.info/connected').on('value', function(s) {
    fbConnected = (s.val() === true);
    updateConnDots();
  });
  db.ref('sites').on('value', function(s) { D.sites = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('employees').on('value', function(s) { D.employees = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('shifts').on('value', function(s) { D.shifts = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('records').on('value', function(s) { D.records = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); updateApprovalBadge(); });
  db.ref('settings').on('value', function(s) { D.settings = s.val() || {}; dataLoaded++; checkAllLoaded(); });
  db.ref('admin').on('value', function(s) { D.admin = s.val() || {}; dataLoaded++; checkAllLoaded(); });
  db.ref('recycleBin').on('value', function(s) { D.recycleBin = s.val() || {}; dataLoaded++; checkAllLoaded(); });
}

function checkAllLoaded() {
  if (dataLoaded >= 7 && !initialLoadDone) {
    initialLoadDone = true;
    document.getElementById('loading-screen').classList.add('hidden');
    if (!D.admin || !D.admin.username) { seedFirebase(); }
    cleanExpiredBin();
    showScreen('login-screen');
  }
}

function updateConnDots() {
  var cls = fbConnected ? 'conn-dot on' : 'conn-dot off';
  var lbl = fbConnected ? 'Synced' : 'Offline';
  var dots = document.querySelectorAll('#login-conn-dot,#admin-conn-dot,#emp-conn-dot');
  for (var i = 0; i < dots.length; i++) { dots[i].className = cls; }
  var el = document.getElementById('admin-conn-label');
  if (el) { el.textContent = lbl; }
}

function fbSet(p, d) { if (db) { db.ref(p).set(d).catch(function(e) { toast('Sync error: ' + e.message, 'error'); }); } }
function fbUpdate(p, d) { if (db) { db.ref(p).update(d).catch(function(e) { toast('Sync error: ' + e.message, 'error'); }); } }
function fbRemove(p) { if (db) { db.ref(p).remove().catch(function(e) { toast('Sync error: ' + e.message, 'error'); }); } }

function getSites() { return D.sites || []; }
function getEmployees() { return D.employees || []; }
function getShifts() { return D.shifts || []; }
function getRecords() { return D.records || []; }
function getSettings() { return D.settings || {}; }
function getHolidays() { return (D.settings && D.settings.holidays) ? D.settings.holidays : []; }
function getBinItems() { return D.recycleBin || {}; }

function seedFirebase() {
  fbSet('admin', { username:'admin', password:'admin123' });
  fbSet('settings', {
    weeklyTarget:45, overtimeAfter:45, defaultBreak:30, graceMinutes:10,
    holidays:['2025-01-01','2025-03-21','2025-04-18','2025-04-21','2025-05-01','2025-05-04','2025-05-25','2025-05-29','2025-08-26','2025-12-10','2025-12-25','2025-12-26','2026-01-01','2026-03-21','2026-04-03','2026-04-06','2026-05-01','2026-05-04','2026-05-14','2026-05-25','2026-08-26','2026-12-10','2026-12-25','2026-12-26']
  });
  fbSet('recycleBin', {});
  var s1 = db.ref('sites').push().key;
  var s2 = db.ref('sites').push().key;
  fbSet('sites/' + s1, { id:s1, name:'Baywash Chemicals Windhoek', address:'Windhoek, Namibia', lat:-22.5609, lng:17.0658, radius:100 });
  fbSet('sites/' + s2, { id:s2, name:'Baywash Chemicals Swakopmund', address:'Swakopmund, Namibia', lat:-22.6754, lng:14.5256, radius:100 });
  var e1 = db.ref('employees').push().key;
  var e2 = db.ref('employees').push().key;
  var e3 = db.ref('employees').push().key;
  fbSet('employees/' + e1, { id:e1, firstName:'James', lastName:'Carter', employeeId:'EMP001', pin:'1234', siteId:s1, active:true });
  fbSet('employees/' + e2, { id:e2, firstName:'Sarah', lastName:'Mitchell', employeeId:'EMP002', pin:'5678', siteId:s1, active:true });
  fbSet('employees/' + e3, { id:e3, firstName:'Daniel', lastName:'Nguyen', employeeId:'EMP003', pin:'4321', siteId:s2, active:true });
}

/* ============================================
   APP STATE
   ============================================ */
var state = {
  loggedIn: false, role: null, currentPage: 'dashboard', empPage: 'clock',
  currentEmployee: null, clockState: 'idle', activeRecord: null,

/* ============================================
   UTILITY FUNCTIONS
   ============================================ */
function fmtDate(d) {
  var dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function fmtTime(d) {
  var dt = (d instanceof Date) ? d : new Date(d);
  return String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
}
function todayStr() { return fmtDate(new Date()); }
function getSiteName(id) { var s = getSites().find(function(x) { return x.id === id; }); return s ? s.name : 'Unknown'; }
function getEmpById(id) { return getEmployees().find(function(x) { return x.id === id; }); }
function haversine(lat1,lon1,lat2,lon2) {
  var R=6371000, t=function(n){return n*Math.PI/180;};
  var dLat=t(lat2-lat1), dLon=t(lon2-lon1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtHrs(h) { return (Math.round((h||0)*100)/100).toFixed(2); }
function timeAgo(ts) {
  var s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function getTierConfig() {
  var s = getSettings();
  return { target: s.weeklyTarget||45, otAfter: s.overtimeAfter!=null ? s.overtimeAfter : (s.weeklyTarget||45) };
}
function timeToMinutes(t) { var p = t.split(':'); return parseInt(p[0])*60 + parseInt(p[1]||0); }

/* ============================================
   HOURS CALCULATION
   ============================================ */
function isSunday(ds) { return new Date(ds + 'T12:00:00').getDay() === 0; }
function isHoliday(ds) { return getHolidays().indexOf(ds) !== -1; }
function getDayType(ds) {
  if (isSunday(ds)) return 'Sunday';
  if (isHoliday(ds)) return 'Holiday';
  return 'Weekday';
}
function getWeekStart(ds) {
  var d = new Date(ds + 'T12:00:00'), day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return fmtDate(d);
}
function getWeekDates(ws) {
  var dates = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(ws + 'T12:00:00');
    d.setDate(d.getDate() + i);
    dates.push(fmtDate(d));
  }
  return dates;
}
function getEmployeeWeekWorkedHours(empId, curDate) {
  var ws = getWeekStart(curDate);
  var we = new Date(ws + 'T12:00:00');
  we.setDate(we.getDate() + 6);
  var wes = fmtDate(we);
  return getRecords().filter(function(r) {
    return r.employeeId === empId && r.status === 'completed' && r.clockIn &&
      r.clockIn.slice(0,10) >= ws && r.clockIn.slice(0,10) <= wes &&
      r.dayType !== 'Sunday' && r.dayType !== 'Holiday';
  }).reduce(function(s, r) { return s + (r.totalHours || 0); }, 0);
}
function calcHours(ci, co, bm, weekWorked, dayType, tierCfg) {
  var totalMs = new Date(co) - new Date(ci);
  var totalMin = Math.max(0, totalMs / 60000 - bm);
  var totalHrs = Math.round(totalMin / 6) / 10;
  if (dayType === 'Sunday' || dayType === 'Holiday') {
    return { regularHours:0, overtimeHours:0, doubleTimeHours:totalHrs, totalHours:totalHrs };
  }
  var start = weekWorked, end = weekWorked + totalHrs, regular = 0, overtime = 0;
  if (start < tierCfg.otAfter) regular += Math.min(end, tierCfg.otAfter) - start;
  if (end > tierCfg.otAfter) overtime += end - Math.max(start, tierCfg.otAfter);
  return { regularHours:regular, overtimeHours:overtime, doubleTimeHours:0, totalHours:totalHrs };
}

/* ============================================
   APPROVAL LOGIC
   ============================================ */
function getGraceMinutes() { return (D.settings && D.settings.graceMinutes != null) ? D.settings.graceMinutes : 10; }

function checkNeedsApproval(record) {
  var shift = getShifts().find(function(s) { return s.id === record.shiftId; });
  if (!shift) return { needsApproval:true, reason:'No shift scheduled for this day' };
  var grace = getGraceMinutes();
  var ciMin = timeToMinutes(fmtTime(new Date(record.clockIn)));
  var shiftStartMin = timeToMinutes(shift.startTime);
  var shiftEndMin = timeToMinutes(shift.endTime);
  var reasons = [];
  if (ciMin < shiftStartMin - grace) {
    var diff = shiftStartMin - ciMin;
    reasons.push('Clocked in ' + Math.floor(diff/60) + 'h ' + (diff%60) + 'm before shift');
  }
  if (record.clockOut) {
    var coMin = timeToMinutes(fmtTime(new Date(record.clockOut)));
    if (coMin > shiftEndMin + grace) {
      var diff2 = coMin - shiftEndMin;
      reasons.push('Clocked out ' + Math.floor(diff2/60) + 'h ' + (diff2%60) + 'm after shift');
    }
  }
  if (reasons.length) return { needsApproval:true, reason:reasons.join('; ') };
  return { needsApproval:false, reason:'' };
}

function updateApprovalBadge() {
  var pending = getRecords().filter(function(r) { return r.needsApproval && !r.approved && !r.rejected && r.status === 'completed'; }).length;
  var badge = document.getElementById('approval-badge');
  if (badge) {
    if (pending > 0) { badge.classList.remove('hidden'); badge.textContent = pending; }
    else { badge.classList.add('hidden'); }
  }
}

/* ============================================
   RECYCLE BIN
   ============================================ */
var BIN_TTL = 30*24*60*60*1000;
function moveToBin(type, id, data) {
  var binId = db.ref('recycleBin/' + type).push().key;
  fbSet('recycleBin/' + type + '/' + binId, { originalId:id, data:data, deletedAt:new Date().toISOString() });
  fbRemove(type + '/' + id);
}
function restoreFromBin(type, binId) {
  var item = D.recycleBin[type] && D.recycleBin[type][binId];
  if (!item) return;
  fbSet(type + '/' + (item.originalId || item.data.id), item.data);
  fbRemove('recycleBin/' + type + '/' + binId);
  toast('Restored', 'success');
  navigateAdmin('recyclebin');
}
function permanentDeleteBin(type, binId) {
  openModal('<h3 class="font-bold text-lg mb-3">Permanently Delete?</h3><p class="text-sm mb-4" style="color:var(--muted)">This cannot be undone.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="fbRemove(\'recycleBin/' + type + '/' + binId + '\');closeModal();navigateAdmin(\'recyclebin\');toast(\'Deleted\',\'success\')"><i class="fas fa-trash"></i> Delete</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');
}
function cleanExpiredBin() {
  var bin = D.recycleBin;
  if (!bin) return;
  var now = Date.now();
  var types = ['sites','employees','shifts','records'];
  for (var t = 0; t < types.length; t++) {
    var type = types[t];
    if (!bin[type]) continue;
    var keys = Object.keys(bin[type]);
    for (var k = 0; k < keys.length; k++) {
      var item = bin[type][keys[k]];
      if (item.deletedAt && (now - new Date(item.deletedAt).getTime()) > BIN_TTL) {
        fbRemove('recycleBin/' + type + '/' + keys[k]);
      }
    }
  }
}
function emptyBin() {
  openModal('<h3 class="font-bold text-lg mb-3">Empty Entire Recycle Bin?</h3><p class="text-sm mb-4" style="color:var(--muted)">All items permanently deleted.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="fbSet(\'recycleBin\',{});closeModal();navigateAdmin(\'recyclebin\');toast(\'Bin emptied\',\'success\')"><i class="fas fa-trash"></i> Empty</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');
}
function renderRecycleBin() {
  var bin = D.recycleBin;
  var types = [
    { key:'sites', label:'Sites', icon:'fa-location-dot', color:'var(--info)' },
    { key:'employees', label:'Employees', icon:'fa-users', color:'var(--accent)' },

  ];
  var totalItems = 0;
  for (var t = 0; t < types.length; t++) {

  }

  if (totalItems > 0) h += '<button class="btn btn-danger btn-sm" onclick="emptyBin()"><i class="fas fa-trash"></i> Empty Bin</button>';
  h += '</div>';
  var hasAny = false;
  for (var t = 0; t < types.length; t++) {
    var tp = types[t];
    var items = bin[tp.key] ? Object.entries(bin[tp.key]) : [];
    if (!items.length) continue;

    items.sort(function(a,b) { return new Date(b[1].deletedAt) - new Date(a[1].deletedAt); });
    h += '<div class="mb-6"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fas ' + tp.icon + '" style="color:' + tp.color + '"></i> ' + tp.label + ' <span class="badge badge-amber">' + items.length + '</span></h3>';
    h += '<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Item</th><th>Deleted</th><th>Expires</th><th>Actions</th></tr></thead><tbody>';
    for (var i = 0; i < items.length; i++) {
      var binId = items[i][0], item = items[i][1], d = item.data, name = '\u2014';
      if (tp.key === 'sites') name = d.name || 'Unknown';
      else if (tp.key === 'employees') name = (d.firstName||'') + ' ' + (d.lastName||'') + ' (' + (d.employeeId||'?') + ')';

      h += '<tr><td class="font-medium text-sm">' + name + '</td><td class="text-xs" style="color:var(--muted)">' + timeAgo(item.deletedAt) + '</td><td class="text-xs" style="color:' + expiryColor + '">' + daysLeft + 'd left</td>';

    }
    h += '</tbody></table></div></div>';
  }
  if (!hasAny) h += '<div class="card text-center py-16"><i class="fas fa-recycle text-4xl mb-4" style="color:var(--border)"></i><p style="color:var(--muted)">Recycle bin is empty</p></div>';
  h += '</div>';

}

function renderSites() {
  var sites = getSites();
  var h = '<div class="fade-in"><div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold">Site Locations</h2><p class="text-sm" style="color:var(--muted)">GPS zones</p></div><button class="btn btn-primary" onclick="openSiteModal()"><i class="fas fa-plus"></i> Add Site</button></div><div class="grid gap-4">';
  if (sites.length) {
    for (var i = 0; i < sites.length; i++) {
      var s = sites[i];
      h += '<div class="card flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div class="flex-1"><div class="font-semibold">' + s.name + '</div><div class="text-sm" style="color:var(--muted)">' + s.address + '</div><div class="flex items-center gap-4 mt-2 text-xs" style="color:var(--muted)"><span><i class="fas fa-map-pin mr-1" style="color:var(--accent)"></i>' + s.lat.toFixed(5) + ', ' + s.lng.toFixed(5) + '</span><span><i class="fas fa-circle-dot mr-1" style="color:var(--info)"></i>' + s.radius + 'm</span><a href="https://www.google.com/maps?q=' + s.lat + ',' + s.lng + '" target="_blank" style="color:var(--accent)"><i class="fas fa-external-link mr-1"></i>Map</a></div></div><div class="flex gap-2"><button class="btn btn-secondary btn-sm" onclick="openSiteModal(\'' + s.id + '\')"><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm" onclick="deleteSite(\'' + s.id + '\')"><i class="fas fa-trash"></i></button></div></div>';
    }
  } else { h += '<div class="card text-center py-12"><i class="fas fa-location-dot text-3xl mb-3" style="color:var(--muted)"></i><p style="color:var(--muted)">No sites.</p></div>'; }
  h += '</div></div>';
  return h;
}
function openSiteModal(editId) {
  var s = editId ? getSites().find(function(x){return x.id===editId;}) : null;
  var html = '<h3 class="font-bold text-lg mb-4">' + (s?'Edit':'Add') + ' Site</h3><div class="grid gap-4">';
  html += '<div><label>Site Name</label><input id="m-site-name" value="' + (s?s.name:'') + '"></div>';
  html += '<div><label>Address</label><input id="m-site-addr" value="' + (s?s.address:'') + '"></div>';
  html += '<div class="grid grid-cols-2 gap-3"><div><label>Latitude</label><input id="m-site-lat" type="number" step="0.00001" value="' + (s?s.lat:'') + '"></div><div><label>Longitude</label><input id="m-site-lng" type="number" step="0.00001" value="' + (s?s.lng:'') + '"></div></div>';
  html += '<div><label>GPS Radius: <span id="m-radius-val">' + (s?s.radius:100) + '</span>m</label><input id="m-site-radius" type="range" min="5" max="300" value="' + (s?s.radius:100) + '" oninput="document.getElementById(\'m-radius-val\').textContent=this.value" style="padding:0;background:transparent;border:none"></div>';
  html += '<button class="btn btn-secondary btn-sm" onclick="getMyLocation()"><i class="fas fa-crosshairs"></i> Use My Location</button>';
  html += '<div class="flex gap-3 mt-2"><button class="btn btn-primary flex-1 justify-center" onclick="saveSite(\'' + (editId||'') + '\')">' + (s?'Update':'Add') + '</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div></div>';
  openModal(html);
}
function getMyLocation() {
  if (!navigator.geolocation) { toast('Not supported','error'); return; }
  toast('Getting location...','info');
  navigator.geolocation.getCurrentPosition(function(p) {
    document.getElementById('m-site-lat').value = p.coords.latitude.toFixed(5);
    document.getElementById('m-site-lng').value = p.coords.longitude.toFixed(5);
    toast('Done','success');
  }, function(e) { toast('Error: '+e.message,'error'); }, { enableHighAccuracy:true });
}
function saveSite(editId) {
  var name = document.getElementById('m-site-name').value.trim();
  var address = document.getElementById('m-site-addr').value.trim();
  var lat = parseFloat(document.getElementById('m-site-lat').value);
  var lng = parseFloat(document.getElementById('m-site-lng').value);
  var radius = parseInt(document.getElementById('m-site-radius').value);
  if (!name) { toast('Name required','error'); return; }
  if (isNaN(lat) || isNaN(lng)) { toast('Coordinates required','error'); return; }
  if (editId) { fbUpdate('sites/'+editId, {name:name,address:address,lat:lat,lng:lng,radius:radius}); }
  else { var id = db.ref('sites').push().key; fbSet('sites/'+id, {id:id,name:name,address:address,lat:lat,lng:lng,radius:radius}); }
  closeModal(); navigateAdmin('sites'); toast(editId?'Updated':'Added','success');
}
function deleteSite(id) {
  var s = getSites().find(function(x){return x.id===id;});
  if (getEmployees().filter(function(e){return e.siteId===id;}).length) { toast('Employees assigned','error'); return; }
  moveToBin('sites', id, s); navigateAdmin('sites'); toast('Moved to recycle bin','info');
}

   EMPLOYEES
   ============================================ */

  var emps = getEmployees();
  var h = '<div class="fade-in"><div class="flex items-center justify-between mb-6 flex-wrap gap-3"><div><h2 class="text-xl font-bold">Employees</h2><p class="text-sm" style="color:var(--muted)">' + emps.length + ' total</p></div>';
  h += '<div class="flex gap-2"><button class="btn btn-secondary" onclick="openBulkEmpModal()"><i class="fas fa-users-line"></i> Bulk Add</button><button class="btn btn-primary" onclick="openEmpModal()"><i class="fas fa-plus"></i> Add</button></div></div>';
  h += '<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Name</th><th>ID</th><th>Site</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  for (var i = 0; i < emps.length; i++) {
    var e = emps[i];
    h += '<tr><td class="font-medium">' + e.firstName + ' ' + e.lastName + '</td><td class="mono text-xs">' + e.employeeId + '</td><td><span class="badge badge-blue">' + getSiteName(e.siteId) + '</span></td><td>' + (e.active?'<span class="badge badge-green">Active</span>':'<span class="badge badge-red">Inactive</span>') + '</td><td><div class="flex gap-2"><button class="btn btn-secondary btn-sm" onclick="openEmpModal(\'' + e.id + '\')"><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm" onclick="deleteEmployee(\'' + e.id + '\')"><i class="fas fa-trash"></i></button></div></td></tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}
function openEmpModal(editId) {
  var emps = getEmployees(), sites = getSites();
  var e = editId ? emps.find(function(x){return x.id===editId;}) : null;
  if (!sites.length) { toast('Add a site first','error'); return; }
  var so = '';
  for (var i = 0; i < sites.length; i++) { so += '<option value="' + sites[i].id + '" ' + (e && e.siteId===sites[i].id?'selected':'') + '>' + sites[i].name + '</option>'; }
  var html = '<h3 class="font-bold text-lg mb-4">' + (e?'Edit':'Add') + ' Employee</h3><div class="grid gap-4">';
  html += '<div class="grid grid-cols-2 gap-3"><div><label>First Name</label><input id="m-emp-fn" value="' + (e?e.firstName:'') + '"></div><div><label>Last Name</label><input id="m-emp-ln" value="' + (e?e.lastName:'') + '"></div></div>';
  html += '<div><label>Employee ID</label><input id="m-emp-eid" value="' + (e?e.employeeId:'') + '" ' + (e?'readonly style="opacity:.6"':'') + '></div>';
  html += '<div><label>PIN (4 digits)</label><input id="m-emp-pin" type="password" maxlength="4" value="' + (e?e.pin:'') + '"></div>';
  html += '<div><label>Site</label><select id="m-emp-site">' + so + '</select></div>';
  html += '<div class="flex items-center gap-2"><input id="m-emp-active" type="checkbox" ' + (!e||e.active?'checked':'') + ' class="w-4 h-4"><label for="m-emp-active" style="margin:0;cursor:pointer">Active</label></div>';
  html += '<div class="flex gap-3 mt-2"><button class="btn btn-primary flex-1 justify-center" onclick="saveEmp(\'' + (editId||'') + '\')">' + (e?'Update':'Add') + '</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div></div>';
  openModal(html);
}
function saveEmp(editId) {
  var fn = document.getElementById('m-emp-fn').value.trim();
  var ln = document.getElementById('m-emp-ln').value.trim();
  var eid = document.getElementById('m-emp-eid').value.trim().toUpperCase();
  var pin = document.getElementById('m-emp-pin').value;
  var siteId = document.getElementById('m-emp-site').value;
  var active = document.getElementById('m-emp-active').checked;
  if (!fn || !ln) { toast('Name required','error'); return; }
  if (!eid) { toast('ID required','error'); return; }
  if (!/^\d{4}$/.test(pin)) { toast('PIN must be 4 digits','error'); return; }
  if (!editId && getEmployees().find(function(e){return e.employeeId===eid;})) { toast('ID exists','error'); return; }
  if (editId) { fbUpdate('employees/'+editId, {firstName:fn,lastName:ln,employeeId:eid,pin:pin,siteId:siteId,active:active}); }
  else { var id = db.ref('employees').push().key; fbSet('employees/'+id, {id:id,firstName:fn,lastName:ln,employeeId:eid,pin:pin,siteId:siteId,active:active}); }
  closeModal(); navigateAdmin('employees'); toast(editId?'Updated':'Added','success');
}
function deleteEmployee(id) {
  var e = getEmpById(id);
  if (getRecords().find(function(r){return r.employeeId===id;})) { toast('Has records \u2014 deactivate instead','error'); return; }
  moveToBin('employees', id, e); navigateAdmin('employees'); toast('Moved to recycle bin','info');
}

/* ============================================
   BULK EMPLOYEE ADDING
   ============================================ */
function openBulkEmpModal() {
  var sites = getSites();
  if (!sites.length) { toast('Add a site first','error'); return; }
  var so = '';
  for (var i = 0; i < sites.length; i++) { so += '<option value="' + sites[i].id + '">' + sites[i].name + '</option>'; }
  var html = '<h3 class="font-bold text-lg mb-2">Bulk Add Employees</h3>';
  html += '<p class="text-xs mb-4" style="color:var(--muted)">One per line: <span class="mono" style="color:var(--fg)">FirstName, LastName, EmployeeID, PIN</span></p>';
  html += '<div class="grid gap-4">';
  html += '<div><label>Assign to Site</label><select id="m-bulk-site">' + so + '</select></div>';
  html += '<div><label>Employees</label><textarea id="m-bulk-emps" rows="8" placeholder="John, Smith, EMP004, 1234&#10;Jane, Doe, EMP005, 5678" style="font-family:\'JetBrains Mono\',monospace;font-size:.8rem;resize:vertical"></textarea></div>';
  html += '<div id="m-bulk-preview"></div>';
  html += '<div class="flex gap-3"><button class="btn btn-primary flex-1 justify-center" onclick="previewBulkEmps()"><i class="fas fa-eye"></i> Preview</button>';
  html += '<button class="btn btn-success flex-1 justify-center" onclick="saveBulkEmps()" id="m-bulk-save-btn" disabled><i class="fas fa-upload"></i> Add All</button>';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div></div>';
  openModal(html);
}
function previewBulkEmps() {
  var raw = document.getElementById('m-bulk-emps').value.trim();
  var lines = raw.split('\n').filter(function(l){return l.trim();});
  var existing = getEmployees();
  var parsed = [], errors = [];
  for (var i = 0; i < lines.length; i++) {
    var parts = lines[i].split(',').map(function(p){return p.trim();});
    if (parts.length < 4) { errors.push('Line ' + (i+1) + ': needs 4 fields'); continue; }
    var fn = parts[0], ln = parts[1], eid = parts[2].toUpperCase(), pin = parts[3];
    if (!fn || !ln) { errors.push('Line ' + (i+1) + ': empty name'); continue; }
    if (!/^\d{4}$/.test(pin)) { errors.push('Line ' + (i+1) + ': PIN must be 4 digits'); continue; }
    var dup = false;
    for (var j = 0; j < existing.length; j++) { if (existing[j].employeeId === eid) { errors.push('Line ' + (i+1) + ': ID ' + eid + ' exists'); dup = true; break; } }
    if (dup) continue;
    for (var j = 0; j < parsed.length; j++) { if (parsed[j].eid === eid) { errors.push('Line ' + (i+1) + ': duplicate ID'); dup = true; break; } }
    if (dup) continue;
    parsed.push({ fn:fn, ln:ln, eid:eid, pin:pin });
  }
  var h = '';
  if (errors.length) {
    h += '<div class="mb-3 p-3 rounded-lg" style="background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3)"><div class="text-xs font-semibold mb-1" style="color:var(--danger)">' + errors.length + ' error(s)</div>';
    for (var i = 0; i < errors.length; i++) { h += '<div class="text-xs" style="color:var(--danger)">' + errors[i] + '</div>'; }
    h += '</div>';
  }
  if (parsed.length) {
    h += '<div class="p-3 rounded-lg" style="background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3)"><div class="text-xs font-semibold mb-2" style="color:var(--success)">' + parsed.length + ' employee(s) ready</div><table style="width:100%"><thead><tr><th>Name</th><th>ID</th><th>PIN</th></tr></thead><tbody>';
    for (var i = 0; i < parsed.length; i++) { h += '<tr><td class="text-xs">' + parsed[i].fn + ' ' + parsed[i].ln + '</td><td class="text-xs mono">' + parsed[i].eid + '</td><td class="text-xs mono">****</td></tr>'; }
    h += '</tbody></table></div>';
    var btn = document.getElementById('m-bulk-save-btn');
    btn.disabled = false;
    btn.setAttribute('data-parsed', JSON.stringify(parsed));
  } else {
    document.getElementById('m-bulk-save-btn').disabled = true;
    document.getElementById('m-bulk-save-btn').removeAttribute('data-parsed');
  }
  document.getElementById('m-bulk-preview').innerHTML = h;
}
function saveBulkEmps() {
  var btn = document.getElementById('m-bulk-save-btn');
  var data = btn.getAttribute('data-parsed');
  if (!data) { toast('Preview first','error'); return; }
  var parsed = JSON.parse(data);
  var siteId = document.getElementById('m-bulk-site').value;
  var count = 0;
  for (var i = 0; i < parsed.length; i++) {
    var p = parsed[i];
    var id = db.ref('employees').push().key;
    fbSet('employees/' + id, { id:id, firstName:p.fn, lastName:p.ln, employeeId:p.eid, pin:p.pin, siteId:siteId, active:true });
    count++;
  }
  closeModal(); navigateAdmin('employees'); toast(count + ' employee(s) added','success');
}

/* ============================================
   SHIFTS
   ============================================ */
function renderShifts() {
  var shifts = getShifts(), byDate = {};
  for (var i = 0; i < shifts.length; i++) {
    var s = shifts[i];
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  }
  var dates = Object.keys(byDate).sort().reverse();
  var h = '<div class="fade-in"><div class="flex items-center justify-between mb-6 flex-wrap gap-3"><div><h2 class="text-xl font-bold">Shifts</h2><p class="text-sm" style="color:var(--muted)">' + shifts.length + ' total</p></div>';
  h += '<div class="flex gap-2"><button class="btn btn-secondary" onclick="openBulkShiftModal()"><i class="fas fa-layer-group"></i> Bulk Add</button><button class="btn btn-primary" onclick="openShiftModal()"><i class="fas fa-plus"></i> Add</button></div></div>';
  var recs = getRecords();
  if (dates.length) {
    for (var d = 0; d < dates.length; d++) {
      var date = dates[d], dt = getDayType(date), dayShifts = byDate[date];
      h += '<div class="mb-4"><div class="flex items-center gap-2 mb-2"><h3 class="text-sm font-semibold">' + (date===todayStr()?'<span style="color:var(--accent)">Today</span> \u2014 ':'') + new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + '</h3>';
      h += '<span class="badge ' + (dt==='Sunday'?'badge-purple':dt==='Holiday'?'badge-red':'badge-blue') + '">' + dt + '</span><span class="badge badge-amber">' + dayShifts.length + '</span></div>';
      h += '<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Employee</th><th>Site</th><th>Time</th><th>Target</th><th>Break</th><th>Status</th><th></th></tr></thead><tbody>';
      for (var i = 0; i < dayShifts.length; i++) {
        var s = dayShifts[i], emp = getEmpById(s.employeeId);
        var rec = null;
        for (var j = 0; j < recs.length; j++) { if (recs[j].shiftId === s.id) { rec = recs[j]; break; } }
        var st = '<span class="badge badge-amber">Pending</span>';
        if (rec && rec.status === 'clocked_in') st = '<span class="badge badge-green">In</span>';
        else if (rec && rec.status === 'completed') st = '<span class="badge badge-blue">Done</span>';
        h += '<tr><td class="font-medium text-sm">' + (emp?emp.firstName+' '+emp.lastName:'\u2014') + '</td><td class="text-xs">' + getSiteName(s.siteId) + '</td><td class="mono text-xs">' + s.startTime + ' - ' + s.endTime + '</td><td>' + (s.targetHours||'\u2014') + 'h</td><td>' + (s.breakMinutes||0) + 'm</td><td>' + st + '</td><td><div class="flex gap-1"><button class="btn btn-secondary btn-sm" onclick="openShiftModal(\'' + s.id + '\')"><i class="fas fa-pen"></i></button><button class="btn btn-danger btn-sm" onclick="deleteShift(\'' + s.id + '\')"><i class="fas fa-trash"></i></button></div></td></tr>';
      }
      h += '</tbody></table></div></div>';
    }
  } else { h += '<div class="card text-center py-12"><i class="fas fa-calendar-days text-3xl mb-3" style="color:var(--muted)"></i><p style="color:var(--muted)">No shifts.</p></div>'; }
  h += '</div>';
  return h;
}
function openShiftModal(editId) {
  var s = editId ? getShifts().find(function(x){return x.id===editId;}) : null;
  var emps = getEmployees().filter(function(e){return e.active;});
  var sites = getSites();
  var eo = '';
  for (var i = 0; i < emps.length; i++) { eo += '<option value="' + emps[i].id + '" ' + (s && s.employeeId===emps[i].id?'selected':'') + '>' + emps[i].firstName + ' ' + emps[i].lastName + ' (' + emps[i].employeeId + ')</option>'; }
  var so = '';
  for (var i = 0; i < sites.length; i++) { so += '<option value="' + sites[i].id + '" ' + (s && s.siteId===sites[i].id?'selected':'') + '>' + sites[i].name + '</option>'; }
  var html = '<h3 class="font-bold text-lg mb-4">' + (s?'Edit':'Add') + ' Shift</h3><div class="grid gap-4">';
  html += '<div><label>Employee</label><select id="m-shift-emp">' + eo + '</select></div>';
  html += '<div><label>Site</label><select id="m-shift-site">' + so + '</select></div>';
  html += '<div><label>Date</label><input id="m-shift-date" type="date" value="' + (s?s.date:todayStr()) + '"></div>';
  html += '<div class="grid grid-cols-2 gap-3"><div><label>Start Time</label><input id="m-shift-start" type="time" value="' + (s?s.startTime:'08:00') + '"></div><div><label>End Time</label><input id="m-shift-end" type="time" value="' + (s?s.endTime:'17:00') + '"></div></div>';
  html += '<div class="grid grid-cols-2 gap-3"><div><label>Target Hours</label><input id="m-shift-target" type="number" step="0.25" value="' + (s?s.targetHours||'':'') + '"></div><div><label>Break (min)</label><input id="m-shift-break" type="number" value="' + (s?s.breakMinutes||0:0) + '"></div></div>';
  html += '<div class="flex gap-3 mt-2"><button class="btn btn-primary flex-1 justify-center" onclick="saveShift(\'' + (editId||'') + '\')">' + (s?'Update':'Add') + '</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div></div>';
  openModal(html);
}
function saveShift(editId) {
  var empId = document.getElementById('m-shift-emp').value;
  var siteId = document.getElementById('m-shift-site').value;
  var date = document.getElementById('m-shift-date').value;
  var startTime = document.getElementById('m-shift-start').value;
  var endTime = document.getElementById('m-shift-end').value;
  var targetHours = parseFloat(document.getElementById('m-shift-target').value) || '';
  var breakMinutes = parseInt(document.getElementById('m-shift-break').value) || 0;
  if (!date || !startTime || !endTime) { toast('Fill all fields','error'); return; }
  var data = { employeeId:empId, siteId:siteId, date:date, startTime:startTime, endTime:endTime, targetHours:targetHours, breakMinutes:breakMinutes };
  if (editId) { fbUpdate('shifts/'+editId, data); }
  else { data.id = db.ref('shifts').push().key; fbSet('shifts/'+data.id, data); }
  closeModal(); navigateAdmin('shifts'); toast(editId?'Updated':'Added','success');
}
function deleteShift(id) {
  var s = getShifts().find(function(x){return x.id===id;});
  if (getRecords().find(function(r){return r.shiftId===id;})) { toast('Has clock records','error'); return; }
  moveToBin('shifts', id, s); navigateAdmin('shifts'); toast('Moved to recycle bin','info');
}

/* ============================================
   BULK SHIFT ADDING
   ============================================ */
function openBulkShiftModal() {
  var emps = getEmployees().filter(function(e){return e.active;});
  var sites = getSites();
  if (!emps.length) { toast('Add employees first','error'); return; }
  if (!sites.length) { toast('Add a site first','error'); return; }

  var ec = '';
  for (var i = 0; i < emps.length; i++) {
    var e = emps[i];
    ec += '<label><input type="checkbox" class="bulk-emp-cb" value="' + e.id + '"> ' + e.firstName + ' ' + e.lastName + ' <span style="color:var(--muted)">(' + e.employeeId + ')</span></label>';
  }
  var so = '';
  for (var i = 0; i < sites.length; i++) { so += '<option value="' + sites[i].id + '">' + sites[i].name + '</option>'; }

  var dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var dowHtml = '';
  for (var i = 0; i < 7; i++) {
    var chk = (i < 5) ? 'checked' : '';
    dowHtml += '<label><input type="checkbox" class="bulk-dow-cb" value="' + i + '" ' + chk + '> ' + dayNames[i] + '</label>';
  }

  var today = todayStr();
  var html = '<h3 class="font-bold text-lg mb-2">Bulk Add Shifts</h3>';
  html += '<p class="text-xs mb-4" style="color:var(--muted)">Create shifts for multiple employees over a date range</p>';
  html += '<div class="grid gap-4">';
  html += '<div><label>Select Employees</label><div class="flex items-center gap-2 mb-2"><label style="margin:0;cursor:pointer;font-size:.75rem;color:var(--accent)"><input type="checkbox" id="bulk-emp-all" onchange="var cbs=document.querySelectorAll(\'.bulk-emp-cb\');for(var i=0;i<cbs.length;i++){cbs[i].checked=this.checked;}" style="width:auto;accent-color:var(--accent)"> Select All</label></div>';
  html += '<div class="cb-grid">' + ec + '</div></div>';
  html += '<div><label>Site</label><select id="m-bulk-shift-site">' + so + '</select></div>';
  html += '<div class="grid grid-cols-2 gap-3"><div><label>Start Date</label><input id="m-bulk-shift-from" type="date" value="' + today + '"></div><div><label>End Date</label><input id="m-bulk-shift-to" type="date" value="' + today + '"></div></div>';
  html += '<div><label>Days of Week</label><div class="dow-row">' + dowHtml + '</div></div>';
  html += '<div class="grid grid-cols-3 gap-3"><div><label>Start Time</label><input id="m-bulk-shift-start" type="time" value="08:00"></div><div><label>End Time</label><input id="m-bulk-shift-end" type="time" value="17:00"></div><div><label>Break (min)</label><input id="m-bulk-shift-break" type="number" value="30"></div></div>';
  html += '<div><label>Target Hours (blank = auto)</label><input id="m-bulk-shift-target" type="number" step="0.25" placeholder="auto"></div>';
  html += '<div id="m-bulk-shift-preview"></div>';
  html += '<div class="flex gap-3"><button class="btn btn-primary flex-1 justify-center" onclick="previewBulkShifts()"><i class="fas fa-eye"></i> Preview</button>';
  html += '<button class="btn btn-success flex-1 justify-center" onclick="saveBulkShifts()" id="m-bulk-shift-save" disabled><i class="fas fa-upload"></i> Create All</button>';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div></div>';
