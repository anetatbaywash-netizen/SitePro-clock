<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SitePro Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0e16;--bg2:#131620;--card:#1a1e2e;--card2:#212638;--border:#2a3048;--fg:#e2e4ea;--muted:#6b7094;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:8px;font-weight:500;font-size:.875rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#0c0e16}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.3)}.btn-danger:hover{background:rgba(248,113,113,.25)}
.btn-success{background:rgba(52,211,153,.15);color:var(--success);border:1px solid rgba(52,211,153,.3)}.btn-success:hover{background:rgba(52,211,153,.25)}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.6rem .8rem;border-radius:8px;font-family:inherit;font-size:.875rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--card);color:var(--fg)}
label{font-size:.8rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.3rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;color:var(--muted);font-size:.875rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.05)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.08);border-left-color:var(--accent)}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.8rem 1.2rem;border-radius:8px;font-size:.85rem;display:flex;align-items:center;gap:.6rem;animation:slideIn .3s ease;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-success{background:#065f46;border:1px solid #34d399;color:#a7f3d0}
.toast-error{background:#7f1d1d;border:1px solid #f87171;color:#fecaca}
.toast-info{background:#0c4a6e;border:1px solid #38bdf8;color:#bae6fd}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 30px rgba(52,211,153,.15)}50%{box-shadow:0 0 60px rgba(52,211,153,.3)}}
@keyframes breathe-out{0%,100%{box-shadow:0 0 30px rgba(248,113,113,.15)}50%{box-shadow:0 0 60px rgba(248,113,113,.3)}}
.fade-in{animation:fadeIn .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:1.5rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.6rem .8rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
td{padding:.6rem .8rem;font-size:.85rem;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}
tr:hover td{background:rgba(232,168,56,.03)}
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.15);color:var(--success)}
.badge-red{background:rgba(248,113,113,.15);color:var(--danger)}
.badge-amber{background:rgba(232,168,56,.15);color:var(--accent)}
.badge-blue{background:rgba(56,189,248,.15);color:var(--info)}
.badge-purple{background:rgba(168,85,247,.15);color:#c084fc}
.bg-pattern{background-image:radial-gradient(circle at 1px 1px,rgba(232,168,56,.04) 1px,transparent 0);background-size:40px 40px}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.conn-dot.loading{background:var(--warning);animation:pulse-ring 1s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--fg)}
.clock-face{position:relative;width:280px;height:280px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;user-select:none}
.clock-face.clock-in-face{background:radial-gradient(circle at 40% 35%,rgba(52,211,153,.12),var(--card) 70%);border:3px solid var(--success);animation:breathe 3s ease-in-out infinite}
.clock-face.clock-in-face:hover{transform:scale(1.04)}
.clock-face.clock-in-face:active{transform:scale(.97)}
.clock-face.clock-out-face{background:radial-gradient(circle at 40% 35%,rgba(248,113,113,.12),var(--card) 70%);border:3px solid var(--danger);animation:breathe-out 2s ease-in-out infinite}
.clock-face.clock-out-face:hover{transform:scale(1.04)}
.clock-face.clock-out-face:active{transform:scale(.97)}
.clock-face .cf-icon{font-size:2.5rem;margin-bottom:.25rem}
.clock-face .cf-label{font-size:1rem;font-weight:700;letter-spacing:.05em}
.clock-face .cf-sub{font-size:.7rem;color:var(--muted);font-weight:400;margin-top:.15rem}
.clock-face::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:2px solid;opacity:0;animation:pulse-ring 2.5s ease-out infinite;pointer-events:none}
.clock-in-face::after{border-color:var(--success)}
.clock-out-face::after{border-color:var(--danger)}
.big-time{font-family:'JetBrains Mono',monospace;font-size:3.5rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.big-date{font-size:1rem;color:var(--muted);margin-top:.25rem}
.emp-clock-info{width:min(100%,560px);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.emp-clock-name{font-size:1.35rem;font-weight:700}
.emp-clock-id{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);margin-top:.15rem}
.emp-clock-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin-top:.75rem}
.elapsed-display{font-family:'JetBrains Mono',monospace;font-size:2.8rem;font-weight:700;letter-spacing:.04em;color:var(--success);line-height:1}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.35rem;max-height:200px;overflow-y:auto;padding:.25rem}
.cb-grid label{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--fg);cursor:pointer;padding:.25rem .4rem;border-radius:6px;transition:background .15s;margin:0}
.cb-grid label:hover{background:rgba(232,168,56,.08)}
.cb-grid input[type=checkbox]{width:auto;accent-color:var(--accent)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-face{width:220px;height:220px}.clock-face .cf-icon{font-size:2rem}.big-time{font-size:2.5rem}.elapsed-display{font-size:2rem}}
</style>
</head>
<body class="bg-pattern">
<div id="toast-container" class="toast-container"></div>
<div id="loading-screen" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing...</p></div>
</div>
<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md fade-in" style="border-color:color-mix(in srgb,var(--accent) 20%,var(--border))">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div>
      <h1 class="text-2xl font-bold">SitePro Clock In</h1>
      <p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p>
    </div>
    <div class="flex mb-6 border-b" style="border-color:var(--border)">
      <button class="tab-btn flex-1" onclick="switchLoginTab('admin')"><i class="fas fa-shield-halved mr-1"></i> Admin</button>
      <button class="tab-btn active flex-1" onclick="switchLoginTab('employee')"><i class="fas fa-user mr-1"></i> Employee</button>
    </div>
    <div id="login-admin" class="hidden">
      <div class="mb-4"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div>
      <div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div>
      <button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button>
    </div>
    <div id="login-employee">
      <div class="mb-4"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off"></div>
      <div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4"></div>
      <button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button>
    </div>
  </div>
</div>
<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div><div class="font-bold text-sm">SitePro Clock In</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div></div>
    <nav class="py-3" id="admin-nav">
      <div class="px-4 py-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Main</div>
      <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-gauge-high w-5 text-center"></i> Dashboard</a>
      <a class="sidebar-link" data-page="sites"><i class="fas fa-location-dot w-5 text-center"></i> Sites</a>
      <a class="sidebar-link" data-page="employees"><i class="fas fa-users w-5 text-center"></i> Employees</a>
      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <a class="sidebar-link" data-page="approvals"><i class="fas fa-clipboard-check w-5 text-center"></i> Approvals <span id="approval-badge" class="hidden badge badge-red ml-auto" style="font-size:.6rem">0</span></a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Data</div>
      <a class="sidebar-link" data-page="timesheets"><i class="fas fa-table-list w-5 text-center"></i> Timesheets</a>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Export</a>
      <a class="sidebar-link" data-page="recyclebin"><i class="fas fa-recycle w-5 text-center"></i> Recycle Bin <span id="bin-badge" class="hidden badge badge-red ml-auto" style="font-size:.6rem">0</span></a>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
</div>
<div id="employee-layout" class="hidden">
  <div class="min-h-screen flex flex-col">
    <header class="p-4 flex items-center justify-center border-b" style="border-color:var(--border);background:var(--bg2)">
      <div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xs" style="color:#0c0e16"></i></div><span class="font-bold text-sm">SitePro</span><span class="conn-dot on" id="emp-conn-dot"></span></div>
      <div class="ml-auto flex items-center gap-3"><span id="emp-header-name" class="text-sm hidden sm:inline" style="color:var(--muted)"></span><button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i></button></div>
    </header>
    <div class="flex-1 flex">
      <nav class="w-16 sm:w-48 border-r flex flex-col pt-4" style="border-color:var(--border);background:var(--bg2)" id="emp-nav">
        <a class="sidebar-link active" data-epage="clock" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-fingerprint text-lg"></i><span class="text-xs hidden sm:inline mt-1">Clock</span></a>
        <a class="sidebar-link" data-epage="history" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-history text-lg"></i><span class="text-xs hidden sm:inline mt-1">History</span></a>
      </nav>
      <main class="flex-1 p-4 sm:p-6" id="emp-content"></main>
    </div>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box fade-in" id="modal-box"></div></div>

<script>

var EMBEDDED_FB = {
  apiKey:"AIzaSyAkHU3eWCWTUt3Ks0Vxq3PkgcATtin0Zaw",
  authDomain:"baywashclock.firebaseapp.com",
  databaseURL:"https://baywashclock-default-rtdb.firebaseio.com",
  projectId:"baywashclock",
  storageBucket:"baywashclock.firebasestorage.app",
  messagingSenderId:"207388184141",
  appId:"1:207388184141:web:718d4348bc91672a369604"
};

var db = null, fbConnected = false, dataLoaded = 0, initialLoadDone = false;
var D = { sites:[], employees:[], shifts:[], records:[], settings:{}, admin:{}, recycleBin:{} };

/* --- ROBUST INITIALIZATION --- */
function initFirebase(config) {
  try {
    if (typeof firebase === 'undefined') throw new Error('Firebase SDK did not load.');
    if (firebase.apps && firebase.apps.length) firebase.app();
    else firebase.initializeApp(config);
    db=firebase.database();

    db.ref('.info/connected').on('value',function(s){
      fbConnected=s.val()===true; updateConnDots();
    });

    db.ref('sites').on('value',function(s){D.sites=s.val()?Object.values(s.val()):[];dataLoaded++;});
    db.ref('employees').on('value',function(s){D.employees=s.val()?Object.values(s.val()):[];dataLoaded++;});
    db.ref('shifts').on('value',function(s){D.shifts=s.val()?Object.values(s.val()):[];dataLoaded++;});
    db.ref('records').on('value',function(s){D.records=s.val()?Object.values(s.val()):[];dataLoaded++;updateApprovalBadge();});
    db.ref('settings').on('value',function(s){D.settings=s.val()||{};dataLoaded++;});
    db.ref('admin').on('value',function(s){D.admin=s.val()||{};dataLoaded++;});
    db.ref('recycleBin').on('value',function(s){D.recycleBin=s.val()||{};dataLoaded++;updateBinBadge();});

    setTimeout(function(){checkAllLoaded(false);},1500);
    setTimeout(function(){
      if(!initialLoadDone){
        console.warn('Firebase initial load timeout; unlocking login screen.');
        checkAllLoaded(true);
      }
    },5000);
  } catch(error) {
    console.error('Firebase startup error:',error);
    var ls=document.getElementById('loading-screen');
    if(ls) ls.innerHTML='<div class="text-center p-6"><div class="text-red-400 font-semibold mb-2">Firebase failed to start</div><div class="text-sm" style="color:var(--muted)">'+(error.message||error)+'</div></div>';
  }
}

function checkAllLoaded(force){
  if(initialLoadDone) return;
  if(force || dataLoaded>=7){
    initialLoadDone=true;
    document.getElementById('loading-screen').classList.add('hidden');
    if(!D.admin || !D.admin.username){
      if(fbConnected) seedFirebase();
      else showScreen('login-screen');
    } else {
      if(typeof cleanExpiredBin==='function') cleanExpiredBin();
      showScreen('login-screen');
    }
  }
}

function seedFirebase() {
  if (!db || !fbConnected) {
    console.warn("Database not connected. Cannot seed data.");
    showScreen('login-screen');
    return;
  }
  console.log("Seeding initial data...");
  fbSet('admin', { username:'admin', password:'admin123' });
  fbSet('settings', {
    weeklyTarget:45, overtimeAfter:45, defaultBreak:30, graceMinutes:10,
    holidays:['2025-01-01','2025-03-21','2025-04-18','2025-04-21','2025-05-01','2025-05-04','2025-05-25','2025-05-29','2025-08-26','2025-12-10','2025-12-25','2025-12-26','2026-01-01','2026-03-21','2026-04-03','2026-04-06','2026-05-01','2026-05-04','2026-05-14','2026-05-25','2026-08-26','2026-12-10','2026-12-25','2026-12-26']
  });
  fbSet('recycleBin', {});
  var s1 = db.ref('sites').push().key, s2 = db.ref('sites').push().key;
  fbSet('sites/' + s1, { id:s1, name:'Baywash Chemicals Windhoek', address:'Windhoek, Namibia', lat:-22.5609, lng:17.0658, radius:100 });
  fbSet('sites/' + s2, { id:s2, name:'Baywash Chemicals Swakopmund', address:'Swakopmund, Namibia', lat:-22.6754, lng:14.5256, radius:100 });
  var e1 = db.ref('employees').push().key, e2 = db.ref('employees').push().key, e3 = db.ref('employees').push().key;
  fbSet('employees/' + e1, { id:e1, firstName:'James', lastName:'Carter', employeeId:'EMP001', pin:'1234', siteId:s1, active:true });
  fbSet('employees/' + e2, { id:e2, firstName:'Sarah', lastName:'Mitchell', employeeId:'EMP002', pin:'5678', siteId:s1, active:true, weeklyTarget:40, overtimeAfter:40 });
  fbSet('employees/' + e3, { id:e3, firstName:'Daniel', lastName:'Nguyen', employeeId:'EMP003', pin:'4321', siteId:s2, active:true });
  
  setTimeout(function() {
    cleanExpiredBin();
    showScreen('login-screen');
    toast('Setup Complete', 'success');
  }, 1000);
}
/* --- END ROBUST INITIALIZATION --- */

/* --- HELPERS --- */
function fbSet(p, d) { if (db) { db.ref(p).set(d).catch(function(e) { console.error("Write Error:", e); }); } }
function fbUpdate(p, d) { if (db) { db.ref(p).update(d).catch(function(e) { console.error("Update Error:", e); }); } }
function fbRemove(p) { if (db) { db.ref(p).remove().catch(function(e) { console.error("Remove Error:", e); }); } }
function getSites() { return D.sites || []; }
function getEmployees() { return D.employees || []; }
function getShifts() { return D.shifts || []; }
function getRecords() { return D.records || []; }
function getSettings() { return D.settings || {}; }
function getHolidays() { return (D.settings && D.settings.holidays) ? D.settings.holidays : []; }
function getBinItems() { return D.recycleBin || {}; }
var state = {
  loggedIn:false, role:null, currentPage:'dashboard', empPage:'clock',
  currentEmployee:null, clockState:'idle', activeRecord:null,
  gpsStatus:'pending', gpsDistance:null, gpsLat:null, gpsLng:null,
  liveTimerInterval:null, clockTimeInterval:null,

function renderTimesheets() {
  var startStr = localStorage.getItem('ts_start') || fmtDate(new Date(Date.now() - 30*24*60*60*1000));
  var endStr = localStorage.getItem('ts_end') || fmtDate(new Date());

  var h = '<div class="fade-in"><div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 gap-4">';
  h += '<div><h2 class="text-xl font-bold">Weekly Timesheets</h2><p class="text-sm" style="color:var(--muted)">Review Normal Time, Early OT, Late OT, and Double Time</p></div>';
  h += '<div class="flex flex-wrap items-center gap-2 card p-2"><div><label class="text-xs mb-1">Start Date</label><input type="date" id="ts-start" value="'+startStr+'" class="text-xs"></div>';
  h += '<div><label class="text-xs mb-1">End Date</label><input type="date" id="ts-end" value="'+endStr+'" class="text-xs"></div>';
  h += '<button class="btn btn-primary btn-sm mt-4" onclick="generateTimesheets()"><i class="fas fa-filter"></i> Filter</button></div></div>';
  h += '<div id="ts-results" class="space-y-4"></div></div>';

  setTimeout(function(){ generateTimesheets(); }, 50);
  return h;
}

function generateTimesheets() {
  var startEl = document.getElementById('ts-start');
  var endEl = document.getElementById('ts-end');
  var container = document.getElementById('ts-results');
  if (!startEl || !endEl || !container) return;

  var startStr = startEl.value;
  var endStr = endEl.value;
  localStorage.setItem('ts_start', startStr);
  localStorage.setItem('ts_end', endStr);

  var startDate = new Date(startStr + 'T00:00:00');
  var endDate = new Date(endStr + 'T23:59:59');

  if (startDate > endDate) {
    container.innerHTML = '<p class="text-sm text-red-400">Invalid date range.</p>';
    return;
  }

  var recs = getRecords();
  var weeks = {};

  recs.forEach(function(r) {
    if (r.status !== 'completed' || !r.clockIn || !r.clockOut) return;

    var d = new Date(r.clockIn);
    if (d < startDate || d > endDate) return;

    var ws = getWeekStart(fmtDate(d));
    var key = ws + '_' + r.employeeId;

    if (!weeks[key]) {
      weeks[key] = { weekStart:ws, empId:r.employeeId, records:[] };
    }
    weeks[key].records.push(r);
  });

  var sortedKeys = Object.keys(weeks).sort();
  if (sortedKeys.length === 0) {
    container.innerHTML = '<div class="card text-center py-8 text-sm" style="color:var(--muted)">No records found for selected period.</div>';
    updateApprovalBadge();
    return;
  }

  var html = '';

  sortedKeys.forEach(function(k) {
    var w = weeks[k];
    var emp = getEmpById(w.empId);
    if (!emp) return;

    var totals = {
      nt:0, earlyOT:0, lateOT:0, dt:0,
      earlyPending:0, latePending:0,
      earlyApproved:0, lateApproved:0,
      earlyRejected:0, lateRejected:0
    };

    w.records.forEach(function(rec) {
      var ot = getRecordOTBreakdown(rec);
      var dayType = rec.dayType || getDayType(fmtDate(rec.clockIn));
      var totalHrs = parseFloat(rec.totalHours || 0);

      if (dayType === 'Sunday' || dayType === 'Holiday') {
        totals.dt += totalHrs;
        return;
      }

      var earlyHrs = ot.earlyHours;
      var lateHrs = ot.lateHours;
      totals.earlyOT += earlyHrs;
      totals.lateOT += lateHrs;

      var earlyStatus = getOTStatus(rec,'early');
      var lateStatus = getOTStatus(rec,'late');

      if (earlyStatus === 'pending') totals.earlyPending += earlyHrs;
      else if (earlyStatus === 'approved') totals.earlyApproved += earlyHrs;
      else totals.earlyRejected += earlyHrs;

      if (lateStatus === 'pending') totals.latePending += lateHrs;
      else if (lateStatus === 'approved') totals.lateApproved += lateHrs;
      else totals.lateRejected += lateHrs;

      totals.nt += Math.max(0, totalHrs - earlyHrs - lateHrs);
    });

    html += '<div class="card">';
    html += '<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b pb-2" style="border-color:var(--border)">';
    html += '<div><div class="font-bold text-lg">'+emp.firstName+' '+emp.lastName+'</div>';
    html += '<div class="text-sm" style="color:var(--muted)">Week of '+w.weekStart+'</div></div>';
    html += '<div class="flex gap-3 text-right mt-2 sm:mt-0">';
    html += '<div class="text-xs"><div style="color:var(--muted)">Normal</div><div class="font-bold mono text-sm">'+fmtHrs(totals.nt)+'</div></div>';
    html += '<div class="text-xs"><div style="color:var(--muted)">Early OT</div><div class="font-bold mono text-sm '+(totals.earlyPending>0?'text-amber-400':totals.earlyRejected>0?'text-red-400':'text-green-400')+'">'+fmtHrs(totals.earlyOT)+'</div></div>';
    html += '<div class="text-xs"><div style="color:var(--muted)">Late OT</div><div class="font-bold mono text-sm '+(totals.latePending>0?'text-amber-400':totals.lateRejected>0?'text-red-400':'text-green-400')+'">'+fmtHrs(totals.lateOT)+'</div></div>';
    html += '<div class="text-xs"><div style="color:var(--muted)">Double</div><div class="font-bold mono text-sm text-purple-400">'+fmtHrs(totals.dt)+'</div></div>';
    html += '</div></div>';

    if (totals.earlyOT > 0) {
      html += '<div class="mb-3 p-3 rounded border" style="border-color:var(--border);background:var(--bg2)">';
      html += '<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">';
      html += '<div class="text-sm"><span class="font-semibold">Early OT:</span> '+fmtHrs(totals.earlyOT);
      if (totals.earlyPending > 0) html += ' <span class="badge badge-amber ml-2">Pending '+fmtHrs(totals.earlyPending)+'</span>';
      if (totals.earlyApproved > 0) html += ' <span class="badge badge-green ml-2">Approved '+fmtHrs(totals.earlyApproved)+'</span>';
      if (totals.earlyRejected > 0) html += ' <span class="badge badge-red ml-2">Rejected '+fmtHrs(totals.earlyRejected)+'</span>';
      html += '</div><div class="flex gap-2">';
      if (totals.earlyPending > 0) {
        html += '<button class="btn btn-success btn-sm" onclick="setWeekOTDecision(\''+w.empId+'\',\''+w.weekStart+'\',\'early\',true)"><i class="fas fa-check"></i> Approve Early</button>';
        html += '<button class="btn btn-danger btn-sm" onclick="setWeekOTDecision(\''+w.empId+'\',\''+w.weekStart+'\',\'early\',false)"><i class="fas fa-times"></i> Reject Early</button>';
      }
      html += '</div></div></div>';
    }

    if (totals.lateOT > 0) {
      html += '<div class="mb-3 p-3 rounded border" style="border-color:var(--border);background:var(--bg2)">';
      html += '<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">';
      html += '<div class="text-sm"><span class="font-semibold">Late OT:</span> '+fmtHrs(totals.lateOT);
      if (totals.latePending > 0) html += ' <span class="badge badge-amber ml-2">Pending '+fmtHrs(totals.latePending)+'</span>';
      if (totals.lateApproved > 0) html += ' <span class="badge badge-green ml-2">Approved '+fmtHrs(totals.lateApproved)+'</span>';
      if (totals.lateRejected > 0) html += ' <span class="badge badge-red ml-2">Rejected '+fmtHrs(totals.lateRejected)+'</span>';
      html += '</div><div class="flex gap-2">';
      if (totals.latePending > 0) {
        html += '<button class="btn btn-success btn-sm" onclick="setWeekOTDecision(\''+w.empId+'\',\''+w.weekStart+'\',\'late\',true)"><i class="fas fa-check"></i> Approve Late</button>';
        html += '<button class="btn btn-danger btn-sm" onclick="setWeekOTDecision(\''+w.empId+'\',\''+w.weekStart+'\',\'late\',false)"><i class="fas fa-times"></i> Reject Late</button>';
      }
      html += '</div></div></div>';
    }

    if (totals.earlyPending === 0 && totals.latePending === 0) {
      html += '<div class="mb-1 text-sm text-green-400 flex items-center gap-2"><i class="fas fa-check-circle"></i> No overtime approvals pending for this week.</div>';
    }

    if (totals.earlyRejected > 0 || totals.lateRejected > 0) {
      html += '<div class="mt-2 text-xs text-red-400">Rejected OT remains visible in the Approvals section for audit history.</div>';
    }

    html += '</div>';
  });

  container.innerHTML = html;
  updateApprovalBadge();
}

function setWeekOTDecision(empId, weekStart, type, approved) {
  var recs = getRecords();
  var weekEnd = new Date(weekStart + 'T12:00:00');
  weekEnd.setDate(weekEnd.getDate() + 6);
  var weekEndStr = fmtDate(weekEnd);

  var approvedKey = type === 'early' ? 'earlyApproved' : 'lateApproved';
  var rejectedKey = type === 'early' ? 'earlyRejected' : 'lateRejected';
  var updates = {};
  var affected = [];

  recs.forEach(function(r) {
    if (r.employeeId !== empId || r.status !== 'completed' || !r.clockIn || !r.clockOut) return;
    var rDate = fmtDate(r.clockIn);
    if (rDate < weekStart || rDate > weekEndStr) return;

    var ot = getRecordOTBreakdown(r);
    var hours = type === 'early' ? ot.earlyHours : ot.lateHours;
    if (hours <= 0) return;

    updates['records/' + r.id + '/' + approvedKey] = approved;
    updates['records/' + r.id + '/' + rejectedKey] = !approved;
    affected.push(r.id);
  });

  if (!affected.length) {
    toast('No '+type+' overtime records found for this week.', 'info');
    return;
  }

  db.ref().update(updates).then(function() {
    affected.forEach(function(id) {
      var local = getRecords().find(function(r){ return r.id === id; });
      if (local) {
        local[approvedKey] = approved;
        local[rejectedKey] = !approved;
      }
    });

    updateApprovalBadge();
    toast((approved ? 'Approved ' : 'Rejected ') + type + ' overtime for ' + affected.length + ' record(s)', approved ? 'success' : 'error');
    generateTimesheets();
    if (state.currentPage === 'approvals') navigateAdmin('approvals');
  }).catch(function(err) {
    console.error('OT approval update failed:', err);
    toast('Could not save overtime decision: ' + (err.message || err), 'error');
  });
}

/* --- APPROVALS --- */
function renderApprovals(){
  var pending = [];
  var approved = [];
  var rejected = [];

  getRecords().forEach(function(r) {
    if (r.status !== 'completed') return;

    var emp = getEmpById(r.employeeId);
    var name = emp ? emp.firstName + ' ' + emp.lastName : '?';
    var date = fmtDate(r.clockIn);
    var time = fmtTime(r.clockIn) + ' - ' + fmtTime(r.clockOut);

    if (r.needsApproval && !r.approved && !r.rejected) {
      pending.push({id:r.id,kind:'record',name:name,date:date,time:time,reason:r.reason || 'Clock record requires approval'});
    }

    if (r.approved === true) {
      approved.push({id:r.id,kind:'record',name:name,date:date,time:time,reason:'Clock record approved'});
    } else if (r.rejected === true) {
      rejected.push({id:r.id,kind:'record',name:name,date:date,time:time,reason:'Clock record rejected'});
    }

    var ot = getRecordOTBreakdown(r);

    if (ot.earlyHours > 0) {
      var early = {id:r.id,kind:'early',name:name,date:date,time:time,hours:ot.earlyHours};
      var es = getOTStatus(r,'early');
      if (es === 'pending') pending.push(early);
      else if (es === 'approved') approved.push(early);
      else rejected.push(early);
    }

    if (ot.lateHours > 0) {
      var late = {id:r.id,kind:'late',name:name,date:date,time:time,hours:ot.lateHours};
      var ls = getOTStatus(r,'late');
      if (ls === 'pending') pending.push(late);
      else if (ls === 'approved') approved.push(late);
      else rejected.push(late);
    }
  });

  function renderItem(item, status) {
    var label = item.kind === 'early' ? 'Early OT' : item.kind === 'late' ? 'Late OT' : 'Clock Record';
    var detail = item.hours != null ? fmtHrs(item.hours) : (item.reason || '');
    var actions = '';

    if (status === 'pending') {
      if (item.kind === 'early' || item.kind === 'late') {
        actions = '<button class="btn btn-success btn-sm" onclick="setSingleOTDecision(\''+item.id+'\',\''+item.kind+'\',true)"><i class="fas fa-check"></i> Approve</button>' +
                  '<button class="btn btn-danger btn-sm" onclick="setSingleOTDecision(\''+item.id+'\',\''+item.kind+'\',false)"><i class="fas fa-times"></i> Reject</button>';
      } else {
        actions = '<button class="btn btn-success btn-sm" onclick="setApproval(\''+item.id+'\',true)"><i class="fas fa-check"></i> Approve</button>' +
                  '<button class="btn btn-danger btn-sm" onclick="setApproval(\''+item.id+'\',false)"><i class="fas fa-times"></i> Reject</button>';
      }
    } else {
      actions = '<span class="badge '+(status==='approved'?'badge-green':'badge-red')+'">'+(status==='approved'?'Approved':'Rejected')+'</span>';
    }

    return '<div class="card flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">' +
      '<div><div class="font-semibold">'+item.name+'</div>' +
      '<div class="text-sm" style="color:var(--muted)">'+item.date+' &middot; '+item.time+'</div>' +
      '<div class="text-xs mt-1" style="color:var(--warning)"><i class="fas fa-clock mr-1"></i>'+label+(detail?' &middot; '+detail:'')+'</div></div>' +
      '<div class="flex gap-2 items-center flex-wrap">'+actions+'</div></div>';
  }

  function section(title, count, items, status, colorClass) {
    var s = '<div class="mb-6"><div class="flex items-center justify-between mb-3"><h3 class="font-semibold">'+title+' <span class="badge '+colorClass+'">'+count+'</span></h3></div>';
    if (!items.length) {
      s += '<div class="card text-center py-6 text-sm" style="color:var(--muted)">None</div>';
    } else {
      s += '<div class="grid gap-3">';
      for (var i=0;i<items.length;i++) s += renderItem(items[i], status);
      s += '</div>';
    }
    return s + '</div>';
  }

  return '<div class="fade-in">' +
    '<div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold">Approvals</h2>' +
    '<p class="text-sm" style="color:var(--muted)">Pending: '+pending.length+' &middot; Approved: '+approved.length+' &middot; Rejected: '+rejected.length+'</p></div></div>' +
    section('Pending Approvals',pending.length,pending,'pending','badge-amber') +
    section('Approved',approved.length,approved,'approved','badge-green') +
    section('Rejected',rejected.length,rejected,'rejected','badge-red') +
    '</div>';
}

function setSingleOTDecision(id,type,approved){
  var rec = getRecords().find(function(r){ return r.id === id; });
  if (!rec) { toast('Record not found','error'); return; }

  var approvedKey = type === 'early' ? 'earlyApproved' : 'lateApproved';
  var rejectedKey = type === 'early' ? 'earlyRejected' : 'lateRejected';
  var updates = {};
  updates[approvedKey] = approved;
  updates[rejectedKey] = !approved;

  db.ref('records/'+id).update(updates).then(function(){
    rec[approvedKey] = approved;
    rec[rejectedKey] = !approved;
    updateApprovalBadge();
    toast((approved?'Approved ':'Rejected ')+type+' overtime',approved?'success':'error');
    navigateAdmin('approvals');
  }).catch(function(err){
    console.error('OT decision failed:',err);
    toast('Could not save decision: '+(err.message || err),'error');
  });
}

function setApproval(id,app){
  db.ref('records/'+id).update({approved:app,rejected:!app}).then(function(){
    var local = getRecords().find(function(r){ return r.id === id; });
    if (local) {
      local.approved = app;
      local.rejected = !app;
    }
    updateApprovalBadge();
    toast(app?'Approved':'Rejected',app?'success':'error');
    navigateAdmin('approvals');
  }).catch(function(err){
    console.error('Record approval failed:',err);
    toast('Could not save approval: '+(err.message || err),'error');
  });
}

function startClock(){
  if(!navigator.geolocation){toast('GPS required','error');return;}
  toast('Locating...','info');
  navigator.geolocation.getCurrentPosition(function(p){
    var lat=p.coords.latitude,lng=p.coords.longitude,today=todayStr();
    var shift=getShifts().find(function(s){return s.employeeId===state.currentEmployee.id&&s.date===today;});
    var targetSiteId=shift?shift.siteId:null, site=null, dist=0;

    if(targetSiteId){
      site=getSites().find(function(s){return s.id===targetSiteId;});
      if(site) dist=haversine(lat,lng,site.lat,site.lng);
      if(site && dist>site.radius){toast('Outside geofence ('+Math.round(dist)+'m)','error');return;}
    } else {
      var allocated=getEmpSiteIds(state.currentEmployee), closest=null, minDist=Infinity;
      for(var i=0;i<allocated.length;i++){
        var candidate=getSites().find(function(s){return s.id===allocated[i];});
        if(!candidate) continue;
        var d=haversine(lat,lng,candidate.lat,candidate.lng);
        if(d<=candidate.radius && d<minDist){minDist=d;closest=candidate;}
      }
      if(!closest){toast('Outside all allocated site geofences','error');return;}
      site=closest;targetSiteId=site.id;dist=minDist;
    }

    var now=new Date().toISOString(),id=db.ref('records').push().key;
    var record={id:id,employeeId:state.currentEmployee.id,siteId:targetSiteId,shiftId:shift?shift.id:null,clockIn:now,status:'clocked_in',dayType:getDayType(today)};
    fbSet('records/'+id,record);
    state.activeRecord=record;
    state.clockState='clocked_in';
    navigateEmp('clock');
    toast('Clocked In at '+getSiteName(targetSiteId),'success');
  },function(e){toast('GPS Error: '+e.message,'error');},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
function stopClock(){ var r=state.activeRecord; if(!r)return; var shift=getShifts().find(function(s){return s.id===r.shiftId;}); var co=new Date(); var bm=(shift&&shift.breakMinutes)?shift.breakMinutes:getSettings().defaultBreak||0; var weekWorked=getEmployeeWeekWorkedHours(r.employeeId, r.clockIn); var tierCfg=getEmployeeTierConfig(r.employeeId); var hrs=calcHours(r.clockIn, co.toISOString(), bm, weekWorked, r.dayType, tierCfg); var u={clockOut:co.toISOString(),status:'completed',totalHours:hrs.totalHours,regularHours:hrs.regularHours,overtimeHours:hrs.overtimeHours,doubleTimeHours:hrs.doubleTimeHours}; var na=checkNeedsApproval(Object.assign({},r,u)); if(na.needsApproval){u.needsApproval=true;u.reason=na.reason;} fbUpdate('records/'+r.id,u); state.clockState='idle'; state.activeRecord=null; if(state.liveTimerInterval)clearInterval(state.liveTimerInterval); navigateEmp('clock'); toast('Clocked Out. Total: '+fmtHrs(hrs.totalHours),'success'); }
function renderEmpHistory(){ var recs=getRecords().filter(function(r){return r.employeeId===state.currentEmployee.id;}).sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);}); var h='<div class="fade-in"><h2 class="text-lg font-bold mb-4">My History</h2><div class="space-y-3">'; for(var i=0;i<recs.length;i++){ var r=recs[i]; h+='<div class="card"><div class="flex justify-between items-center"><div><div class="font-bold">'+fmtDate(r.clockIn)+'</div><div class="text-xs" style="color:var(--muted)">'+fmtTime(r.clockIn)+' - '+fmtTime(r.clockOut)+'</div></div><div class="text-right"><div class="font-bold mono text-lg">'+fmtHrs(r.totalHours)+'</div><div class="text-xs" style="color:var(--muted)">'+(r.dayType||'Workday')+'</div></div></div></div>'; } if(!recs.length)h+='<p class="text-sm text-center" style="color:var(--muted)">No records yet.</p>'; return h+'</div>'; }

function updateConnDots(){
  var cls=fbConnected?'conn-dot on':'conn-dot off';
  var dots=document.querySelectorAll('#login-conn-dot,#admin-conn-dot,#emp-conn-dot');
  for(var i=0;i<dots.length;i++) dots[i].className=cls;
  var label=document.getElementById('admin-conn-label');
  if(label) label.textContent=fbConnected?'Synced':'Offline';
}

/* --- START APP IMMEDIATELY --- */
(function startApp(){
  var started = false;
  function start(){
    if (started) return;
    started = true;
    try {
      initFirebase(EMBEDDED_FB);
    } catch (e) {
      console.error('Application startup error:', e);
      var ls = document.getElementById('loading-screen');
      if (ls) {
        ls.innerHTML = '<div class=\"text-center p-6\"><div class=\"text-red-400 font-semibold mb-2\">Unable to start SitePro Clock In</div><div class=\"text-sm mb-2\" style=\"color:var(--muted)\">'+(e.message||e)+'</div><div class=\"text-xs\" style=\"color:var(--muted)\">Open the browser Console (F12) for details.</div></div>';
      }
    }
  }

  /* The script is at the end of the document, so do not wait for window.load. */
  start();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }

  /* Absolute watchdog: never leave the user on Syncing forever. */
  setTimeout(function(){
    var ls = document.getElementById('loading-screen');
    if (ls && !ls.classList.contains('hidden')) {
      ls.innerHTML = '<div class=\"text-center p-6\"><div class=\"text-red-400 font-semibold mb-2\">Startup is taking too long</div><div class=\"text-sm mb-3\" style=\"color:var(--muted)\">Firebase did not finish loading.</div><button class=\"btn btn-primary\" onclick=\"location.reload()\">Reload</button></div>';
    }
  }, 10000);
})();

</script>
