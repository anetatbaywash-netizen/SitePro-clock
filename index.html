<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SitePro Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0e16;--bg2:#131620;--card:#1a1e2e;--card2:#212638;--border:#2a3048;--fg:#e2e4ea;--muted:#6b7094;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:8px;font-weight:500;font-size:.875rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#0c0e16}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.3)}.btn-danger:hover{background:rgba(248,113,113,.25)}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.6rem .8rem;border-radius:8px;font-family:inherit;font-size:.875rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--card);color:var(--fg)}
label{font-size:.8rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.3rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;color:var(--muted);font-size:.875rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.05)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.08);border-left-color:var(--accent)}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.8rem 1.2rem;border-radius:8px;font-size:.85rem;display:flex;align-items:center;gap:.6rem;animation:slideIn .3s ease;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-success{background:#065f46;border:1px solid #34d399;color:#a7f3d0}
.toast-error{background:#7f1d1d;border:1px solid #f87171;color:#fecaca}
.toast-info{background:#0c4a6e;border:1px solid #38bdf8;color:#bae6fd}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
.fade-in{animation:fadeIn .3s ease}
.clock-btn{width:200px;height:200px;border-radius:50%;border:4px solid;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s;position:relative;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem}
.clock-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.clock-btn:not(:disabled):hover{transform:scale(1.05)}
.clock-btn.pulse::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid;animation:pulse-ring 1.5s infinite}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding:1.5rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.6rem .8rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
td{padding:.6rem .8rem;font-size:.85rem;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}
tr:hover td{background:rgba(232,168,56,.03)}
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.15);color:var(--success)}
.badge-red{background:rgba(248,113,113,.15);color:var(--danger)}
.badge-amber{background:rgba(232,168,56,.15);color:var(--accent)}
.badge-blue{background:rgba(56,189,248,.15);color:var(--info)}
.badge-purple{background:rgba(168,85,247,.15);color:#c084fc}
.bg-pattern{background-image:radial-gradient(circle at 1px 1px,rgba(232,168,56,.04) 1px,transparent 0);background-size:40px 40px}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.conn-dot.loading{background:var(--warning);animation:pulse-ring 1s infinite}
.step-num{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--fg)}
.progress-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.stat-card.sc-regular::before{background:var(--success)}
.stat-card.sc-overtime::before{background:var(--warning)}
.stat-card.sc-double::before{background:var(--danger)}
.stat-card.sc-total::before{background:var(--accent)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-btn{width:160px;height:160px;font-size:.95rem}}
</style>
</head>
<body class="bg-pattern">
<div id="toast-container" class="toast-container"></div>

<div id="loading-screen" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing...</p></div>
</div>

<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md fade-in" style="border-color:color-mix(in srgb,var(--accent) 20%,var(--border))">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div>
      <h1 class="text-2xl font-bold">SitePro Clock In</h1>
      <p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p>
    </div>
    <div class="flex mb-6 border-b" style="border-color:var(--border)">
      <button class="tab-btn flex-1" onclick="switchLoginTab('admin')"><i class="fas fa-shield-halved mr-1"></i> Admin</button>
      <button class="tab-btn active flex-1" onclick="switchLoginTab('employee')"><i class="fas fa-user mr-1"></i> Employee</button>
    </div>
    <div id="login-admin" class="hidden">
      <div class="mb-4"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div>
      <div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div>
      <button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button>
    </div>
    <div id="login-employee">
      <div class="mb-4"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off"></div>
      <div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4"></div>
      <button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button>
    </div>
  </div>
</div>

<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div><div class="font-bold text-sm">SitePro Clock In</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div></div>
    <nav class="py-3" id="admin-nav">
      <div class="px-4 py-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Main</div>
      <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-gauge-high w-5 text-center"></i> Dashboard</a>
      <a class="sidebar-link" data-page="sites"><i class="fas fa-location-dot w-5 text-center"></i> Sites</a>
      <a class="sidebar-link" data-page="employees"><i class="fas fa-users w-5 text-center"></i> Employees</a>
      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Data</div>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Export</a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">System</div>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
</div>

<div id="employee-layout" class="hidden">
  <div class="min-h-screen flex flex-col">
    <header class="p-4 flex items-center justify-between border-b" style="border-color:var(--border);background:var(--bg2)">

      <div class="flex items-center gap-3"><span id="emp-header-name" class="text-sm hidden sm:inline" style="color:var(--muted)"></span><button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i></button></div>
    </header>
    <div class="flex-1 flex">
      <nav class="w-16 sm:w-48 border-r flex flex-col pt-4" style="border-color:var(--border);background:var(--bg2)" id="emp-nav">
        <a class="sidebar-link active" data-epage="clock" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-fingerprint text-lg"></i><span class="text-xs hidden sm:inline mt-1">Clock</span></a>
        <a class="sidebar-link" data-epage="history" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-history text-lg"></i><span class="text-xs hidden sm:inline mt-1">History</span></a>
      </nav>
      <main class="flex-1 p-4 sm:p-6" id="emp-content"></main>
    </div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box fade-in" id="modal-box"></div></div>

<script>
/* ============================================================
   FIREBASE CONFIG — embedded so every device works
   ============================================================ */
var EMBEDDED_FB = {
  apiKey: "AIzaSyAkHU3eWCWTUt3Ks0Vxq3PkgcATtin0Zaw",
  authDomain: "baywashclock.firebaseapp.com",
  databaseURL: "https://baywashclock-default-rtdb.firebaseio.com",
  projectId: "baywashclock",
  storageBucket: "baywashclock.firebasestorage.app",
  messagingSenderId: "207388184141",
  appId: "1:207388184141:web:718d4348bc91672a369604"
};

/* ===== FIREBASE ===== */
var db = null, fbConnected = false, dataLoaded = 0, initialLoadDone = false;
var D = { sites:[], employees:[], shifts:[], records:[], settings:{}, admin:{} };

function initFirebase(config) {
  firebase.initializeApp(config); db = firebase.database();
  db.ref('.info/connected').on('value', function(s) { fbConnected = s.val() === true; updateConnDots(); });
  db.ref('sites').on('value', function(s) { D.sites = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('employees').on('value', function(s) { D.employees = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('shifts').on('value', function(s) { D.shifts = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('records').on('value', function(s) { D.records = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
  db.ref('settings').on('value', function(s) { D.settings = s.val() || {}; dataLoaded++; checkAllLoaded(); });
  db.ref('admin').on('value', function(s) { D.admin = s.val() || {}; dataLoaded++; checkAllLoaded(); });
}

function checkAllLoaded() {
  if (dataLoaded >= 6 && !initialLoadDone) {
    initialLoadDone = true;
    document.getElementById('loading-screen').classList.add('hidden');
    if (!D.admin || !D.admin.username) seedFirebase();
    showScreen('login-screen');
  }
}

function updateConnDots() {
  var cls = fbConnected ? 'conn-dot on' : 'conn-dot off';
  var lbl = fbConnected ? 'Synced' : 'Offline';
  document.querySelectorAll('#login-conn-dot,#admin-conn-dot,#emp-conn-dot').forEach(function(d) { d.className = cls; });
  var el = document.getElementById('admin-conn-label'); if (el) el.textContent = lbl;
}

function fbSet(p, d) { if (!db) return; db.ref(p).set(d).catch(function(e) { toast('Sync error: ' + e.message, 'error'); }); }
function fbUpdate(p, d) { if (!db) return; db.ref(p).update(d).catch(function(e) { toast('Sync error: ' + e.message, 'error'); }); }
function fbRemove(p) { if (!db) return; db.ref(p).remove().catch(function(e) { toast('Sync error: ' + e.message, 'error'); }); }

function getSites() { return D.sites || []; }
function getEmployees() { return D.employees || []; }
function getShifts() { return D.shifts || []; }
function getRecords() { return D.records || []; }
function getSettings() { return D.settings || {}; }
function getHolidays() { return (D.settings && D.settings.holidays) ? D.settings.holidays : []; }

function seedFirebase() {
  fbSet('admin', { username:'admin', password:'admin123' });
  fbSet('settings', { weeklyRegularHours:45, defaultBreak:30, demoMode:false, holidays:[
    '2025-01-01','2025-03-21','2025-04-18','2025-04-21','2025-05-01','2025-05-04','2025-05-25','2025-05-29','2025-08-26','2025-12-10','2025-12-25','2025-12-26',
    '2026-01-01','2026-03-21','2026-04-03','2026-04-06','2026-05-01','2026-05-04','2026-05-14','2026-05-25','2026-08-26','2026-12-10','2026-12-25','2026-12-26'
  ]});
  var s1=db.ref('sites').push().key, s2=db.ref('sites').push().key;
  fbSet('sites/'+s1, {id:s1,name:'Baywash Chemicals Windhoek',address:'Windhoek, Namibia',lat:-22.5609,lng:17.0658,radius:100});
  fbSet('sites/'+s2, {id:s2,name:'Baywash Chemicals Swakopmund',address:'Swakopmund, Namibia',lat:-22.6754,lng:14.5256,radius:100});
  var e1=db.ref('employees').push().key, e2=db.ref('employees').push().key, e3=db.ref('employees').push().key;
  fbSet('employees/'+e1, {id:e1,firstName:'James',lastName:'Carter',employeeId:'EMP001',pin:'1234',siteId:s1,active:true});
  fbSet('employees/'+e2, {id:e2,firstName:'Sarah',lastName:'Mitchell',employeeId:'EMP002',pin:'5678',siteId:s1,active:true});
  fbSet('employees/'+e3, {id:e3,firstName:'Daniel',lastName:'Nguyen',employeeId:'EMP003',pin:'4321',siteId:s2,active:true});
}

/* ===== STATE ===== */
var state={loggedIn:false,role:null,currentPage:'dashboard',empPage:'clock',currentEmployee:null,clockState:'idle',activeRecord:null,gpsStatus:'pending',gpsDistance:null,gpsLat:null,gpsLng:null,liveTimerInterval:null};

/* ===== UTILITIES ===== */
function fmtDate(d){var dt=d instanceof Date?d:new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtTime(d){var dt=d instanceof Date?d:new Date(d);return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');}
function todayStr(){return fmtDate(new Date());}
function getSiteName(id){var s=getSites().find(function(x){return x.id===id;});return s?s.name:'Unknown';}
function getEmpById(id){return getEmployees().find(function(x){return x.id===id;});}
function haversine(lat1,lon1,lat2,lon2){var R=6371000,t=function(n){return n*Math.PI/180;},dLat=t(lat2-lat1),dLon=t(lon2-lon1),a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

/* ===== HOURS CALCULATION ===== */
/* Format hours as decimal: 1.5, 8.0, 0.5 */
function fmtHrs(h){return (Math.round((h||0)*10)/10).toFixed(1);}

/* Week: Monday to Saturday. Sunday is double time, not part of any work week. */
function isSunday(ds){return new Date(ds+'T12:00:00').getDay()===0;}
function isHoliday(ds){return getHolidays().indexOf(ds)!==-1;}
function getDayType(ds){if(isSunday(ds))return'Sunday';if(isHoliday(ds))return'Holiday';return'Weekday';}
function getWeekStart(ds){var d=new Date(ds+'T12:00:00'),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return fmtDate(d);}

/* Get regular hours accumulated so far this week (Mon-Sat) for an employee */
function getEmployeeWeekRegularHours(empId,curDate){
  var ws=getWeekStart(curDate),we=new Date(ws+'T12:00:00');
  we.setDate(we.getDate()+5); /* Saturday — week ends here, Sunday is double time */
  var wes=fmtDate(we);
  return getRecords().filter(function(r){
    return r.employeeId===empId&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=wes;
  }).reduce(function(s,r){return s+(r.regularHours||0);},0);
}

/* Core calculation: converts clock-in/out to decimal hours with correct classification.
   - Sunday or Public Holiday: ALL hours = double time (×2.0), NOT counted toward 45h weekly target
   - Monday–Saturday: count toward 45h weekly target. First 45h = regular, anything over = overtime (×1.5) */
function calcHours(ci,co,bm,weekRegSoFar,dayType,weeklyCap){
  var totalMs=new Date(co)-new Date(ci),
      totalMin=Math.max(0,totalMs/60000-bm),
      totalHrs=Math.round(totalMin/6)/10; /* FIXED: /10 gives correct decimal (1h30 = 1.5) */
  if(dayType==='Sunday'||dayType==='Holiday')
    return{regularHours:0,overtimeHours:0,doubleTimeHours:totalHrs,totalHours:totalHrs};
  var rem=Math.max(0,weeklyCap-weekRegSoFar);
  if(rem>=totalHrs)return{regularHours:totalHrs,overtimeHours:0,doubleTimeHours:0,totalHours:totalHrs};
  if(rem<=0)return{regularHours:0,overtimeHours:totalHrs,doubleTimeHours:0,totalHours:totalHrs};
  return{regularHours:rem,overtimeHours:totalHrs-rem,doubleTimeHours:0,totalHours:totalHrs};
}

/* Count Mondays in a month — each Monday = one work week */
function getMondaysInMonth(year,month){
  var count=0,d=new Date(year,month,1);
  var dow=d.getDay();
  var daysToMon=dow===0?1:(dow===1?0:8-dow);
  d.setDate(d.getDate()+daysToMon);
  while(d.getMonth()===month&&d.getFullYear()===year){count++;d.setDate(d.getDate()+7);}
  return count;
}

/* Full monthly breakdown for an employee */
function getEmployeeMonthHours(empId,year,month){
  var cap=getSettings().weeklyRegularHours||45;
  var mondaysInMonth=getMondaysInMonth(year,month);
  var monthlyTarget=cap*mondaysInMonth;
  var monthStr=year+'-'+String(month+1).padStart(2,'0');
  var recs=getRecords().filter(function(r){
    return r.employeeId===empId&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,7)===monthStr;
  });
  var total={regular:0,overtime:0,doubleTime:0,total:0,recordCount:recs.length};
  recs.forEach(function(r){
    total.regular+=(r.regularHours||0);
    total.overtime+=(r.overtimeHours||0);
    total.doubleTime+=(r.doubleTimeHours||0);
    total.total+=(r.totalHours||0);
  });
  total.target=monthlyTarget;
  total.mondays=mondaysInMonth;
  total.overTarget=Math.max(0,total.total-monthlyTarget);
  total.effective=total.regular+total.overtime*1.5+total.doubleTime*2;
  return total;
}

/* ===== CLOCK RECORDS — with monthly breakdown ===== */
function renderRecords(){
  var recs=getRecords().sort(function(a,b){return(b.clockIn||'').localeCompare(a.clockIn||'');});
  var emps=getEmployees();
  var now=new Date(),curY=now.getFullYear(),curM=now.getMonth();
  var filterEmp='all',filterMonth=curY+'-'+String(curM+1).padStart(2,'0');

  var h='<div class="fade-in"><div class="flex items-center justify-between mb-6 flex-wrap gap-3"><div><h2 class="text-xl font-bold">Clock Records</h2><p class="text-sm" style="color:var(--muted)">Week: Mon–Sat &middot; 45h target &middot; Sunday &amp; holiday = double time</p></div></div>';

  /* Filters */
  h+='<div class="card mb-4"><div class="grid grid-cols-1 sm:grid-cols-3 gap-3"><div><label>Employee</label><select id="rec-filter-emp" onchange="filterRecords()"><option value="all">All Employees</option>';
  emps.forEach(function(e){h+='<option value="'+e.id+'">'+e.firstName+' '+e.lastName+' ('+e.employeeId+')</option>';});
  h+='</select></div><div><label>Month</label><input id="rec-filter-month" type="month" value="'+filterMonth+'" onchange="filterRecords()"></div><div class="flex items-end"><button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'rec-filter-emp\').value=\'all\';document.getElementById(\'rec-filter-month\').value=\''+filterMonth+'\';filterRecords()"><i class="fas fa-rotate"></i> Reset</button></div></div></div>';

  h+='<div id="records-body"></div></div>';
  return h;
}

function filterRecords(){
  var empId=document.getElementById('rec-filter-emp').value;
  var monthVal=document.getElementById('rec-filter-month').value;
  var parts=monthVal.split('-'),fYear=parseInt(parts[0]),fMonth=parseInt(parts[1])-1;
  var recs=getRecords().filter(function(r){
    if(r.status!=='completed'||!r.clockIn)return false;
    if(empId!=='all'&&r.employeeId!==empId)return false;
    return r.clockIn.slice(0,7)===monthVal;
  }).sort(function(a,b){return a.clockIn.localeCompare(b.clockIn);});

  var cap=getSettings().weeklyRegularHours||45;
  var mondays=getMondaysInMonth(fYear,fMonth);
  var monthlyTarget=cap*mondays;

  /* Group by week (Mon–Sat) */
  var weeks=[];
  var weekMap={};
  recs.forEach(function(r){
    var ws=getWeekStart(r.clockIn.slice(0,10));
    if(!weekMap[ws])weekMap[ws]={start:ws,records:[]};
    weekMap[ws].records.push(r);
  });
  Object.keys(weekMap).sort().forEach(function(ws){weeks.push(weekMap[ws]);});

  var h='';

  /* Monthly summary cards */
  var mTot={regular:0,overtime:0,doubleTime:0,total:0};
  weeks.forEach(function(w){w.records.forEach(function(r){mTot.regular+=(r.regularHours||0);mTot.overtime+=(r.overtimeHours||0);mTot.doubleTime+=(r.doubleTimeHours||0);mTot.total+=(r.totalHours||0);});});
  mTot.target=monthlyTarget; mTot.mondays=mondays; mTot.overTarget=Math.max(0,mTot.total-monthlyTarget); mTot.effective=mTot.regular+mTot.overtime*1.5+mTot.doubleTime*2;

  h+='<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">';
  h+='<div class="stat-card sc-regular"><div class="text-xs font-semibold" style="color:var(--muted)">REGULAR</div><div class="text-xl font-bold mono" style="color:var(--success)">'+fmtHrs(mTot.regular)+'h</div><div class="text-xs" style="color:var(--muted)">×1.0</div></div>';
  h+='<div class="stat-card sc-overtime"><div class="text-xs font-semibold" style="color:var(--muted)">OVERTIME</div><div class="text-xl font-bold mono" style="color:var(--warning)">'+fmtHrs(mTot.overtime)+'h</div><div class="text-xs" style="color:var(--muted)">×1.5 = '+fmtHrs(mTot.overtime*1.5)+'h</div></div>';
  h+='<div class="stat-card sc-double"><div class="text-xs font-semibold" style="color:var(--muted)">DOUBLE TIME</div><div class="text-xl font-bold mono" style="color:var(--danger)">'+fmtHrs(mTot.doubleTime)+'h</div><div class="text-xs" style="color:var(--muted)">×2.0 = '+fmtHrs(mTot.doubleTime*2)+'h</div></div>';
  h+='<div class="stat-card sc-total"><div class="text-xs font-semibold" style="color:var(--muted)">TOTAL</div><div class="text-xl font-bold mono" style="color:var(--accent)">'+fmtHrs(mTot.total)+'h</div><div class="text-xs" style="color:var(--muted)">Target: '+fmtHrs(mTot.target)+'h ('+mondays+' wk)</div></div>';
  h+='</div>';

  /* Progress bar */
  var pct=monthlyTarget>0?Math.min(100,(mTot.total/monthlyTarget)*100):0;
  h+='<div class="card mb-4" style="padding:.8rem 1.25rem"><div class="flex justify-between text-xs mb-1" style="color:var(--muted)"><span>Monthly progress</span><span>'+fmtHrs(mTot.total)+' / '+fmtHrs(mTot.target)+'h</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+(mTot.overTarget>0?'var(--warning)':'var(--accent)')+'"></div></div></div>';

  /* Per-week tables */
  weeks.forEach(function(w,i){
    var wTot={regular:0,overtime:0,doubleTime:0,total:0};
    w.records.forEach(function(r){wTot.regular+=(r.regularHours||0);wTot.overtime+=(r.overtimeHours||0);wTot.doubleTime+=(r.doubleTimeHours||0);wTot.total+=(r.totalHours||0);});
    var we=new Date(w.start+'T12:00:00');we.setDate(we.getDate()+5);
    h+='<div class="mb-4"><div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold">Week '+(i+1)+': '+w.start.slice(5)+' – '+fmtDate(we).slice(5)+'</h3><div class="flex gap-2 text-xs"><span class="badge badge-green">'+fmtHrs(wTot.regular)+'R</span>';
    if(wTot.overtime>0)h+='<span class="badge badge-amber">'+fmtHrs(wTot.overtime)+'OT</span>';
    if(wTot.doubleTime>0)h+='<span class="badge badge-red">'+fmtHrs(wTot.doubleTime)+'DT</span>';
    h+='<span class="badge badge-blue">Total: '+fmtHrs(wTot.total)+'h</span></div></div>';
    h+='<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Hours</th><th>Type</th></tr></thead><tbody>';
    w.records.forEach(function(r){
      var emp=getEmpById(r.employeeId);
      var dayType=getDayType(r.clockIn.slice(0,10));
      var typeBadge='<span class="badge badge-green">Regular</span>';
      if((r.doubleTimeHours||0)>0)typeBadge='<span class="badge badge-red">Double</span>';
      else if((r.overtimeHours||0)>0)typeBadge='<span class="badge badge-amber">Overtime</span>';
      h+='<tr><td class="text-xs">'+r.clockIn.slice(0,10)+' <span class="badge '+(dayType==='Sunday'?'badge-purple':dayType==='Holiday'?'badge-red':'badge-blue')+' ml-1">'+dayType+'</span></td><td class="text-sm">'+(emp?emp.firstName+' '+emp.lastName:'?')+'</td><td class="mono text-xs">'+(r.clockIn?r.clockIn.slice(11,16):'')+'</td><td class="mono text-xs">'+(r.clockOut?r.clockOut.slice(11,16):'')+'</td><td class="mono text-sm font-semibold">'+fmtHrs(r.totalHours||0)+'h</td><td>'+typeBadge+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });

  if(!weeks.length)h+='<div class="card text-center py-12"><i class="fas fa-clock-rotate-left text-3xl mb-3" style="color:var(--muted)"></i><p style="color:var(--muted)">No records for this period.</p></div>';

  /* Effective hours summary */
  if(mTot.total>0){
    h+='<div class="card mt-4" style="border-left:3px solid var(--accent)"><h3 class="font-semibold text-sm mb-3">Monthly Pay Summary</h3>';
    h+='<div class="grid grid-cols-2 gap-2 text-sm"><span style="color:var(--muted)">Regular ('+fmtHrs(mTot.regular)+'h × 1.0)</span><span class="mono">'+fmtHrs(mTot.regular)+'h</span>';
    h+='<span style="color:var(--muted)">Overtime ('+fmtHrs(mTot.overtime)+'h × 1.5)</span><span class="mono">'+fmtHrs(mTot.overtime*1.5)+'h</span>';
    h+='<span style="color:var(--muted)">Double Time ('+fmtHrs(mTot.doubleTime)+'h × 2.0)</span><span class="mono">'+fmtHrs(mTot.doubleTime*2)+'h</span>';
    h+='<span class="font-semibold pt-2 border-t" style="border-color:var(--border)">Effective Total</span><span class="mono font-bold" style="color:var(--accent)">'+fmtHrs(mTot.effective)+'h</span></div>';
    if(mTot.overTarget>0)h+='<div class="mt-3 p-2 rounded-lg text-sm" style="background:rgba(250,204,21,.08);color:var(--warning)"><i class="fas fa-arrow-up mr-1"></i> '+fmtHrs(mTot.overTarget)+'h over monthly target of '+fmtHrs(mTot.target)+'h</div>';
    h+='</div>';
  }

  document.getElementById('records-body').innerHTML=h;
}

function generateExport(){

    var text='BAYWASH MONTHLY SUMMARY — '+monthName+' '+fYear+'\n'+'='.repeat(50)+'\n\n';
    emps.forEach(function(emp){
      var m=getEmployeeMonthHours(emp.id,fYear,fMonth);
      if(m.recordCount===0)return;
      text+=emp.firstName+' '+emp.lastName+' ('+emp.employeeId+')\n';
      text+='  Regular:     '+fmtHrs(m.regular)+'h (x1.0 = '+fmtHrs(m.regular)+'h)\n';
      text+='  Overtime:    '+fmtHrs(m.overtime)+'h (x1.5 = '+fmtHrs(m.overtime*1.5)+'h)\n';
      text+='  Double Time: '+fmtHrs(m.doubleTime)+'h (x2.0 = '+fmtHrs(m.doubleTime*2)+'h)\n';
      text+='  Total:       '+fmtHrs(m.total)+'h / '+fmtHrs(m.target)+'h target\n';
      text+='  Effective:   '+fmtHrs(m.effective)+'h\n';
      if(m.overTarget>0)text+='  OVER TARGET: '+fmtHrs(m.overTarget)+'h\n';
      text+='\n';
    });
    document.getElementById('export-output').innerHTML='<div class="card"><pre class="mono text-xs whitespace-pre-wrap" style="color:var(--fg)">'+text+'</pre></div>';
    document.getElementById('export-output').dataset.text=text;
  } else {
    var emp=getEmpById(empId);
    var m=getEmployeeMonthHours(empId,fYear,fMonth);
    var text='BAYWASH — '+monthName+' '+fYear+'\n'+'-'.repeat(40)+'\n';
    text+='Employee: '+(emp?emp.firstName+' '+emp.lastName:'?')+' ('+(emp?emp.employeeId:'')+')\n';
    text+='Weekly Target: '+(getSettings().weeklyRegularHours||45)+'h\n';
    text+='Weeks in Month: '+m.mondays+'\n';
    text+='Monthly Target: '+fmtHrs(m.target)+'h\n\n';
    text+='Regular Hours:     '+fmtHrs(m.regular)+'h (x1.0 = '+fmtHrs(m.regular)+'h)\n';
    text+='Overtime Hours:    '+fmtHrs(m.overtime)+'h (x1.5 = '+fmtHrs(m.overtime*1.5)+'h)\n';
    text+='Double Time Hours: '+fmtHrs(m.doubleTime)+'h (x2.0 = '+fmtHrs(m.doubleTime*2)+'h)\n';
    text+='-'.repeat(40)+'\n';
    text+='Total Hours:       '+fmtHrs(m.total)+'h\n';

    document.getElementById('export-output').innerHTML='<div class="card"><pre class="mono text-xs whitespace-pre-wrap" style="color:var(--fg)">'+text+'</pre></div>';
    document.getElementById('export-output').dataset.text=text;
  }
}

function copyExport(){

}

function saveHoursSettings(){
  var weekly=parseInt(document.getElementById('set-weekly').value);
  var brk=parseInt(document.getElementById('set-break').value);
  if(!weekly||weekly<1){toast('Invalid weekly hours','error');return;}
  fbUpdate('settings',{weeklyRegularHours:weekly,defaultBreak:brk});
  toast('Saved','success');
}

function addHoliday(){
  var d=document.getElementById('set-hol-date').value;
  if(!d){toast('Pick a date','error');return;}
  var holidays=getHolidays().slice();
  if(holidays.indexOf(d)===-1)holidays.push(d);
  holidays.sort();
  fbUpdate('settings',{holidays:holidays});
  document.getElementById('set-hol-date').value='';
  document.getElementById('set-hol-name').value='';
  toast('Holiday added','success');
  navigateAdmin('settings');
}

function removeHoliday(d){
  var holidays=getHolidays().filter(function(h){return h!==d;});
  fbUpdate('settings',{holidays:holidays});
  toast('Removed','success');
  navigateAdmin('settings');
}

function confirmClearAll(){
  openModal('<h3 class="font-bold text-lg mb-3">Clear ALL Records?</h3><p class="text-sm mb-4" style="color:var(--muted)">This deletes all clock records permanently. Employees, sites, and settings are kept.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="fbSet(\'records\',{});closeModal();navigateAdmin(\'settings\');toast(\'Cleared\',\'success\')"><i class="fas fa-trash"></i> Clear All</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');
}

/* ===== EMPLOYEE CLOCK PAGE ===== */
function renderClockPage(){
  var emp=state.currentEmployee,site=getSites().find(function(s){return s.id===emp.siteId;});
  var clockedIn=state.clockState==='clocked_in';
  var weekReg=getEmployeeWeekRegularHours(emp.id,todayStr());
  var cap=getSettings().weeklyRegularHours||45;
  var pct=Math.min(100,(weekReg/cap)*100);
  var td=getDayType(todayStr());

  var h='<div class="fade-in flex flex-col items-center justify-center" style="min-height:70vh">';
  h+='<div class="text-center mb-6"><div class="text-sm font-semibold mb-1">'+emp.firstName+' '+emp.lastName+'</div><div class="text-xs" style="color:var(--muted)">'+getSiteName(emp.siteId)+'</div>';
  h+='<div class="mt-2"><span class="badge '+(td==='Sunday'?'badge-purple':td==='Holiday'?'badge-red':'badge-blue')+'">'+td+' — '+(td==='Sunday'||td==='Holiday'?'Double Time (x2.0)':'Regular Rate')+'</span></div></div>';

  /* Clock button */
  if(clockedIn){
    h+='<button class="clock-btn pulse" style="border-color:var(--danger);color:var(--danger);background:rgba(248,113,113,.05)" onclick="doClockOut()"><i class="fas fa-stop text-3xl mb-1"></i><span>CLOCK OUT</span></button>';
    h+='<div class="mt-4 text-center"><div class="text-xs" style="color:var(--muted)">Clocked in at '+fmtTime(new Date(state.activeRecord.clockIn))+'</div>';
    h+='<div class="mono text-3xl font-bold mt-2" style="color:var(--success)" id="live-timer">0.0h</div></div>';
  } else {
    h+='<button class="clock-btn" style="border-color:var(--success);color:var(--success);background:rgba(52,211,153,.05)" onclick="doClockIn()" id="clock-in-btn"><i class="fas fa-play text-3xl mb-1"></i><span>CLOCK IN</span></button>';
  }

  /* GPS status */
  h+='<div class="mt-4 flex items-center gap-2 text-xs" style="color:var(--muted)"><span class="conn-dot '+(state.gpsStatus==='active'?'on':state.gpsStatus==='inactive'?'off':'loading')+'" id="gps-dot"></span>';
  if(state.gpsStatus==='active')h+='GPS verified ('+Math.round(state.gpsDistance)+'m from site)';
  else if(state.gpsStatus==='inactive')h+='Outside site radius';
  else h+='Checking GPS...';
  h+='</div>';

  /* Week progress */
  h+='<div class="w-full max-w-xs mt-8 card" style="padding:1rem"><div class="flex justify-between text-xs mb-1" style="color:var(--muted)"><span>This Week (Mon–Sat)</span><span class="mono">'+fmtHrs(weekReg)+' / '+cap+'h</span></div>';
  h+='<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+(weekReg>=cap?'var(--warning)':'var(--success)')+'"></div></div>';
  if(weekReg>=cap)h+='<div class="text-xs mt-2" style="color:var(--warning)"><i class="fas fa-arrow-up mr-1"></i>Overtime: '+fmtHrs(weekReg-cap)+'h (x1.5)</div>';
  h+='</div></div>';
  return h;
}

function initClockPage(){
  if(state.clockState==='clocked_in')startLiveTimer();
  checkGPS();
}

function startLiveTimer(){
  if(state.liveTimerInterval)clearInterval(state.liveTimerInterval);
  var start=new Date(state.activeRecord.clockIn).getTime();
  var u=function(){
    var el=document.getElementById('live-timer');
    if(!el){clearInterval(state.liveTimerInterval);return;}
    el.textContent=fmtHrs((Date.now()-start)/3600000)+'h';
  };
  u();
  state.liveTimerInterval=setInterval(u,10000);
}

function checkGPS(){
  if(!navigator.geolocation){state.gpsStatus='inactive';return;}
  var site=getSites().find(function(s){return s.id===state.currentEmployee.siteId;});
  if(!site){state.gpsStatus='inactive';return;}
  navigator.geolocation.getCurrentPosition(function(p){
    state.gpsLat=p.coords.latitude;state.gpsLng=p.coords.longitude;
    state.gpsDistance=haversine(site.lat,site.lng,state.gpsLat,state.gpsLng);
    state.gpsStatus=state.gpsDistance<=site.radius?'active':'inactive';
    var dot=document.getElementById('gps-dot');
    if(dot)dot.className='conn-dot '+(state.gpsStatus==='active'?'on':'off');
  },function(){state.gpsStatus='inactive';var dot=document.getElementById('gps-dot');if(dot)dot.className='conn-dot off';},{enableHighAccuracy:true,timeout:10000});
}

function doClockIn(){
  var emp=state.currentEmployee;
  var todayShifts=getShifts().filter(function(s){return s.employeeId===emp.id&&s.date===todayStr();});
  var shiftId=todayShifts.length?todayShifts[0].id:null;
  var id=db.ref('records').push().key;
  var now=new Date().toISOString();
  var data={id:id,employeeId:emp.id,siteId:emp.siteId,shiftId:shiftId,clockIn:now,clockOut:null,status:'clocked_in',regularHours:0,overtimeHours:0,doubleTimeHours:0,totalHours:0,gpsLat:state.gpsLat,gpsLng:state.gpsLng,gpsDistance:state.gpsDistance};
  fbSet('records/'+id,data);
  state.clockState='clocked_in';
  state.activeRecord=data;
  navigateEmp('clock');
  toast('Clocked in','success');
}

function doClockOut(){
  if(!state.activeRecord)return;
  var rec=state.activeRecord;
  var now=new Date().toISOString();
  var dayType=getDayType(rec.clockIn.slice(0,10));
  var bm=0;
  if(rec.shiftId){var sh=getShifts().find(function(s){return s.id===rec.shiftId;});if(sh)bm=sh.breakMinutes||0;}else{bm=getSettings().defaultBreak||0;}
  var weekRegSoFar=getEmployeeWeekRegularHours(rec.employeeId,rec.clockIn.slice(0,10));
  var cap=getSettings().weeklyRegularHours||45;
  var hrs=calcHours(rec.clockIn,now,bm,weekRegSoFar,dayType,cap);
  fbUpdate('records/'+rec.id,{clockOut:now,status:'completed',regularHours:hrs.regularHours,overtimeHours:hrs.overtimeHours,doubleTimeHours:hrs.doubleTimeHours,totalHours:hrs.totalHours,breakMinutes:bm,dayType:dayType});
  if(state.liveTimerInterval)clearInterval(state.liveTimerInterval);
  state.clockState='idle';state.activeRecord=null;
  navigateEmp('clock');
  toast('Clocked out — '+fmtHrs(hrs.totalHours)+'h'+(hrs.overtimeHours>0?' (incl. '+fmtHrs(hrs.overtimeHours)+'h OT)':'')+((hrs.doubleTimeHours||0)>0?' (Double Time)':''),'success');
}

/* ===== EMPLOYEE HISTORY ===== */
function renderEmpHistory(){
  var emp=state.currentEmployee;
  var recs=getRecords().filter(function(r){return r.employeeId===emp.id&&r.status==='completed';}).sort(function(a,b){return(b.clockIn||'').localeCompare(a.clockIn||'');});
  var h='<div class="fade-in"><h2 class="text-xl font-bold mb-2">My History</h2><p class="text-sm mb-4" style="color:var(--muted)">Week: Mon–Sat &middot; '+fmtHrs(getSettings().weeklyRegularHours||45)+'h target &middot; Sunday &amp; holidays = double time</p>';

  /* Current month summary */
  var now=new Date(),mData=getEmployeeMonthHours(emp.id,now.getFullYear(),now.getMonth());
  if(mData.recordCount>0){
    h+='<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">';
    h+='<div class="stat-card sc-regular"><div class="text-xs" style="color:var(--muted)">REGULAR</div><div class="text-lg font-bold mono" style="color:var(--success)">'+fmtHrs(mData.regular)+'h</div></div>';
    h+='<div class="stat-card sc-overtime"><div class="text-xs" style="color:var(--muted)">OVERTIME</div><div class="text-lg font-bold mono" style="color:var(--warning)">'+fmtHrs(mData.overtime)+'h</div></div>';
    h+='<div class="stat-card sc-double"><div class="text-xs" style="color:var(--muted)">DOUBLE TIME</div><div class="text-lg font-bold mono" style="color:var(--danger)">'+fmtHrs(mData.doubleTime)+'h</div></div>';
    h+='<div class="stat-card sc-total"><div class="text-xs" style="color:var(--muted)">THIS MONTH</div><div class="text-lg font-bold mono" style="color:var(--accent)">'+fmtHrs(mData.total)+'h</div><div class="text-xs" style="color:var(--muted)">Target: '+fmtHrs(mData.target)+'h</div></div>';
    h+='</div>';
    if(mData.overTarget>0)h+='<div class="mb-4 p-3 rounded-lg text-sm" style="background:rgba(250,204,21,.08);color:var(--warning)"><i class="fas fa-arrow-up mr-1"></i> '+fmtHrs(mData.overTarget)+'h over monthly target</div>';
  }

  /* Records table */
  h+='<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Type</th><th>Day</th></tr></thead><tbody>';
  if(recs.length)recs.forEach(function(r){
    var ds=r.clockIn.slice(0,10),dt=getDayType(ds);
    var typeBadge='<span class="badge badge-green">Regular</span>';
    if((r.doubleTimeHours||0)>0)typeBadge='<span class="badge badge-red">Double</span>';
    else if((r.overtimeHours||0)>0)typeBadge='<span class="badge badge-amber">OT</span>';
    var dayBadge='<span class="badge badge-blue">'+dt+'</span>';
    if(dt==='Sunday')dayBadge='<span class="badge badge-purple">Sunday</span>';
    else if(dt==='Holiday')dayBadge='<span class="badge badge-red">Holiday</span>';
    h+='<tr><td class="text-sm">'+ds+'</td><td class="mono text-xs">'+r.clockIn.slice(11,16)+'</td><td class="mono text-xs">'+r.clockOut.slice(11,16)+'</td><td class="mono text-sm font-semibold">'+fmtHrs(r.totalHours||0)+'h</td><td>'+typeBadge+'</td><td>'+dayBadge+'</td></tr>';
  });
  else h+='<tr><td colspan="6" class="text-center py-8" style="color:var(--muted)">No records yet.</td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}
