<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BayWash Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/all.min.css">
<style>
:root{--bg:#0c0e16;--bg2:#131620;--card:#1a1e2e;--card2:#212638;--border:#2a3048;--fg:#e2e4ea;--muted:#6b7094;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}.mono{font-family:'JetBrains Mono',monospace}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:border-color .2s}.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:8px;font-weight:500;font-size:.875rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit}.btn-primary{background:var(--accent);color:#0c0e16}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-danger{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.3)}.btn-danger:hover{background:rgba(248,113,113,.25)}.btn-sm{padding:.4rem .8rem;font-size:.8rem}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.6rem .8rem;border-radius:8px;font-family:inherit;font-size:.875rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--card);color:var(--fg)}
label{font-size:.8rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.3rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;color:var(--muted);font-size:.875rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.05)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.08);border-left-color:var(--accent)}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.8rem 1.2rem;border-radius:8rem;font-size:.85rem;display:flex;align-items:center;gap:.6rem;animation:slideIn .3s ease;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-success{background:#065f46;border:1px solid #34d399;color:#a7f3d0}
.toast-error{background:#7f1d1d;border:1px solid #f87171;color:#fecaca}
.toast-info{background:#0c4a6e;border:1px solid #38bdf8;color:#bae6fd}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px}to{opacity:1;transform:translateY(0}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
.fade-in{animation:fadeIn .3s ease}
.clock-btn{width:200px;height:200px;border-radius:50%;border:4px solid;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s;position:relative;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem}
.clock-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.clock-btn:not(:disabled):hover{transform:scale(1.05)}
.clock-btn.pulse::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid;animation:pulse-ring 1.5s infinite}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px;z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding:1.5rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.6rem .8rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
td{padding:.6rem .8rem;font-size:.85rem;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}
tr:hover td{background:rgba(232,168,56,.03)}
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.15);color:var(--success)}.badge-red{background:rgba(248,113,113,.15);color:var(--danger)}.badge-amber{background:rgba(232,168,56,.15);color:var(--accent)}.badge-blue{background:rgba(56,189,248,.15);color:var(--info)}.badge-purple{background:rgba(168,85,247,.15);color:#c084fc}
.gps-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.gps-dot.active{background:var(--success);box-shadow:0 0 8px var(--success)}
.gps-dot.inactive{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.gps-dot.pending{background:var(--warning);animation:pulse-ring 1s infinite}
.bg-pattern{background-image:radial-gradient(circle at 1px 1px,rgba(232,168,56,.04) 1px,transparent 0);background-size:40px 40px}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.conn-dot.loading{background:var(--warning);animation:pulse-ring 1s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--fg)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-btn{width:160px;height:160px;font-size:.95rem}}

<div id="toast-container" class="toast-container"></div>

<div id="setup-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-2xl fade-in" style="border-color:color-mix(in srgb,var(--accent) 20%,var(--border))">
    <div class="text-center mb-6"><div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-cloud-arrow-up text-xl" style="color:#0c0e16"></i></div><h1 class="text-2xl font-bold">Connect to Firebase</h1><p class="text-sm mt-1" style="color:var(--muted)">One-time setup</p></div>
    <div class="grid gap-3 mb-6">
      <div class="flex gap-3 items-start"><span class="step-num" style="background:var(--accent);color:#0c0e16">1</span><div><p class="text-sm font-medium">Go to <a href="https://console.firebase.google.com" target="_blank" style="color:var(--accent);text-decoration:underline">console.firebase.google.com</a></p></div></div>
      <div class="flex gap-3 items-start"><span class="step-num" style="background:var(--accent);color:#0c0e16">2</span><div><p class="text-sm font-medium">Create project → <strong>Databases & Storage → Realtime Database</strong> (lightning bolt) → test mode</p></div></div>
      <div class="flex gap-3 items-start"><span class="step-num" style="background:var(--accent);color:#0c0e16">3</span><div><p class="text-sm font-medium">⚙️ Settings → <strong>&lt;/&gt; Web icon → Register → copy firebaseConfig</p></div></div>
      <div class="flex gap-3 items-start"><span class="step-num" style="background:var(--accent);color:#0c0e16">4</span><div><p class="text-sm font-medium">Paste config below → click Connect</p></div>
    </div>
    <div class="mb-4"><label>Paste your firebaseConfig here</label><textarea id="fb-config-paste" rows="8" style="font-family:'JetBrains Mono',monospace;font-size:.75rem;resize:vertical" placeholder='const firebaseConfig = { ... };'></textarea></div>
    <div id="fb-config-status" class="text-sm mb-4 hidden"></div>
    <button class="btn btn-primary w-full justify-center" onclick="connectFirebase()" id="fb-connect-btn"><i class="fas fa-plug"></i> Connect & Initialize</button>
  </div>
</div>

<div id="loading-screen" class="hidden min-h-screen flex items-center justify-content">
  <div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing data...</p></div>
</div>

<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md fade-in" style="border-color:color-mix(in srgb,var(--accent) 20%,var(--border))">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div>
      <h1 class="text-2xl font-bold">BayWash Clock In</h1>
      <p class="text-sm mt-1 flex items-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-locked-dot"></span></p>
    </div>
    <div class="flex mb-6 border-b" style="border-color:var(--border)">
      <button class="tab-btn active" onclick="switchLoginTab('employee')"><i class="fas fa-user mr-1"></i> Employee</button>
      <button class="tab-btn" onclick="switchLoginTab('admin')"><i class="fa-shield-halved mr-1"></i> Admin</button>
    </div>
    <div id="login-employee">
      <div class="mb-4"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off"></div>
      <div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4"></div>
      <button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button>
    </div>
    <div id="login-admin" class="hidden">
      <div class="mb-4"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div>
      <div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div>
      <button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button>
    </div>
  </div>
</div>

<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div><div class="font-bold text-sm">BayWash Clock In</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div>
    <nav class="py-3" id="admin-nav">
      <div class="px-4 py-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Main</div>
      <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-gauge-high w-5 text-center"></i> Dashboard</a>
      <a class="sidebar-link" data-page="sites"><i class="fas fa-location-dot w-5 text-center"></i> Sites</a>
      <a class="sidebar-link" data-page="employees"><i class="fas fa-users w-5 text-center"></i> Employees</a>
      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">Data</div>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Export</a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.5">System</div>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
</div>

<div id="employee-layout" class="hidden">
  <div class="min-h-screen flex flex-col">
    <header class="p-4 flex items-center justify-between border-b" style="border-color:var(--border);background:var(--bg2)">
      <div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xs" style="color:#0c0e16"></i></div><span class="font-bold text-sm">BayWash</span><span class="conn-dot on" id="emp-conn-dot"></span></div>
      <div class="flex items-center gap-3"><span id="emp-header-name" class="text-sm hidden sm:inline" style="color:var(--muted)"></span><button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i></button></div>
    </header>
    <div class="flex-1 flex">
      <nav class="w-16 sm:w-48 border-r flex flex-col pt-4" style="border-color:var(--border);background:var(--bg2)" id="emp-nav">
        <a class="sidebar-link active" data-epage="clock" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-fingerprint text-lg"></i><span class="text-xs hidden sm:inline mt-1">Clock</span></a>
        <a class="sidebar-link" data-epage="history" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-history text-lg"></i><span class="text-xs hidden sm:inline mt-1">History</span></a>
      </nav>
      <main class="flex-1 p-4 sm:p-6" id="emp-content"></main>
    </div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box fade-in" id="modal-box"></div></div>

<script>
var EMBEDDED_FB = {
  apiKey: "AIzaSyAkHU3eWCWTUt3Ks0Vxq3PkgcATtin0Zaw",
  authDomain: "baywashclock.firebaseapp.com",
  databaseURL: "https://baywashclock-default-rtdb.firebaseio.com",
  projectId: "baywashclock",
  storageBucket: "baywashclock.firebasestorage.app",
  messagingSenderId: "207388184141",
  appId: "1:207388184141:web:718d4348bc91672a369604"
};

var db = null, fbConnected = false, dataLoaded = 0, initialLoadDone = false;
var D = { sites:[], employees:[], shifts:[], records:[], settings:{}, admin:{} };

function initFirebase(config) {
  try {
    firebase.initializeApp(config); db = firebase.database();
    db.ref('.info/connected').on('value', function(s){ fbConnected = s.val() === true; updateConnDots(); });
    db.ref('sites').on('value', function(s){ D.sites = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
    db.ref('employees').on('value', function(s){ D.employees = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
    db.ref('shifts').on('value', function(s){ D.shifts = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
    db.ref('records').on('value', function(s){ D.records = s.val() ? Object.values(s.val()) : []; dataLoaded++; checkAllLoaded(); });
    db.ref('settings').on('value', function(s){ D.settings = s.val() || {}; dataLoaded++; checkAllLoaded(); });
    db.ref('admin').on('value', function(s){ D.admin = s.val() || {}; dataLoaded++; checkAllLoaded(); });
  } catch(e) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);color:var(--fg);padding:2rem"><div style="text-align:center"><h2 style="color:var(--danger)">Error loading app</h2><p style="color:var(--muted)">'+e.message+'</p><p style="color:var(--muted)">Check your internet connection and try refreshing the page</p></div></div>';
  }
  setTimeout(function(){if(dataLoaded<6){showScreen('setup-screen');toast('Connection failed','error');},10000);
} else {
    showScreen('login-screen');
  }
}

var state={loggedIn:false,role:null,currentPage:'dashboard',empPage:'clock',currentEmployee:null,clockState:'idle',activeRecord:null,gpsStatus:'pending',gpsDistance:null,gpsLat:null,gpsLng:null,liveTimerInterval:null};

function fmtDate(d){var dt=d instanceof Date?d:new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtTime(d){var dt=d instanceof Date?d:new Date(d);return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');}
function todayStr(){return fmtDate(new Date());}
function getSiteName(id){var s=getSites().find(function(x){return x.id===id;});return s?s.name:'Unknown';}
function getEmpById(id){return getEmployees().find(function(x){return x.id===id;});}

function haversine(lat1,lon1,lat2,lon2){
  var R=6371000,t=function(n){return n*Math.PI/180;},dLat=t(lat2-lat1),dLon=t(lon2-lon1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)*Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function isSunday(ds){return new Date(ds+'T12:00:00').getDay()===0;}
function isHoliday(ds){return getHolidays().indexOf(ds)!==-1;}
function getDayType(ds){if(isSunday(ds))return'Sunday';if(isHoliday(ds))return'Holiday';return'Weekday';}
function getWeekStart(ds){var d=new Date(ds+'T12:00:00'),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1);return fmtDate(d);}
function getEmployeeWeekRegularHours(empId,curDate){var ws=getWeekStart(curDate),we=new Date(ws+'T12:00:00');we.setDate(we.getDate()+6);var wes=fmtDate(we);return getRecords().filter(function(r){return r.employeeId===empId&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=wes;}).reduce(function(s,r){return s+(r.regularHours||0);},0);}
function calcHours(ci,co,bm,weekRegSoFar,dayType,weeklyCap){var totalMs=new Date(co)-new Date(ci);var totalMin=Math.max(0,totalMs/60000-bm);var totalHrs=Math.round(totalMin/6)/100;if(dayType==='Sunday'||dayType==='Holiday')return{regularHours:0,overtimeHours:0,doubleTimeHours:totalHrs,totalHours:totalHrs;}
function switchLoginTab(tab){document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',(tab==='employee'&&i===0)||(tab==='admin'&&i===1);});document.getElementById('login-employee').classList.toggle('hidden',tab!=='employee');document.getElementById('login-admin').classList.toggle('hidden',tab!=='admin');}
function adminLogin(){var u=document.getElementById('admin-user').value.trim(),p=document.getElementById('admin-pass').value;if(u===D.admin.username&&p===D.admin.password){state.loggedIn=true;state.role='admin';state.currentPage='dashboard';showAdmin();toast('Welcome, Admin','success');}else toast('Invalid credentials','error');}
function employeeLogin(){var eid=document.getElementById('emp-id').value.trim().toUpperCase(),pin=document.getElementById('emp-pin').value;var emp=getEmployees().find(function(e){return e.employeeId===eid&&e.pin===pin&&e.active;});if(emp){state.loggedIn=true;state.role='employee';state.currentEmployee=emp;state.empPage='clock';var recs=getRecords().filter(function(r){return r.employeeId===emp.id&&r.status==='clocked_in';});if(recs.length){state.clockState='clocked_in';state.activeRecord=recs[0];}else{state.clockState='idle';state.activeRecord=null;}showEmployee();toast('Welcome, '+emp.firstName,'success');}else toast('Invalid Employee ID or PIN','error');}
function logout(){if(state.liveTimerInterval)clearInterval(state.liveTimerInterval);state={loggedIn:false,role:null,currentPage:'dashboard',empPage:'clock',currentEmployee:null,clockState:'idle',activeRecord:null,gpsStatus:'pending',gpsDistance:null,gpsLat:null,gpsLng:null,liveTimerInterval:null};document.getElementById('admin-layout').classList.add('hidden');document.getElementById('employee-layout').classList.add('hidden');showScreen('login-screen');document.getElementById('admin-user').value='';document.getElementById('admin-pass').value='';document.getElementById('emp-id').value='';document.getElementById('emp-pin').value='';}
function showAdmin(){showScreen('admin-layout');navigateAdmin(state.currentPage);}
function showEmployee(){showScreen('employee-layout');document.getElementById('emp-header-name').textContent=state.currentEmployee.firstName+' '+state.currentEmployee.lastName;navigateEmp(state.empPage);}
function navigateAdmin(page){state.currentPage=page;document.querySelectorAll('#admin-nav .sidebar-link').forEach(function(l){l.classList.toggle('active',l.dataset.page===page);});var el=document.getElementById('admin-content');var R={dashboard:renderDashboard,sites:renderSites,employees:renderEmployees,shifts:renderShifts,records:renderRecords,export:renderExport,settings:renderSettings};if(R[page])el.innerHTML=R[page]();if(page==='dashboard')startDashClock();}
document.getElementById('admin-nav').addEventListener('click',function(e){var l=e.target.closest('.sidebar-link');if(l&&l.dataset.page){navigateAdmin(l.dataset.page);document.getElementById('sidebar').classList.remove('open');}});
