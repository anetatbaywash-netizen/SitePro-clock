<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SitePro Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#090b13;--bg2:#0f1219;--card:#151923;--card2:#1c2130;--border:#252d42;--fg:#e4e6ec;--muted:#6a7199;--accent:#e8a838;--accent2:#d4922a;--accent-glow:rgba(232,168,56,.12);--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24;--purple:#c084fc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 50%,rgba(232,168,56,.05) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(56,189,248,.03) 0%,transparent 50%),radial-gradient(ellipse at 50% 90%,rgba(168,85,247,.025) 0%,transparent 50%);pointer-events:none;z-index:0}
body>*{position:relative;z-index:1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;transition:all .25s ease}
.card:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--border));box-shadow:0 4px 24px rgba(0,0,0,.2)}
.card-glass{background:linear-gradient(135deg,rgba(21,25,35,.9),rgba(28,33,48,.7));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:1.25rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:9px;font-weight:500;font-size:.85rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0c0e16;box-shadow:0 2px 12px rgba(232,168,56,.25)}.btn-primary:hover{box-shadow:0 4px 20px rgba(232,168,56,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}.btn-danger:hover{background:rgba(248,113,113,.2);border-color:rgba(248,113,113,.4)}
.btn-success{background:rgba(52,211,153,.12);color:var(--success);border:1px solid rgba(52,211,153,.25)}.btn-success:hover{background:rgba(52,211,153,.2)}
.btn-sm{padding:.35rem .7rem;font-size:.78rem;border-radius:7px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.55rem .75rem;border-radius:9px;font-family:inherit;font-size:.85rem;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,168,56,.1)}
select option{background:var(--card);color:var(--fg)}
textarea{resize:vertical;min-height:80px;font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.5}
label{font-size:.78rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.25rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.2rem;color:var(--muted);font-size:.85rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.04)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.07);border-left-color:var(--accent)}
.sidebar-link.active::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--accent);border-radius:1px}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{padding:.75rem 1.1rem;border-radius:10px;font-size:.83rem;display:flex;align-items:center;gap:.55rem;animation:toastIn .35s cubic-bezier(.4,0,.2,1);min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:auto;backdrop-filter:blur(8px)}
.toast-success{background:rgba(6,95,70,.9);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.toast-error{background:rgba(127,29,29,.9);border:1px solid rgba(248,113,113,.3);color:#fecaca}
.toast-info{background:rgba(12,74,110,.9);border:1px solid rgba(56,189,248,.3);color:#bae6fd}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 40px rgba(52,211,153,.12),inset 0 0 40px rgba(52,211,153,.03)}50%{box-shadow:0 0 70px rgba(52,211,153,.25),inset 0 0 60px rgba(52,211,153,.06)}}
@keyframes breatheOut{0%,100%{box-shadow:0 0 40px rgba(248,113,113,.12),inset 0 0 40px rgba(248,113,113,.03)}50%{box-shadow:0 0 70px rgba(248,113,113,.25),inset 0 0 60px rgba(248,113,113,.06)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .35s ease}
.fade-in-scale{animation:fadeInScale .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .2s}
.modal-overlay.show{opacity:1}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:1.5rem;transform:scale(.95);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.55rem .75rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--card);z-index:2}
td{padding:.55rem .75rem;font-size:.83rem;border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)}
tr:hover td{background:rgba(232,168,56,.025)}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.01em}
.badge-green{background:rgba(52,211,153,.12);color:var(--success)}
.badge-red{background:rgba(248,113,113,.12);color:var(--danger)}
.badge-amber{background:rgba(232,168,56,.12);color:var(--accent)}
.badge-blue{background:rgba(56,189,248,.12);color:var(--info)}
.badge-purple{background:rgba(168,85,247,.12);color:var(--purple)}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.conn-dot.loading{background:var(--warning);animation:pulseRing 1.2s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;transition:all .2s;background:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--fg)}
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.15rem;position:relative;overflow:hidden;transition:all .25s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.sc-amber::before{background:var(--accent)}.sc-green::before{background:var(--success)}.sc-blue::before{background:var(--info)}.sc-red::before{background:var(--danger)}.sc-purple::before{background:var(--purple)}
.search-box{position:relative}.search-box input{padding-left:2.2rem}.search-box i{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
.clock-face{position:relative;width:260px;height:260px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);user-select:none}
.clock-face.ci{background:radial-gradient(circle at 38% 32%,rgba(52,211,153,.1),var(--card) 65%);border:2.5px solid var(--success);animation:breathe 3s ease-in-out infinite}
.clock-face.ci:hover{transform:scale(1.05);border-color:#6ee7b7}
.clock-face.ci:active{transform:scale(.96)}
.clock-face.co{background:radial-gradient(circle at 38% 32%,rgba(248,113,113,.1),var(--card) 65%);border:2.5px solid var(--danger);animation:breatheOut 2.5s ease-in-out infinite}
.clock-face.co:hover{transform:scale(1.05);border-color:#fca5a5}
.clock-face.co:active{transform:scale(.96)}
.clock-face.idle{background:radial-gradient(circle at 38% 32%,rgba(232,168,56,.06),var(--card) 65%);border:2.5px solid var(--border)}
.clock-face.idle:hover{border-color:var(--accent)}
.clock-ring{position:absolute;inset:-16px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--border) 60%,transparent);animation:spinSlow 40s linear infinite;pointer-events:none}
.clock-face::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid;opacity:0;animation:pulseRing 2.5s ease-out infinite;pointer-events:none}
.clock-face.ci::after{border-color:var(--success)}.clock-face.co::after{border-color:var(--danger)}
.cf-icon{font-size:2.2rem;margin-bottom:.2rem}.cf-label{font-size:.95rem;font-weight:700;letter-spacing:.04em}.cf-sub{font-size:.68rem;color:var(--muted);margin-top:.1rem}
.big-time{font-family:'JetBrains Mono',monospace;font-size:3.2rem;font-weight:700;letter-spacing:-.02em;line-height:1;background:linear-gradient(135deg,var(--fg),color-mix(in srgb,var(--fg) 70%,var(--accent)));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.emp-hero{background:linear-gradient(180deg,rgba(232,168,56,.04) 0%,transparent 60%);border-radius:18px;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.emp-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,56,.07),transparent 70%);pointer-events:none}
.emp-avatar{width:60px;height:60px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;margin-bottom:.6rem;border:2px solid var(--accent);color:var(--accent);background:var(--card)}
.chart-canvas{width:100%;border-radius:10px}
.filter-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.filter-row .filter-group{display:flex;flex-direction:column;gap:.2rem;min-width:140px;flex:1}
.filter-row .filter-group label{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state i{font-size:2.5rem;margin-bottom:.75rem;opacity:.3}
.empty-state p{font-size:.9rem}
.section-title{font-size:1.15rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.section-title i{color:var(--accent);font-size:.9rem}
.tier-legend{display:flex;gap:1rem;flex-wrap:wrap}
.tier-legend span{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--muted)}
.tier-legend .td{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.format-hint{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.6;white-space:pre;overflow-x:auto}
.format-hint b{color:var(--accent);font-weight:600}
.import-preview{max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:.75rem}
.import-preview table{margin:0}
.import-preview th{background:var(--bg2);font-size:.65rem;padding:.4rem .6rem}
.import-preview td{font-size:.78rem;padding:.4rem .6rem}
.err-row td{background:rgba(248,113,113,.06)!important}
.ok-row td{background:rgba(52,211,153,.04)!important}
.jarrison-info{background:linear-gradient(135deg,rgba(56,189,248,.06),rgba(168,85,247,.04));border:1px solid rgba(56,189,248,.15);border-radius:10px;padding:1rem 1.15rem}
.jarrison-info h4{font-size:.85rem;font-weight:600;color:var(--info);margin-bottom:.4rem}
.jarrison-info p{font-size:.78rem;color:var(--muted);line-height:1.5}
.jarrison-info code{background:var(--bg2);padding:.1rem .35rem;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--fg)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-face{width:210px;height:210px}.big-time{font-size:2.3rem}.filter-row{flex-direction:column}.filter-row .filter-group{min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div id="loading-screen" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing with server...</p></div>
</div>
<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card-glass w-full max-w-md fade-in-scale" style="border-color:color-mix(in srgb,var(--accent) 15%,var(--border))">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a);box-shadow:0 4px 20px rgba(232,168,56,.3)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div>
      <h1 class="text-2xl font-bold tracking-tight">SitePro Clock In</h1>
      <p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p>
    </div>
    <div class="flex mb-5 border-b" style="border-color:var(--border)">
      <button class="tab-btn flex-1" onclick="switchLoginTab('admin')"><i class="fas fa-shield-halved mr-1"></i> Admin</button>
      <button class="tab-btn active flex-1" onclick="switchLoginTab('employee')"><i class="fas fa-user mr-1"></i> Employee</button>
    </div>
    <div id="login-admin" class="hidden">
      <div class="mb-3"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div>
      <div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div>
      <button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button>
    </div>
    <div id="login-employee">
      <div class="mb-3"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off" style="text-transform:uppercase"></div>
      <div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4" inputmode="numeric"></div>
      <button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button>
    </div>
  </div>
</div>
<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-4 border-b" style="border-color:var(--border)">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div>
        <div class="min-w-0"><div class="font-bold text-sm truncate">SitePro</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div>
      </div>
    </div>
    <nav class="py-2 flex-1 overflow-y-auto" id="admin-nav">
      <div class="px-4 py-1.5 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Overview</div>
      <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-gauge-high w-5 text-center"></i> Dashboard</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Management</div>
      <a class="sidebar-link" data-page="sites"><i class="fas fa-location-dot w-5 text-center"></i> Sites</a>
      <a class="sidebar-link" data-page="employees"><i class="fas fa-users w-5 text-center"></i> Employees</a>
      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Data</div>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Export</a>
      <a class="sidebar-link" data-page="recyclebin"><i class="fas fa-recycle w-5 text-center"></i> Recycle Bin</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">System</div>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="p-3 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="toggleSidebar()" style="border-radius:10px"><i class="fas fa-bars"></i></button>
</div>
<div id="employee-layout" class="hidden">
  <div class="min-h-screen flex flex-col">
    <header class="p-3 flex items-center justify-between border-b" style="border-color:var(--border);background:var(--bg2)">
      <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xs" style="color:#0c0e16"></i></div><span class="font-bold text-sm">SitePro</span><span class="conn-dot on" id="emp-conn-dot"></span></div>
      <div class="flex items-center gap-2"><span id="emp-header-name" class="text-sm hidden sm:inline" style="color:var(--muted)"></span><button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i></button></div>
    </header>
    <div class="flex-1 flex">
      <nav class="w-14 sm:w-44 border-r flex flex-col pt-3 gap-1" style="border-color:var(--border);background:var(--bg2)" id="emp-nav">
        <a class="sidebar-link active" data-epage="clock" style="padding:.65rem .4rem;justify-content:center;flex-direction:column;gap:1px;font-size:.7rem"><i class="fas fa-fingerprint text-base"></i><span class="hidden sm:inline mt-0.5">Clock</span></a>
        <a class="sidebar-link" data-epage="history" style="padding:.65rem .4rem;justify-content:center;flex-direction:column;gap:1px;font-size:.7rem"><i class="fas fa-history text-base"></i><span class="hidden sm:inline mt-0.5">History</span></a>
      </nav>
      <main class="flex-1 p-4 sm:p-6 overflow-y-auto" id="emp-content"></main>
    </div>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modal-box"></div></div>

<script>
/* ===== FIREBASE CONFIG ===== */

function sites(){return D.sites||[];}function emps(){return D.employees||[];}function shifts(){return D.shifts||[];}function recs(){return D.records||[];}function sett(){return D.settings||{};}function hols(){return sett().holidays||[];}

function fmtDate(d){var dt=d instanceof Date?d:new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtTime(d){var dt=d instanceof Date?d:new Date(d);return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');}
function today(){return fmtDate(new Date());}
function haversine(a1,o1,a2,o2){var R=6371000,t=function(n){return n*Math.PI/180;},dL=t(a2-a1),dO=t(o2-o1),a=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(t(a1))*Math.cos(t(a2))*Math.sin(dO/2)*Math.sin(dO/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function fmtH(h){return(Math.round((h||0)*10)/10).toFixed(1);}
function timeAgo(ts){var s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ===== HOURS CALCULATION ===== */
function isSun(ds){return new Date(ds+'T12:00:00').getDay()===0;}
function isHol(ds){return hols().indexOf(ds)!==-1;}
function dayType(ds){if(isSun(ds))return 'Sunday';if(isHol(ds))return 'Holiday';return 'Weekday';}
function weekStart(ds){var d=new Date(ds+'T12:00:00'),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return fmtDate(d);}
function weekEnd(ws){var d=new Date(ws+'T12:00:00');d.setDate(d.getDate()+5);return fmtDate(d);}
function tierCfg(){var s=sett();return{target:s.weeklyTarget||45,otAfter:s.overtimeAfter!=null?s.overtimeAfter:(s.weeklyTarget||45)};}
function empWeekWorked(eid,curDate){var ws=weekStart(curDate),we=weekEnd(ws);return recs().filter(function(r){return r.employeeId===eid&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=we&&r.dayType!=='Sunday'&&r.dayType!=='Holiday';}).reduce(function(s,r){return s+(r.totalHours||0);},0);}
function calcHours(ci,co,bm,ww,dt,tc){
  var ms=new Date(co)-new Date(ci),min=Math.max(0,ms/60000-bm),th=Math.round(min/6)/10;
  if(dt==='Sunday'||dt==='Holiday')return{regularHours:0,overtimeHours:0,doubleTimeHours:th,totalHours:th};
  var st=ww,en=ww+th,reg=0,ot=0;
  if(st<tc.otAfter)reg+=Math.min(en,tc.otAfter)-st;
  if(en>tc.otAfter)ot+=en-Math.max(st,tc.otAfter);
  return{regularHours:reg,overtimeHours:ot,doubleTimeHours:0,totalHours:th};
}
function mondaysInMonth(y,m){var c=0,d=new Date(y,m,1),dw=d.getDay(),toM=dw===0?1:(dw===1?0:8-dw);d.setDate(d.getDate()+toM);while(d.getMonth()===m&&d.getFullYear()===y){c++;d.setDate(d.getDate()+7);}return c;}
function empMonthHours(eid,y,m){
  var tc=tierCfg(),mi=mondaysInMonth(y,m),mt=tc.target*mi,ms=y+'-'+String(m+1).padStart(2,'0');
  var rs=recs().filter(function(r){return r.employeeId===eid&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,7)===ms;});
  var t={regular:0,overtime:0,doubleTime:0,total:0,count:rs.length};
  rs.forEach(function(r){t.regular+=(r.regularHours||0);t.overtime+=(r.overtimeHours||0);t.doubleTime+=(r.doubleTimeHours||0);t.total+=(r.totalHours||0);});
  t.target=mt;t.mondays=mi;t.overTarget=Math.max(0,t.total-mt);t.effective=t.regular+t.overtime*1.5+t.doubleTime*2;return t;
}

function cleanBin(){var bin=D.recycleBin,now=Date.now();['sites','employees','shifts','records'].forEach(function(t){if(!bin[t])return;Object.keys(bin[t]).forEach(function(bid){var it=bin[t][bid];if(it.at&&(now-new Date(it.at).getTime())>BIN_TTL)fbRm('recycleBin/'+t+'/'+bid);});});}

  h+='<div class="stat-card '+(bc?'sc-red':'sc-amber')+'"><div class="text-xs font-semibold mb-1" style="color:var(--muted)"><i class="fas fa-recycle mr-1"></i>BIN</div><div class="text-2xl font-bold" style="color:'+(bc?'var(--danger)':'var(--fg)')+'">'+bc+'</div></div></div>';
  h+='<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">';
  h+='<div class="card lg:col-span-2"><div class="flex items-center justify-between mb-3"><h3 class="text-sm font-semibold"><i class="fas fa-chart-bar mr-2" style="color:var(--accent)"></i>Weekly Hours by Employee</h3><span class="text-xs" style="color:var(--muted)">Mon-Fri current week</span></div><canvas id="chart-weekly" class="chart-canvas" height="180"></canvas></div>';

  var ws=weekStart(today()),we=weekEnd(ws),tc=tierCfg(),activeEmps=emps().filter(function(e){return e.active;});
  var chartData=activeEmps.map(function(e){
    var ers=recs().filter(function(r){return r.employeeId===e.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=we;});
    var reg=0,ot=0,dt=0;ers.forEach(function(r){reg+=(r.regularHours||0);ot+=(r.overtimeHours||0);dt+=(r.doubleTimeHours||0);});
    return{label:e.firstName+' '+e.lastName.charAt(0)+'.',reg:reg,ot:ot,dt:dt,total:reg+ot+dt};
  });
  drawBarChart(document.getElementById('chart-weekly'),chartData,tc);
  var totalReg=0,totalOt=0,totalDt=0;chartData.forEach(function(d){totalReg+=d.reg;totalOt+=d.ot;totalDt+=d.dt;});
  drawDonut(document.getElementById('chart-donut'),[{v:totalReg,c:'#34d399'},{v:totalOt,c:'#fbbf24'},{v:totalDt,c:'#f87171'}]);
}
function drawBarChart(canvas,data,tc){
  if(!canvas)return;var ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height,pad={t:10,r:10,b:30,l:10},maxVal=Math.max(tc.otAfter*1.2,1);
  var cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,n=data.length;
  if(!n){ctx.fillStyle='#6a7199';ctx.font='13px Space Grotesk';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);return;}
  var gap=Math.max(4,Math.min(12,cw/n*0.3)),bw=Math.max(8,(cw-gap*(n+1))/n);
  var ty=pad.t+ch*(1-tc.otAfter/maxVal);ctx.strokeStyle='rgba(232,168,56,.3)';ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,ty);ctx.lineTo(W-pad.r,ty);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(232,168,56,.5)';ctx.font='10px JetBrains Mono';ctx.textAlign='left';ctx.fillText(fmtH(tc.otAfter)+'h',pad.l+2,ty-4);
  data.forEach(function(d,i){
    var x=pad.l+gap+(bw+gap)*i,rh=Math.max(0,(d.reg/maxVal)*ch),ry=pad.t+ch-rh;
    ctx.fillStyle='#34d399';roundRect(ctx,x,ry,bw*.6,rh,3);
    var oh=Math.max(0,(d.ot/maxVal)*ch),oy=ry-oh;ctx.fillStyle='#fbbf24';roundRect(ctx,x+bw*.6,oy,bw*.4,oh,3);
    if(d.dt>0){ctx.fillStyle='#f87171';ctx.beginPath();ctx.arc(x+bw/2,oy-6,3,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#6a7199';ctx.font='10px Space Grotesk';ctx.textAlign='center';
    var lbl=d.label.length>8?d.label.slice(0,7)+'..':d.label;ctx.fillText(lbl,x+bw/2,H-pad.b+14);

  });

function drawDonut(canvas,segments){
  if(!canvas)return;var ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height,cx=W/2,cy=H/2-5,r=Math.min(W,H)/2-20,ir=r*.6;
  var total=segments.reduce(function(s,seg){return s+seg.v;},0);
  if(total===0){ctx.strokeStyle='#252d42';ctx.lineWidth=r-ir;ctx.beginPath();ctx.arc(cx,cy,(r+ir)/2,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#6a7199';ctx.font='13px Space Grotesk';ctx.textAlign='center';ctx.fillText('No data',cx,cy+4);return;}
  var angle=-Math.PI/2;
  segments.forEach(function(seg){if(seg.v<=0)return;var sweep=(seg.v/total)*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,angle,angle+sweep);ctx.arc(cx,cy,ir,angle+sweep,angle,true);ctx.closePath();ctx.fillStyle=seg.c;ctx.fill();angle+=sweep;});
  ctx.fillStyle='#e4e6ec';ctx.font='700 18px JetBrains Mono';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fmtH(total),cx,cy-4);
  ctx.fillStyle='#6a7199';ctx.font='11px Space Grotesk';ctx.fillText('total hrs',cx,cy+14);ctx.textBaseline='alphabetic';
}
function roundRect(ctx,x,y,w,h,r){if(h<=0)return;r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();}

function parseBulkEmps(){
  var raw=document.getElementById('mbe-data').value.trim();
  if(!raw){toast('Paste CSV data first','error');return;}
  var defaultSite=document.getElementById('mbe-site').value;
  var lines=raw.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
  if(!lines.length){toast('No data found','error');return;}
  /* Detect header */
  var startIdx=0,firstLine=lines[0].toLowerCase();
  if(firstLine.indexOf('first')!==-1||firstLine.indexOf('name')!==-1||firstLine.indexOf('employee')!==-1||firstLine.indexOf('id')!==-1)startIdx=1;
  var existing=emps(),existingIds=existing.map(function(e){return e.employeeId;});
  var siteMap={};sites().forEach(function(s){siteMap[s.name.toLowerCase().trim()]=s.id;});
  var parsed=[],errors=[];
  for(var i=startIdx;i<lines.length;i++){
    var cols=lines[i].split(',').map(function(c){return c.trim().replace(/^["']|["']$/g,'');});
    if(cols.length<3){errors.push({row:i+1,msg:'Not enough columns ('+cols.length+' found, need at least 3)',data:lines[i]});continue;}
    var fn=cols[0]||'',ln=cols[1]||'',eid=(cols[2]||'').toUpperCase(),pin=cols[3]||'',siteNameRaw=cols[4]||'';
    var siteId=defaultSite;
    if(siteNameRaw){var mapped=siteMap[siteNameRaw.toLowerCase().trim()];if(mapped)siteId=mapped;else errors.push({row:i+1,msg:'Site "'+siteNameRaw+'" not found — using default',data:lines[i]});}
    var rowErrs=[];
    if(!fn)rowErrs.push('Missing first name');
    if(!ln)rowErrs.push('Missing last name');
    if(!eid)rowErrs.push('Missing employee ID');
    else if(existingIds.indexOf(eid)!==-1)rowErrs.push('ID '+eid+' already exists (will skip)');
    if(!/^\d{4}$/.test(pin))rowErrs.push('PIN must be 4 digits (got "'+pin+'")');
    parsed.push({row:i+1,firstName:fn,lastName:ln,employeeId:eid,pin:pin,siteId:siteId,siteName:siteNameRaw||siteName(siteId),errors:rowErrs,skip:existingIds.indexOf(eid)!==-1});
  }
  S.pendingImport=parsed.filter(function(p){return !p.skip&&p.errors.length===0;});
  var validCount=parsed.filter(function(p){return !p.skip&&p.errors.length===0;}).length;
  var skipCount=parsed.filter(function(p){return p.skip;}).length;
  var errCount=parsed.filter(function(p){return p.errors.length>0&&!p.skip;}).length;
  var html='<div class="mt-4 p-3 rounded-lg" style="background:var(--bg2);border:1px solid var(--border)">';
  html+='<div class="flex items-center gap-3 mb-3 flex-wrap"><span class="badge badge-green"><i class="fas fa-check mr-1"></i>'+validCount+' valid</span>';
  if(skipCount)html+='<span class="badge badge-amber"><i class="fas fa-forward mr-1"></i>'+skipCount+' skipped (duplicate)</span>';
  if(errCount)html+='<span class="badge badge-red"><i class="fas fa-exclamation-triangle mr-1"></i>'+errCount+' with errors</span>';
  html+='</div>';
  if(parsed.length){
    html+='<div class="import-preview"><table><thead><tr><th>#</th><th>Name</th><th>ID</th><th>PIN</th><th>Site</th><th>Status</th></tr></thead><tbody>';
    parsed.forEach(function(p){
      var cls=p.skip?'err-row':(p.errors.length?'err-row':'ok-row');
      var status=p.skip?'<span class="badge badge-amber">Skip</span>':(p.errors.length?'<span class="badge badge-red">'+p.errors.join(', ')+'</span>':'<span class="badge badge-green">OK</span>');
      html+='<tr class="'+cls+'"><td class="mono text-xs">'+p.row+'</td><td class="text-sm">'+escHtml(p.firstName+' '+p.lastName)+'</td><td class="mono text-xs">'+escHtml(p.employeeId)+'</td><td class="mono text-xs">'+(p.pin?'****':'—')+'</td><td class="text-xs" style="color:var(--muted)">'+escHtml(p.siteName)+'</td><td class="text-xs">'+status+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  if(validCount>0)html+='<div class="flex gap-3 mt-3"><button class="btn btn-primary flex-1 justify-center" onclick="confirmBulkImport()"><i class="fas fa-file-import"></i> Import '+validCount+' Employee'+(validCount>1?'s':'')+'</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>';
  document.getElementById('mbe-preview').innerHTML=html;
}

function recRows(){
  var rc=recs().slice().sort(function(a,b){return new Date(b.clockIn||0)-new Date(a.clockIn||0);});
  var q=(S.searchTerms.records||'').toLowerCase();
  if(q)rc=rc.filter(function(r){return(empFullName(r.employeeId)+siteName(r.siteId)+(r.clockIn||'')).toLowerCase().indexOf(q)!==-1;});
  if(S.recFilterDate)rc=rc.filter(function(r){return(r.clockIn||'').slice(0,10)===S.recFilterDate;});
  if(S.recFilterStatus)rc=rc.filter(function(r){return r.status===S.recFilterStatus;});

function getFilteredExport(){
  var from=document.getElementById('exp-from').value,to=document.getElementById('exp-to').value,eid=document.getElementById('exp-emp').value,sid=document.getElementById('exp-site').value;
  var rc=recs().filter(function(r){return r.status==='completed';}).sort(function(a,b){return new Date(a.clockIn)-new Date(b.clockIn);});

  if(to)rc=rc.filter(function(r){return(r.clockIn||'').slice(0,10)<=to;});
  if(eid)rc=rc.filter(function(r){return r.employeeId===eid;});

/* CSV Download */
function doExportCSV(){
  var rc=getFilteredExport();if(!rc.length){toast('No records to export','error');return;}
  var csv='Employee,Employee ID,Site,Date,Clock In,Clock Out,Total Hours,Regular Hours,OT Hours,Double Time Hours,Day Type\n';
  rc.forEach(function(r){var e=empById(r.employeeId);csv+='"'+(e?e.firstName+' '+e.lastName:'Unknown')+'","'+(e?e.employeeId:'')+'","'+siteName(r.siteId)+'","'+(r.clockIn||'').slice(0,10)+'","'+(r.clockIn||'').slice(11,16)+'","'+(r.clockOut||'').slice(11,16)+'","'+fmtH(r.totalHours)+'","'+fmtH(r.regularHours)+'","'+fmtH(r.overtimeHours)+'","'+fmtH(r.doubleTimeHours)+'","'+(r.dayType||'')+'"\n';});
  downloadFile(csv,'sitepro-export-'+today()+'.csv','text/csv');

/* Jarrison .DAT Download */
function doExportJarrison(){
  var rc=getFilteredExport();if(!rc.length){toast('No records to export','error');return;}
  /* Pipe-delimited, no header row (Jarrison typically expects data only) */
  var lines=[];
  rc.forEach(function(r){
    var e=empById(r.employeeId),ci=r.clockIn,co=r.clockOut;
    /* EMPNO|DATE|INTIME|OUTTIME|REGHRS|OTHRS|DTHRS|TOTALHRS|DAYTYPE */
    var empNo=e?e.employeeId:'';
    var dateStr=ci?ci.slice(0,10).replace(/-/g,''):'';
    var inTime=ci?ci.slice(11,16).replace(':',''):'';
    var outTime=co?co.slice(11,16).replace(':',''):'';
    var regHrs=fmtH(r.regularHours||0);
    var otHrs=fmtH(r.overtimeHours||0);
    var dtHrs=fmtH(r.doubleTimeHours||0);
    var totalHrs=fmtH(r.totalHours||0);
    var dayTp=r.dayType||'WEEKDAY';
    lines.push(empNo+'|'+dateStr+'|'+inTime+'|'+outTime+'|'+regHrs+'|'+otHrs+'|'+dtHrs+'|'+totalHrs+'|'+dayTp);
  });
  var dat=lines.join('\n')+'\n';
  downloadFile(dat,'sitepro-jarrison-'+today()+'.dat','application/octet-stream');
  toast('.DAT downloaded ('+rc.length+' records)','success');
}

/* Generic file download helper */
function downloadFile(content,filename,mimeType){
  var blob=new Blob([content],{type:mimeType}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

      h+='<tr><td class="font-medium text-sm">'+escHtml(name)+'</td><td class="text-xs" style="color:var(--muted)">'+timeAgo(item.at)+'</td><td class="text-xs" style="color:'+ec+'">'+dl+'d left</td><td><div class="flex gap-2"><button class="btn btn-success btn-sm" onclick="fromBin(\''+t.k+'\',\''+bid+'\')"><i class="fas fa-rotate-left"></i> Restore</button><button class="btn btn-danger btn-sm" onclick="permDelBin(\''+t.k+'\',\''+bid+'\')"><i class="fas fa-trash"></i></button></div></td></tr>';
    });h+='</tbody></table></div></div>';});
  if(!hasAny)h+='<div class="empty-state card"><i class="fas fa-recycle block"></i><p>Recycle bin is empty</p></div>';
  return h+'</div>';
}

/* ===== SETTINGS ===== */
function renderSettings(){
  var s=sett(),holsList=hols();
  var h='<div class="fade-in"><h2 class="text-xl font-bold tracking-tight mb-1">Settings</h2><p class="text-sm mb-5" style="color:var(--muted)">Configure time tracking rules and system preferences</p>';
  h+='<div class="card mb-4"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-clock mr-2" style="color:var(--accent)"></i>Hours Configuration</h3><div class="grid gap-3 sm:grid-cols-3"><div><label>Weekly Target (hours)</label><input id="set-target" type="number" step="1" value="'+(s.weeklyTarget||45)+'"></div><div><label>Overtime After (hours)</label><input id="set-ot" type="number" step="1" value="'+(s.overtimeAfter!=null?s.overtimeAfter:45)+'"></div><div><label>Default Break (minutes)</label><input id="set-break" type="number" value="'+(s.defaultBreak||30)+'"></div></div><p class="text-xs mt-2" style="color:var(--muted)">Weekly target × Mondays in month = monthly target. Overtime kicks in after the threshold within a Mon–Fri week. Sundays and public holidays are always double time.</p><button class="btn btn-primary mt-3" onclick="saveHoursSettings()"><i class="fas fa-save"></i> Save Hours Settings</button></div>';
  h+='<div class="card mb-4"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-shield-halved mr-2" style="color:var(--danger)"></i>Admin Credentials</h3><div class="grid gap-3 sm:grid-cols-2"><div><label>Username</label><input id="set-user" value="'+escHtml(D.admin.username||'')+'"></div><div><label>New Password</label><input id="set-pass" type="password" placeholder="Leave blank to keep current"></div></div><button class="btn btn-secondary mt-3" onclick="saveAdminCreds()"><i class="fas fa-save"></i> Update Credentials</button></div>';
  h+='<div class="card mb-4"><h3 class="text-sm font-semibold mb-1"><i class="fas fa-calendar-xmark mr-2" style="color:var(--purple)"></i>Public Holidays <span class="badge badge-purple">'+holsList.length+'</span></h3><p class="text-xs mb-3" style="color:var(--muted)">Holiday dates are always paid at double time rate</p><div class="flex gap-2 mb-3"><input id="set-hol" type="date" class="sm:max-w-xs"><button class="btn btn-secondary btn-sm" onclick="addHoliday()"><i class="fas fa-plus"></i> Add</button></div><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2" id="hol-grid">';
  holsList.sort().forEach(function(d){var dt=new Date(d+'T12:00:00');h+='<div class="flex items-center justify-between p-2 rounded-lg" style="background:var(--bg2);border:1px solid var(--border)"><span class="text-xs">'+dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</span><button class="btn btn-danger btn-icon" style="width:22px;height:22px;min-width:22px" onclick="removeHoliday(\''+d+'\')"><i class="fas fa-times" style="font-size:.55rem"></i></button></div>';});
  h+='</div></div>';
  h+='<div class="card" style="border-color:rgba(248,113,113,.2)"><h3 class="text-sm font-semibold mb-3" style="color:var(--danger)"><i class="fas fa-triangle-exclamation mr-2"></i>Danger Zone</h3><p class="text-xs mb-3" style="color:var(--muted)">These actions cannot be undone.</p><div class="flex gap-3 flex-wrap"><button class="btn btn-danger btn-sm" onclick="clearAllRecords()"><i class="fas fa-eraser"></i> Clear All Records</button><button class="btn btn-danger btn-sm" onclick="resetAllData()"><i class="fas fa-bomb"></i> Reset Everything</button></div></div>';
  return h+'</div>';
}
function saveHoursSettings(){var t=parseFloat(document.getElementById('set-target').value),o=parseFloat(document.getElementById('set-ot').value),b=parseInt(document.getElementById('set-break').value);if(isNaN(t)||isNaN(o)||isNaN(b)){toast('Invalid values','error');return;}fbUpd('settings',{weeklyTarget:t,overtimeAfter:o,defaultBreak:b});toast('Hours settings saved','success');}
function saveAdminCreds(){var u=document.getElementById('set-user').value.trim(),p=document.getElementById('set-pass').value;if(!u){toast('Username required','error');return;}var obj={username:u};if(p)obj.password=p;fbUpd('admin',obj);toast('Credentials updated','success');document.getElementById('set-pass').value='';}
function addHoliday(){var d=document.getElementById('set-hol').value;if(!d){toast('Select a date','error');return;}var h=hols();if(h.indexOf(d)!==-1){toast('Date already exists','error');return;}h.push(d);h.sort();fbUpd('settings',{holidays:h});toast('Holiday added','success');nav('settings');}
function removeHoliday(d){var h=hols().filter(function(x){return x!==d;});fbUpd('settings',{holidays:h});nav('settings');toast('Holiday removed','info');}
function clearAllRecords(){openModal('<h3 class="font-bold text-lg mb-3">Clear All Clock Records?</h3><p class="text-sm mb-4" style="color:var(--muted)">This will permanently delete all clock-in/out records.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="fbSet(\'records\',[]);closeModal();toast(\'All records cleared\',\'success\')"><i class="fas fa-eraser"></i> Clear Records</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');}
function resetAllData(){openModal('<h3 class="font-bold text-lg mb-3" style="color:var(--danger)">Reset Everything?</h3><p class="text-sm mb-4" style="color:var(--muted)">This will delete ALL data and re-seed with defaults. Cannot be undone.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="doReset()"><i class="fas fa-bomb"></i> Reset Everything</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');}
function doReset(){['sites','employees','shifts','records','settings','admin','recycleBin'].forEach(function(p){fbRm(p);});setTimeout(function(){seedData();closeModal();toast('All data reset to defaults','success');nav('dashboard');},500);}

/* ===== EMPLOYEE CLOCK PAGE ===== */
function renderClockPage(){
  var e=S.emp,site=sites().find(function(s){return s.id===e.siteId;});
  var isCI=S.clockState==='clocked_in',faceClass=isCI?'co':'ci',iconClass=isCI?'fa-arrow-right-from-bracket':'fa-fingerprint',label=isCI?'CLOCK OUT':'CLOCK IN',sub=isCI?'Tap to end shift':'Tap to start shift';
  var ws=weekStart(today()),we=weekEnd(ws),tc=tierCfg();
  var weekRecs=recs().filter(function(r){return r.employeeId===e.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=we;});
  var wReg=0,wOt=0,wDt=0;weekRecs.forEach(function(r){wReg+=(r.regularHours||0);wOt+=(r.overtimeHours||0);wDt+=(r.doubleTimeHours||0);});
  var wTotal=wReg+wOt+wDt,wPct=Math.min(100,Math.round((wTotal/tc.target)*100));
  if(isCI&&S.activeRec){var liveHrs=(Date.now()-new Date(S.activeRec.clockIn).getTime())/3600000;wTotal+=liveHrs;wPct=Math.min(100,Math.round((wTotal/tc.target)*100));}
  var h='<div class="fade-in"><div class="emp-hero mb-5"><div class="emp-avatar">'+e.firstName.charAt(0)+e.lastName.charAt(0)+'</div><div class="text-lg font-bold">'+escHtml(e.firstName+' '+e.lastName)+'</div><div class="text-xs" style="color:var(--muted)">'+escHtml(e.employeeId)+' · '+escHtml(site?site.name:'Unknown site')+'</div><div class="mono text-3xl font-bold mt-3" id="emp-live-clock">'+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</div><div class="text-xs" style="color:var(--muted)">'+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div>';
  h+='<div class="flex justify-center mb-5"><div class="clock-face '+faceClass+'" onclick="handleClock()"><div class="clock-ring"></div><div class="cf-icon"><i class="fas '+iconClass+'"></i></div><div class="cf-label">'+label+'</div><div class="cf-sub">'+sub+'</div></div></div>';
  h+='<div class="text-center mb-5"><div id="gps-status" class="text-xs flex items-center justify-center gap-1.5" style="color:var(--muted)"><span class="conn-dot loading"></span> Checking location...</div></div>';
  if(isCI){h+='<div class="text-center mb-5"><div class="text-xs" style="color:var(--muted)">Current shift duration</div><div class="mono text-2xl font-bold mt-1" style="color:var(--danger)" id="live-elapsed">0h 0m</div><div class="text-xs mt-1" style="color:var(--muted)">Since '+fmtTime(new Date(S.activeRec.clockIn))+'</div></div>';}
  h+='<div class="card mb-4"><div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold"><i class="fas fa-chart-simple mr-2" style="color:var(--accent)"></i>This Week</h3><span class="mono text-sm font-bold" style="color:var(--accent)" id="week-total">'+fmtH(wTotal)+'h</span></div><div class="progress-track mb-2"><div class="progress-fill" style="width:'+wPct+'%;background:linear-gradient(90deg,var(--success),var(--accent))"></div></div><div class="flex justify-between text-xs" style="color:var(--muted)"><span>0h</span><span>Target: '+tc.target+'h ('+wPct+'%)</span></div><div class="tier-legend mt-3"><span><span class="td" style="background:var(--success)"></span>Regular: '+fmtH(wReg)+'h</span><span><span class="td" style="background:var(--warning)"></span>OT: '+fmtH(wOt)+'h</span><span><span class="td" style="background:var(--danger)"></span>Double: '+fmtH(wDt)+'h</span></div></div>';
  var recent=recs().filter(function(r){return r.employeeId===e.id;}).sort(function(a,b){return new Date(b.clockIn||0)-new Date(a.clockIn||0);}).slice(0,5);
  if(recent.length){h+='<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-history mr-2" style="color:var(--info)"></i>Recent Activity</h3>';recent.forEach(function(r){var dt=r.dayType||dayType((r.clockIn||'').slice(0,10));h+='<div class="flex items-center justify-between py-1.5 border-b" style="border-color:var(--border)"><div><div class="text-xs font-medium">'+(r.clockIn||'').slice(0,10)+' '+dayBadge(dt)+'</div><div class="text-xs" style="color:var(--muted)">'+(r.clockIn||'').slice(11,16)+(r.clockOut?' – '+(r.clockOut||'').slice(11,16):'')+'</div></div><div class="text-right"><div class="mono text-xs font-semibold">'+(r.status==='completed'?fmtH(r.totalHours)+'h':'<span style="color:var(--success)">Active</span>')+'</div></div></div>';});h+='</div>';}
  return h+'</div>';
}
function initClockPage(){
  clearInterval(S.clockInt);clearInterval(S.timerInt);
  (function tick(){var el=document.getElementById('emp-live-clock');if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});else{clearInterval(S.clockInt);return;}S.clockInt=setInterval(tick,1000);})();
  if(S.clockState==='clocked_in'&&S.activeRec){(function tickEl(){var el=document.getElementById('live-elapsed');if(!el){clearInterval(S.timerInt);return;}var ms=Date.now()-new Date(S.activeRec.clockIn).getTime(),m=Math.floor(ms/60000),h=Math.floor(m/60);el.textContent=h+'h '+String(m%60).padStart(2,'0')+'m';S.timerInt=setInterval(tickEl,1000);})();}
  checkGps();
}
function checkGps(){
  if(!navigator.geolocation){setGpsStatus('unsupported','GPS not supported');return;}
  setGpsStatus('checking','Checking location...');
  navigator.geolocation.getCurrentPosition(function(p){
    S.gpsLat=p.coords.latitude;S.gpsLng=p.coords.longitude;
    var site=sites().find(function(s){return s.id===S.emp.siteId;});
    if(site){S.gpsDist=haversine(p.coords.latitude,p.coords.longitude,site.lat,site.lng);if(S.gpsDist<=site.radius)setGpsStatus('ok','At '+site.name+' ('+Math.round(S.gpsDist)+'m)');else setGpsStatus('warn','Outside '+site.name+' ('+Math.round(S.gpsDist)+'m from '+site.radius+'m radius)');}
    else setGpsStatus('ok','Location acquired ('+p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4)+')');
  },function(e){setGpsStatus('error','GPS error: '+e.message);},{enableHighAccuracy:true,timeout:10000});
}
function setGpsStatus(status,msg){var el=document.getElementById('gps-status');if(!el)return;var dotCls=status==='ok'?'conn-dot on':status==='warn'?'conn-dot loading':status==='error'?'conn-dot off':'conn-dot loading',clr=status==='ok'?'var(--success)':status==='warn'?'var(--warning)':status==='error'?'var(--danger)':'var(--muted)';el.innerHTML='<span class="'+dotCls+'"></span> <span style="color:'+clr+'">'+msg+'</span>';}
function handleClock(){if(S.clockState==='idle')doClockIn();else doClockOut();}
function doClockIn(){
  var site=sites().find(function(s){return s.id===S.emp.siteId;});
  if(site&&S.gpsDist!=null&&S.gpsDist>site.radius){openModal('<h3 class="font-bold text-lg mb-3">Outside GPS Zone</h3><p class="text-sm mb-1" style="color:var(--muted)">You are <strong style="color:var(--danger)">'+Math.round(S.gpsDist)+'m</strong> away from <strong>'+escHtml(site.name)+'</strong> (radius: '+site.radius+'m).</p><p class="text-sm mb-4" style="color:var(--muted)">Clock in anyway?</p><div class="flex gap-3"><button class="btn btn-primary flex-1 justify-center" onclick="closeModal();confirmClockIn()">Clock In Anyway</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');return;}
  confirmClockIn();
}
function confirmClockIn(){
  var now=new Date().toISOString(),id=db.ref('records').push().key;
  var todayShift=shifts().find(function(s){return s.employeeId===S.emp.id&&s.date===today();});
  var rec={id:id,employeeId:S.emp.id,siteId:S.emp.siteId,shiftId:todayShift?todayShift.id:null,clockIn:now,status:'clocked_in',dayType:dayType(today()),gpsLat:S.gpsLat,gpsLng:S.gpsLng,gpsDistance:S.gpsDist};
  fbSet('records/'+id,rec);S.clockState='clocked_in';S.activeRec=rec;navEmp('clock');toast('Clocked in successfully','success');
}
function doClockOut(){
  if(!S.activeRec)return;
  var now=new Date().toISOString(),ci=S.activeRec.clockIn,dt=S.activeRec.dayType||dayType(today());
  var bm=0;var sh=S.activeRec.shiftId?shifts().find(function(s){return s.id===S.activeRec.shiftId;}):null;if(sh)bm=sh.breakMinutes||0;
  var ww=empWeekWorked(S.emp.id,ci.slice(0,10)),tc=tierCfg();
  var hrs=calcHours(ci,now,bm,ww,dt,tc);
  var upd={clockOut:now,status:'completed',totalHours:hrs.totalHours,regularHours:hrs.regularHours,overtimeHours:hrs.overtimeHours,doubleTimeHours:hrs.doubleTimeHours,breakMinutes:bm,dayType:dt};
  fbUpd('records/'+S.activeRec.id,upd);S.clockState='idle';S.activeRec=null;navEmp('clock');toast('Clocked out — '+fmtH(hrs.totalHours)+'h recorded','success');
}

/* ===== EMPLOYEE HISTORY ===== */
function renderEmpHistory(){
  var e=S.emp,now=new Date(),y=now.getFullYear(),m=now.getMonth();
  var mh=empMonthHours(e.id,y,m);
  var h='<div class="fade-in"><div class="flex items-center justify-between mb-5 flex-wrap gap-3"><div><h2 class="text-xl font-bold tracking-tight">My History</h2><p class="text-sm" style="color:var(--muted)">'+now.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</p></div></div>';
  h+='<div class="card mb-4"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-chart-bar mr-2" style="color:var(--accent)"></i>Monthly Summary</h3><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3"><div><div class="text-xs" style="color:var(--muted)">Total Hours</div><div class="mono text-lg font-bold">'+fmtH(mh.total)+'</div></div><div><div class="text-xs" style="color:var(--muted)">Target</div><div class="mono text-lg font-bold" style="color:var(--muted)">'+mh.target+'h</div></div><div><div class="text-xs" style="color:var(--muted)">Over Target</div><div class="mono text-lg font-bold" style="color:'+(mh.overTarget>0?'var(--warning)':'var(--muted)')+'">'+fmtH(mh.overTarget)+'h</div></div><div><div class="text-xs" style="color:var(--muted)">Records</div><div class="mono text-lg font-bold">'+mh.count+'</div></div></div>';
  h+='<div class="tier-legend mb-2"><span><span class="td" style="background:var(--success)"></span>Regular: '+fmtH(mh.regular)+'h</span><span><span class="td" style="background:var(--warning)"></span>OT: '+fmtH(mh.overtime)+'h</span><span><span class="td" style="background:var(--danger)"></span>Double: '+fmtH(mh.doubleTime)+'h</span></div>';
  var pct=Math.min(100,Math.round((mh.total/Math.max(1,mh.target))*100));h+='<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--success),'+(pct>=100?'var(--warning)':'var(--accent)')+')"></div></div><div class="text-xs mt-1" style="color:var(--muted)">'+pct+'% of monthly target</div></div>';
  var monthStr=y+'-'+String(m+1).padStart(2,'0');
  var myRecs=recs().filter(function(r){return r.employeeId===e.id&&r.clockIn&&r.clockIn.slice(0,7)===monthStr;}).sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);});
  h+='<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-list mr-2" style="color:var(--info)"></i>All Records This Month</h3>';
  if(myRecs.length){h+='<div class="overflow-x-auto"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Breakdown</th><th>Type</th></tr></thead><tbody>';
  myRecs.forEach(function(r){var dt=r.dayType||dayType(r.clockIn.slice(0,10)),hrs=r.status==='completed'?fmtH(r.totalHours):'—';var parts=[];if(r.regularHours>0)parts.push('<span style="color:var(--success)">'+fmtH(r.regularHours)+'</span>');if(r.overtimeHours>0)parts.push('<span style="color:var(--warning)">'+fmtH(r.overtimeHours)+'</span>');if(r.doubleTimeHours>0)parts.push('<span style="color:var(--danger)">'+fmtH(r.doubleTimeHours)+'</span>');h+='<tr><td class="text-sm">'+r.clockIn.slice(0,10)+'</td><td class="mono text-xs">'+r.clockIn.slice(11,16)+'</td><td class="mono text-xs">'+(r.clockOut?r.clockOut.slice(11,16):'—')+'</td><td class="mono text-xs font-semibold">'+hrs+'</td><td class="text-xs">'+(parts.join(', ')||'—')+'</td><td>'+dayBadge(dt)+'</td></tr>';});
  h+='</tbody></table></div>';}else h+='<div class="empty-state"><i class="fas fa-calendar-xmark block"></i><p>No records this month</p></div>';
  return h+'</div></div>';
}

document.getElementById('admin-pass').addEventListener('keydown',function(e){if(e.key==='Enter')adminLogin();});
document.getElementById('emp-pin').addEventListener('keydown',function(e){if(e.key==='Enter')employeeLogin();});
