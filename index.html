function previewBulkShifts() {
  var empCbs = document.querySelectorAll('.bulk-emp-cb:checked');
  var empIds = [];
  for (var i = 0; i < empCbs.length; i++) { empIds.push(empCbs[i].value); }
  if (!empIds.length) { toast('Select at least one employee','error'); return; }
  var fromDate = document.getElementById('m-bulk-shift-from').value;
  var toDate = document.getElementById('m-bulk-shift-to').value;
  if (!fromDate || !toDate) { toast('Set date range','error'); return; }
  var dowCbs = document.querySelectorAll('.bulk-dow-cb:checked');
  var dows = [];
  for (var i = 0; i < dowCbs.length; i++) { dows.push(parseInt(dowCbs[i].value)); }
  if (!dows.length) { toast('Select at least one day','error'); return; }
  var dates = [], d = new Date(fromDate + 'T12:00:00'), end = new Date(toDate + 'T12:00:00');
  while (d <= end) { if (dows.indexOf(d.getDay()) !== -1) dates.push(fmtDate(d)); d.setDate(d.getDate() + 1); }
  var total = empIds.length * dates.length;
  var h = '<div class="p-3 rounded-lg" style="background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3)">';
  h += '<div class="text-xs font-semibold mb-1" style="color:var(--success)">' + total + ' shift(s) will be created</div>';
  h += '<div class="text-xs" style="color:var(--muted)">' + empIds.length + ' employee(s) &times; ' + dates.length + ' day(s)</div>';
  if (dates.length) h += '<div class="text-xs mt-1" style="color:var(--muted)">' + dates[0] + ' to ' + dates[dates.length-1] + '</div>';
  h += '</div>';
  document.getElementById('m-bulk-shift-preview').innerHTML = h;
  var btn = document.getElementById('m-bulk-shift-save');
  btn.disabled = false;
  btn.setAttribute('data-count', total);
}
function saveBulkShifts() {
  var btn = document.getElementById('m-bulk-shift-save');
  if (btn.disabled) return;
  var empCbs = document.querySelectorAll('.bulk-emp-cb:checked');
  var empIds = [];
  for (var i = 0; i < empCbs.length; i++) { empIds.push(empCbs[i].value); }
  var fromDate = document.getElementById('m-bulk-shift-from').value;
  var toDate = document.getElementById('m-bulk-shift-to').value;
  var dowCbs = document.querySelectorAll('.bulk-dow-cb:checked');
  var dows = [];
  for (var i = 0; i < dowCbs.length; i++) { dows.push(parseInt(dowCbs[i].value)); }
  var dates = [], d = new Date(fromDate + 'T12:00:00'), end = new Date(toDate + 'T12:00:00');
  while (d <= end) { if (dows.indexOf(d.getDay()) !== -1) dates.push(fmtDate(d)); d.setDate(d.getDate() + 1); }
  var siteId = document.getElementById('m-bulk-shift-site').value;
  var startTime = document.getElementById('m-bulk-shift-start').value;
  var endTime = document.getElementById('m-bulk-shift-end').value;
  var breakMinutes = parseInt(document.getElementById('m-bulk-shift-break').value) || 0;
  var targetHours = parseFloat(document.getElementById('m-bulk-shift-target').value) || '';
  var count = 0;
  for (var e = 0; e < empIds.length; e++) {
    for (var dd = 0; dd < dates.length; dd++) {
      var id = db.ref('shifts').push().key;
      fbSet('shifts/' + id, { id:id, employeeId:empIds[e], siteId:siteId, date:dates[dd], startTime:startTime, endTime:endTime, breakMinutes:breakMinutes, targetHours:targetHours });
      count++;
    }
  }
  closeModal(); navigateAdmin('shifts'); toast(count + ' shift(s) created','success');
}

/* ============================================
   APPROVALS
   ============================================ */
function renderApprovals() {
  var allRecs = getRecords();
  var pending = [], rejected = [], approved = [];
  for (var i = 0; i < allRecs.length; i++) {
    var r = allRecs[i];
    if (!r.needsApproval || r.status !== 'completed') continue;
    if (!r.approved && !r.rejected) pending.push(r);
    else if (r.rejected) rejected.push(r);
    else if (r.approved) approved.push(r);
  }
  var h = '<div class="fade-in"><div class="mb-6"><h2 class="text-xl font-bold">Approvals</h2><p class="text-sm" style="color:var(--muted)">Records outside working hours require approval</p></div>';

  h += '<div class="mb-6"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fas fa-clock" style="color:var(--warning)"></i> Pending Approval <span class="badge badge-amber">' + pending.length + '</span></h3>';
  if (pending.length) {
    pending.sort(function(a,b){return new Date(b.clockOut)-new Date(a.clockOut);});
    h += '<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Employee</th><th>Date</th><th>Time</th><th>Shift</th><th>Hours</th><th>Reason</th><th>Actions</th></tr></thead><tbody>';
    for (var i = 0; i < pending.length; i++) {
      var r = pending[i], emp = getEmpById(r.employeeId), shift = getShifts().find(function(s){return s.id===r.shiftId;});
      h += '<tr><td class="font-medium text-sm">' + (emp?emp.firstName+' '+emp.lastName:'?') + '</td><td class="text-xs">' + r.clockIn.slice(0,10) + '</td><td class="mono text-xs">' + fmtTime(new Date(r.clockIn)) + ' - ' + fmtTime(new Date(r.clockOut)) + '</td><td class="text-xs">' + (shift?shift.startTime+' - '+shift.endTime:'No shift') + '</td><td class="mono text-xs">' + fmtHrs(r.totalHours) + '</td><td class="text-xs" style="color:var(--warning);max-width:200px">' + (r.approvalReason||'') + '</td>';
      h += '<td><div class="flex gap-1"><button class="btn btn-success btn-sm" onclick="approveRecord(\'' + r.id + '\')"><i class="fas fa-check"></i></button><button class="btn btn-danger btn-sm" onclick="rejectRecord(\'' + r.id + '\')"><i class="fas fa-xmark"></i></button></div></td></tr>';
    }
    h += '</tbody></table></div>';
  } else { h += '<div class="card text-center py-8"><p class="text-sm" style="color:var(--muted)">No pending approvals</p></div>'; }
  h += '</div>';

  if (rejected.length) {
    h += '<div class="mb-6"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fas fa-xmark" style="color:var(--danger)"></i> Rejected <span class="badge badge-red">' + rejected.length + '</span></h3><div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Employee</th><th>Date</th><th>Time</th><th>Reason</th><th>Actions</th></tr></thead><tbody>';
    for (var i = 0; i < rejected.length; i++) {
      var r = rejected[i], emp = getEmpById(r.employeeId);
      h += '<tr><td class="text-sm">' + (emp?emp.firstName+' '+emp.lastName:'?') + '</td><td class="text-xs">' + r.clockIn.slice(0,10) + '</td><td class="mono text-xs">' + fmtTime(new Date(r.clockIn)) + ' - ' + fmtTime(new Date(r.clockOut)) + '</td><td class="text-xs" style="color:var(--danger)">' + (r.rejectionReason||r.approvalReason||'') + '</td>';
      h += '<td><button class="btn btn-success btn-sm" onclick="approveRecord(\'' + r.id + '\')"><i class="fas fa-rotate-left"></i> Approve</button></td></tr>';
    }
    h += '</tbody></table></div></div>';
  }
  if (approved.length) {
    h += '<div class="mb-6"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fas fa-check-circle" style="color:var(--success)"></i> Approved <span class="badge badge-green">' + approved.length + '</span></h3><div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Employee</th><th>Date</th><th>Time</th><th>Hours</th></tr></thead><tbody>';
    for (var i = 0; i < approved.length; i++) {
      var r = approved[i], emp = getEmpById(r.employeeId);
      h += '<tr><td class="text-sm">' + (emp?emp.firstName+' '+emp.lastName:'?') + '</td><td class="text-xs">' + r.clockIn.slice(0,10) + '</td><td class="mono text-xs">' + fmtTime(new Date(r.clockIn)) + ' - ' + fmtTime(new Date(r.clockOut)) + '</td><td class="mono text-xs">' + fmtHrs(r.totalHours) + '</td></tr>';
    }
    h += '</tbody></table></div></div>';
  }
  h += '</div>';
  return h;
}
function approveRecord(recordId) { fbUpdate('records/' + recordId, { approved:true, rejected:false }); toast('Approved','success'); navigateAdmin('approvals'); }
function rejectRecord(recordId) {
  openModal('<h3 class="font-bold text-lg mb-3">Reject Record</h3><div class="mb-4"><label>Rejection Reason (optional)</label><textarea id="m-reject-reason" rows="2" placeholder="Reason for rejection..."></textarea></div><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="doReject(\'' + recordId + '\')"><i class="fas fa-xmark"></i> Reject</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');
}
function doReject(recordId) {
  var reason = document.getElementById('m-reject-reason').value.trim() || 'Rejected by admin';
  fbUpdate('records/' + recordId, { approved:false, rejected:true, rejectionReason:reason });
  closeModal(); toast('Rejected','info'); navigateAdmin('approvals');
}

/* ============================================
   RECORDS
   ============================================ */
function renderRecords() {
  var recs = getRecords().slice().sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);});
  var h = '<div class="fade-in"><div class="flex items-center justify-between mb-6 flex-wrap gap-3"><div><h2 class="text-xl font-bold">Clock Records</h2><p class="text-sm" style="color:var(--muted)">' + recs.length + ' total</p></div>';
  h += '<div class="flex gap-2 items-center"><select id="rec-filter-emp" onchange="filterRecords()" style="width:auto;min-width:150px"><option value="">All Employees</option>';
  var emps = getEmployees();
  for (var i = 0; i < emps.length; i++) { h += '<option value="' + emps[i].id + '">' + emps[i].firstName + ' ' + emps[i].lastName + '</option>'; }
  h += '</select><input id="rec-filter-date" type="date" onchange="filterRecords()" style="width:auto"></div></div>';
  h += '<div class="card overflow-x-auto" style="padding:0" id="records-table-wrap">' + buildRecordsTable(recs) + '</div></div>';
  return h;
}
function buildRecordsTable(recs) {
  var h = '<table><thead><tr><th>Employee</th><th>Date</th><th>In</th><th>Out</th><th>NT</th><th>OT 1.5x</th><th>DT 2x</th><th>Total</th><th>Status</th><th>Approval</th></tr></thead><tbody>';
  if (!recs.length) { h += '<tr><td colspan="10" class="text-center py-8" style="color:var(--muted)">No records</td></tr>'; }
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i], emp = getEmpById(r.employeeId);
    var statusBadge = r.status === 'clocked_in' ? '<span class="badge badge-green">In</span>' : '<span class="badge badge-blue">Done</span>';
    var approvalBadge = '<span style="color:var(--muted);font-size:.7rem">N/A</span>';
    if (r.needsApproval) {
      if (r.approved) approvalBadge = '<span class="badge badge-green">Approved</span>';
      else if (r.rejected) approvalBadge = '<span class="badge badge-red">Rejected</span>';
      else approvalBadge = '<span class="badge badge-amber">Pending</span>';
    }
    h += '<tr><td class="font-medium text-sm">' + (emp?emp.firstName+' '+emp.lastName:'?') + '</td><td class="text-xs">' + (r.clockIn?r.clockIn.slice(0,10):'') + '</td><td class="mono text-xs">' + (r.clockIn?fmtTime(new Date(r.clockIn)):'') + '</td><td class="mono text-xs">' + (r.clockOut?fmtTime(new Date(r.clockOut)):'\u2014') + '</td>';
    h += '<td class="mono text-xs">' + fmtHrs(r.regularHours||0) + '</td><td class="mono text-xs">' + fmtHrs(r.overtimeHours||0) + '</td><td class="mono text-xs">' + fmtHrs(r.doubleTimeHours||0) + '</td><td class="mono text-xs font-semibold">' + fmtHrs(r.totalHours||0) + '</td><td>' + statusBadge + '</td><td>' + approvalBadge + '</td></tr>';
  }
  h += '</tbody></table>';
  return h;
}
function filterRecords() {
  var empId = document.getElementById('rec-filter-emp').value;
  var dateVal = document.getElementById('rec-filter-date').value;
  var recs = getRecords().filter(function(r) {
    if (empId && r.employeeId !== empId) return false;
    if (dateVal && r.clockIn && r.clockIn.slice(0,10) !== dateVal) return false;
    return true;
  }).sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);});
  document.getElementById('records-table-wrap').innerHTML = buildRecordsTable(recs);
}

/* ============================================
   TIMESHEET EXPORT
   ============================================ */
function renderExport() {
  var emps = getEmployees().filter(function(e){return e.active;});
  if (!state.exportEmpId && emps.length) state.exportEmpId = emps[0].id;
  if (!state.exportWS) state.exportWS = getWeekStart(todayStr());
  var ws = state.exportWS;
  var weekDates = getWeekDates(ws);
  var dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  var eo = '';
  for (var i = 0; i < emps.length; i++) {
    eo += '<option value="' + emps[i].id + '" ' + (state.exportEmpId===emps[i].id?'selected':'') + '>' + emps[i].firstName + ' ' + emps[i].lastName + ' (' + emps[i].employeeId + ')</option>';
  }
  var emp = getEmpById(state.exportEmpId);
  if (!emp) { return '<div class="fade-in card text-center py-12"><p style="color:var(--muted)">Select an employee</p></div>'; }
  var site = getSites().find(function(s){return s.id===emp.siteId;});

  var h = '<div class="fade-in"><div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold">Timesheet Export</h2><p class="text-sm" style="color:var(--muted)">Decimal format with approval status</p></div></div>';
  h += '<div class="card mb-4"><div class="flex flex-wrap items-end gap-4">';
  h += '<div class="flex-1 min-w-[180px]"><label>Employee</label><select id="ts-emp" onchange="state.exportEmpId=this.value;navigateAdmin(\'export\')">' + eo + '</select></div>';
  h += '<div><label>Week Starting</label><div class="flex items-center gap-2"><button class="btn btn-secondary btn-sm" onclick="shiftExportWeek(-1)"><i class="fas fa-chevron-left"></i></button><input id="ts-week" type="date" value="' + ws + '" onchange="state.exportWS=this.value;navigateAdmin(\'export\')" style="width:auto"><button class="btn btn-secondary btn-sm" onclick="shiftExportWeek(1)"><i class="fas fa-chevron-right"></i></button></div></div>';
  h += '<div class="flex gap-2"><button class="btn btn-primary" onclick="downloadTimesheetCSV()"><i class="fas fa-download"></i> Export CSV</button><button class="btn btn-secondary" onclick="window.print()"><i class="fas fa-print"></i> Print</button></div></div></div>';

  h += '<div class="card mb-4"><div class="flex flex-wrap gap-4 mb-4">';
  h += '<div><span class="text-xs" style="color:var(--muted)">Employee</span><div class="font-bold">' + emp.firstName + ' ' + emp.lastName + '</div></div>';
  h += '<div><span class="text-xs" style="color:var(--muted)">ID</span><div class="mono font-bold">' + emp.employeeId + '</div></div>';
  h += '<div><span class="text-xs" style="color:var(--muted)">Site</span><div class="text-sm font-medium">' + (site?site.name:'\u2014') + '</div></div>';
  h += '<div><span class="text-xs" style="color:var(--muted)">Period</span><div class="text-sm font-medium">' + new Date(weekDates[0]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' - ' + new Date(weekDates[6]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + '</div></div></div>';

  h += '<div class="overflow-x-auto"><table class="ts-table"><thead><tr><th class="row-label"></th>';
  for (var i = 0; i < 7; i++) {
    var dt = getDayType(weekDates[i]);
    h += '<th><div class="day-header">' + dayNames[i] + '</div><div style="font-weight:400;font-size:.65rem">' + new Date(weekDates[i]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + '</div>';
    if (dt !== 'Weekday') h += '<div class="badge ' + (dt==='Sunday'?'badge-purple':'badge-red') + '" style="font-size:.55rem;margin-top:2px">' + dt + '</div>';
    h += '</th>';
  }
  h += '<th style="background:rgba(232,168,56,.1);color:var(--accent)">Total</th></tr></thead><tbody>';

  var totals = { nt:0, ot:0, dt:0, total:0 };
  var rowLabels = [
    { key:'timeIn', label:'Time In' },
    { key:'timeOut', label:'Time Out' },
    { key:'nt', label:'NT' },
    { key:'ot', label:'OT 1.5x' },
    { key:'dt', label:'DT 2x' },
    { key:'total', label:'Total' },
    { key:'approval', label:'Approval' },
    { key:'comments', label:'Comments' }
  ];

  for (var ri = 0; ri < rowLabels.length; ri++) {
    var rl = rowLabels[ri];
    var isTotalRow = (rl.key === 'total');
    h += '<tr' + (isTotalRow ? ' class="total-row"' : '') + '><td class="row-label">' + rl.label + '</td>';
    var rowVal = 0;
    for (var di = 0; di < 7; di++) {
      var rec = null;
      var allRecs = getRecords();
      for (var j = 0; j < allRecs.length; j++) {
        if (allRecs[j].employeeId === emp.id && allRecs[j].status === 'completed' && allRecs[j].clockIn && allRecs[j].clockIn.slice(0,10) === weekDates[di]) { rec = allRecs[j]; break; }
      }
      var cell = '';
      if (rl.key === 'timeIn') cell = rec ? fmtTime(new Date(rec.clockIn)) : '';
      else if (rl.key === 'timeOut') cell = (rec && rec.clockOut) ? fmtTime(new Date(rec.clockOut)) : '';
      else if (rl.key === 'nt') { var v = rec ? rec.regularHours||0 : 0; cell = fmtHrs(v); totals.nt += v; }
      else if (rl.key === 'ot') { var v = rec ? rec.overtimeHours||0 : 0; cell = fmtHrs(v); totals.ot += v; }
      else if (rl.key === 'dt') { var v = rec ? rec.doubleTimeHours||0 : 0; cell = fmtHrs(v); totals.dt += v; }
      else if (rl.key === 'total') { var v = rec ? rec.totalHours||0 : 0; cell = fmtHrs(v); totals.total += v; }
      else if (rl.key === 'approval') {
        if (!rec) cell = '<span style="color:var(--border)">-</span>';
        else if (!rec.needsApproval) cell = '<span class="badge badge-green" style="font-size:.55rem">OK</span>';
        else if (rec.approved) cell = '<span class="badge badge-green" style="font-size:.55rem">Approved</span>';
        else if (rec.rejected) cell = '<span class="badge badge-red" style="font-size:.55rem">Rejected</span>';
        else cell = '<span class="badge badge-amber" style="font-size:.55rem">Pending</span>';
      }
      else if (rl.key === 'comments') {
        var comment = '';
        if (rec && rec.needsApproval && !rec.approved && !rec.rejected) comment = 'Awaiting approval';
        else if (rec && rec.rejected) comment = rec.rejectionReason || 'Rejected';
        else if (rec && rec.approvalReason) comment = rec.approvalReason;
        cell = '<span style="font-size:.65rem;color:var(--muted)" title="' + comment + '">' + comment + '</span>';
      }
      h += '<td' + (rl.key !== 'approval' && rl.key !== 'comments' ? ' class="mono"' : '') + '>' + cell + '</td>';
    }
    /* Column total */
    if (rl.key === 'nt') h += '<td class="mono font-bold">' + fmtHrs(totals.nt) + '</td>';
    else if (rl.key === 'ot') h += '<td class="mono font-bold">' + fmtHrs(totals.ot) + '</td>';
    else if (rl.key === 'dt') h += '<td class="mono font-bold">' + fmtHrs(totals.dt) + '</td>';
    else if (rl.key === 'total') h += '<td class="mono font-bold">' + fmtHrs(totals.total) + '</td>';
    else h += '<td></td>';
    h += '</tr>';
  }

  var payNT = totals.nt, payOT = totals.ot * 1.5, payDT = totals.dt * 2, payTotal = payNT + payOT + payDT;
  h += '<tr class="total-row"><td class="row-label" style="color:var(--accent)">Period Totals</td>';
  for (var i = 0; i < 7; i++) h += '<td></td>';
  h += '<td class="mono">' + fmtHrs(totals.total) + '</td></tr>';
  h += '<tr class="pay-row"><td class="row-label" style="color:var(--success)">Pay Totals</td>';
  for (var i = 0; i < 7; i++) h += '<td></td>';
  h += '<td class="mono">' + fmtHrs(payTotal) + '</td></tr>';
  h += '<tr class="pay-row"><td class="row-label" style="color:var(--success);font-size:.65rem">NT / OT / DT</td>';
  for (var i = 0; i < 7; i++) h += '<td></td>';
  h += '<td class="mono" style="font-size:.7rem">' + fmtHrs(payNT) + ' / ' + fmtHrs(payOT) + ' / ' + fmtHrs(payDT) + '</td></tr>';
  h += '</tbody></table></div></div>';

  var tc = getTierConfig();
  var remaining = Math.max(0, tc.otAfter - totals.total);
  h += '<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">';
  h += '<div class="card"><div class="text-xs" style="color:var(--muted)">Weekly Target</div><div class="mono text-lg font-bold">' + fmtHrs(tc.otAfter) + '</div></div>';
  h += '<div class="card"><div class="text-xs" style="color:var(--muted)">Worked This Week</div><div class="mono text-lg font-bold" style="color:' + (totals.total>=tc.otAfter?'var(--warning)':'var(--success)') + '">' + fmtHrs(totals.total) + '</div></div>';
  h += '<div class="card"><div class="text-xs" style="color:var(--muted)">Before OT</div><div class="mono text-lg font-bold">' + fmtHrs(remaining) + '</div></div></div>';
  h += '</div>';
  return h;
}
function shiftExportWeek(dir) {
  var d = new Date(state.exportWS + 'T12:00:00');
  d.setDate(d.getDate() + dir * 7);
  state.exportWS = fmtDate(d);
  navigateAdmin('export');
}
function downloadTimesheetCSV() {
  var emp = getEmpById(state.exportEmpId);
  if (!emp) { toast('Select employee','error'); return; }
  var ws = state.exportWS;
  var weekDates = getWeekDates(ws);
  var dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var site = getSites().find(function(s){return s.id===emp.siteId;});
  var tc = getTierConfig();
  var lines = [];
  lines.push('EMPLOYEE TIMESHEET');
  lines.push('Name:,' + emp.firstName + ' ' + emp.lastName);
  lines.push('ID:,' + emp.employeeId);
  lines.push('Site:,' + (site ? site.name : ''));
  lines.push('Period:,' + new Date(weekDates[0]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ' - ' + new Date(weekDates[6]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
  lines.push('');

  var header = ',';
  for (var i = 0; i < 7; i++) { header += dayNames[i] + ' ' + new Date(weekDates[i]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ','; }
  header += 'Total';
  lines.push(header);

  var rows = ['Time In','Time Out','NT','OT 1.5x','DT 2x','Total','Approval','Comments'];
  var totals = { nt:0, ot:0, dt:0, total:0 };

  for (var ri = 0; ri < rows.length; ri++) {
    var rowLabel = rows[ri];
    var line = rowLabel + ',';
    for (var di = 0; di < 7; di++) {
      var rec = null;
      var allRecs = getRecords();
      for (var j = 0; j < allRecs.length; j++) {
        if (allRecs[j].employeeId === emp.id && allRecs[j].status === 'completed' && allRecs[j].clockIn && allRecs[j].clockIn.slice(0,10) === weekDates[di]) { rec = allRecs[j]; break; }
      }
      var val = '';
      if (rowLabel === 'Time In') val = rec ? fmtTime(new Date(rec.clockIn)) : '';
      else if (rowLabel === 'Time Out') val = (rec && rec.clockOut) ? fmtTime(new Date(rec.clockOut)) : '';
      else if (rowLabel === 'NT') { var v = rec ? rec.regularHours||0 : 0; val = fmtHrs(v); totals.nt += v; }
      else if (rowLabel === 'OT 1.5x') { var v = rec ? rec.overtimeHours||0 : 0; val = fmtHrs(v); totals.ot += v; }
      else if (rowLabel === 'DT 2x') { var v = rec ? rec.doubleTimeHours||0 : 0; val = fmtHrs(v); totals.dt += v; }
      else if (rowLabel === 'Total') { var v = rec ? rec.totalHours||0 : 0; val = fmtHrs(v); totals.total += v; }
      else if (rowLabel === 'Approval') {
        if (!rec) val = '-';
        else if (!rec.needsApproval) val = 'OK';
        else if (rec.approved) val = 'Approved';
        else if (rec.rejected) val = 'Rejected';
        else val = 'Pending';
      }
      else if (rowLabel === 'Comments') {
        if (!rec) val = '';
        else if (rec.needsApproval && !rec.approved && !rec.rejected) val = 'Awaiting approval';
        else if (rec.rejected) val = rec.rejectionReason || 'Rejected';
        else val = '';
      }
      line += val + ',';
    }
    if (rowLabel === 'NT') line += fmtHrs(totals.nt);
    else if (rowLabel === 'OT 1.5x') line += fmtHrs(totals.ot);
    else if (rowLabel === 'DT 2x') line += fmtHrs(totals.dt);
    else if (rowLabel === 'Total') line += fmtHrs(totals.total);
    lines.push(line);
  }

  lines.push('');
  lines.push('Period Totals,,,,' + fmtHrs(totals.nt) + ',' + fmtHrs(totals.ot) + ',' + fmtHrs(totals.dt) + ',' + fmtHrs(totals.total));
  var payNT = totals.nt, payOT = totals.ot * 1.5, payDT = totals.dt * 2, payTotal = payNT + payOT + payDT;
  lines.push('Pay Totals (weighted),,,,' + fmtHrs(payNT) + ',' + fmtHrs(payOT) + ',' + fmtHrs(payDT) + ',' + fmtHrs(payTotal));
  lines.push('');
  lines.push('Weekly Target: ' + fmtHrs(tc.otAfter));

  var csv = lines.join('\n');
  var blob = new Blob([csv], { type:'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Timesheet_' + emp.employeeId + '_' + ws + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded','success');
}

/* ============================================
   SETTINGS
   ============================================ */
function renderSettings() {
  var s = getSettings();
  var h = '<div class="fade-in"><h2 class="text-xl font-bold mb-6">Settings</h2><div class="grid gap-4 max-w-xl">';
  h += '<div class="card"><h3 class="font-semibold text-sm mb-4"><i class="fas fa-clock mr-2" style="color:var(--accent)"></i>Hours & Tiers</h3><div class="grid gap-4">';
  h += '<div class="grid grid-cols-2 gap-3"><div><label>Weekly Target (hours)</label><input id="s-target" type="number" step="0.5" value="' + (s.weeklyTarget||45) + '"></div><div><label>Overtime After (hours)</label><input id="s-ot" type="number" step="0.5" value="' + (s.overtimeAfter!=null?s.overtimeAfter:45) + '"></div></div>';
  h += '<div class="grid grid-cols-2 gap-3"><div><label>Default Break (min)</label><input id="s-break" type="number" value="' + (s.defaultBreak||30) + '"></div><div><label>Grace Period (min)</label><input id="s-grace" type="number" value="' + (s.graceMinutes!=null?s.graceMinutes:10) + '"><p class="text-xs mt-1" style="color:var(--muted)">Clock in/out within this many minutes of shift start/end won\'t require approval</p></div></div></div></div>';
  h += '<div class="card"><h3 class="font-semibold text-sm mb-4"><i class="fas fa-calendar-xmark mr-2" style="color:var(--danger)"></i>Public Holidays</h3><div><label>Holiday Dates (YYYY-MM-DD, one per line)</label><textarea id="s-holidays" rows="8" style="font-family:\'JetBrains Mono\',monospace;font-size:.75rem;resize:vertical">' + getHolidays().join('\n') + '</textarea></div></div>';
  h += '<div class="card"><h3 class="font-semibold text-sm mb-4"><i class="fas fa-shield-halved mr-2" style="color:var(--info)"></i>Admin Credentials</h3><div class="grid gap-4"><div><label>Username</label><input id="s-admin-user" value="' + (D.admin.username||'') + '"></div><div><label>New Password (leave blank to keep)</label><input id="s-admin-pass" type="password" placeholder="Enter new password"></div></div></div>';
  h += '<button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Save Settings</button>';
  h += '</div></div>';
  return h;
}
function saveSettings() {
  var target = parseFloat(document.getElementById('s-target').value) || 45;
  var ot = parseFloat(document.getElementById('s-ot').value) || target;
  var brk = parseInt(document.getElementById('s-break').value) || 30;
  var grace = parseInt(document.getElementById('s-grace').value) || 10;
  var holidays = document.getElementById('s-holidays').value.trim().split('\n').map(function(h){return h.trim();}).filter(function(h){return /^\d{4}-\d{2}-\d{2}$/.test(h);});
  fbSet('settings', { weeklyTarget:target, overtimeAfter:ot, defaultBreak:brk, graceMinutes:grace, holidays:holidays });
  var newUser = document.getElementById('s-admin-user').value.trim();
  var newPass = document.getElementById('s-admin-pass').value;
  var updates = { username:newUser };
  if (newPass) updates.password = newPass;
  fbUpdate('admin', updates);
  toast('Settings saved','success');
}

/* ============================================
   EMPLOYEE CLOCK PAGE
   ============================================ */
function renderClockPage() {
  var emp = state.currentEmployee;
  var site = getSites().find(function(s){return s.id===emp.siteId;});
  var now = new Date();
  var h = '<div class="fade-in"><div class="emp-hero mb-6"><div class="emp-avatar">' + emp.firstName[0] + emp.lastName[0] + '</div>';
  h += '<div class="text-lg font-bold">' + emp.firstName + ' ' + emp.lastName + '</div>';
  h += '<div class="text-sm" style="color:var(--muted)">' + emp.employeeId + ' &middot; ' + (site?site.name:'') + '</div>';
  h += '<div class="big-time mt-4" id="emp-live-clock">' + now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) + '</div>';
  h += '<div class="big-date" id="emp-live-date">' + now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + '</div></div>';

  var todayShift = null;
  var allShifts = getShifts();
  for (var i = 0; i < allShifts.length; i++) {
    if (allShifts[i].employeeId === emp.id && allShifts[i].date === todayStr()) { todayShift = allShifts[i]; break; }
  }
  if (todayShift) {
    h += '<div class="card mb-4"><div class="text-xs font-semibold mb-2" style="color:var(--muted)">TODAY\'S SHIFT</div><div class="flex items-center gap-4"><span class="mono text-sm" style="color:var(--accent)">' + todayShift.startTime + ' - ' + todayShift.endTime + '</span><span class="badge badge-blue">' + (todayShift.targetHours||'auto') + 'h</span>' + (todayShift.breakMinutes ? '<span class="text-xs" style="color:var(--muted)">' + todayShift.breakMinutes + 'm break</span>' : '') + '</div></div>';
  } else {
    h += '<div class="card mb-4" style="border-color:rgba(248,113,113,.3)"><div class="flex items-center gap-2"><i class="fas fa-triangle-exclamation" style="color:var(--warning)"></i><span class="text-sm">No shift scheduled today \u2014 clocking in will require approval</span></div></div>';
  }

  if (state.gpsStatus === 'checked' && site) {
    var gpsOk = state.gpsDistance != null && state.gpsDistance <= site.radius;
    h += '<div class="card mb-4"><div class="flex items-center gap-2"><i class="fas ' + (gpsOk?'fa-location-dot':'fa-location-crosshairs') + '" style="color:' + (gpsOk?'var(--success)':'var(--warning)') + '"></i><span class="text-xs" style="color:var(--muted)">GPS: ' + (gpsOk ? 'On site (' + Math.round(state.gpsDistance) + 'm)' : 'Off site (' + (state.gpsDistance!=null?Math.round(state.gpsDistance)+'m':'N/A') + ')') + '</span></div></div>';
  }

  h += '<div class="flex justify-center mb-6">';
  if (state.clockState === 'idle') {
    h += '<div class="clock-face clock-in-face" onclick="doClockIn()"><div class="cf-icon"><i class="fas fa-fingerprint"></i></div><div class="cf-label">CLOCK IN</div><div class="cf-sub">Tap to start</div></div>';
  } else {
    var elapsed = Math.floor((Date.now() - new Date(state.activeRecord.clockIn).getTime()) / 60000);
    h += '<div class="clock-face clock-out-face" onclick="doClockOut()"><div class="cf-icon"><i class="fas fa-fingerprint"></i></div><div class="cf-label">CLOCK OUT</div><div class="cf-sub mono" id="emp-elapsed">' + fmtHrs(elapsed/60) + 'h</div></div>';
  }
  h += '</div>';

  var allRecs = getRecords();
  var pendingCount = 0, rejectedCount = 0;
  for (var i = 0; i < allRecs.length; i++) {
    var r = allRecs[i];
    if (r.employeeId === emp.id && r.status === 'completed') {
      if (r.needsApproval && !r.approved && !r.rejected) pendingCount++;
      if (r.rejected) rejectedCount++;
    }
  }
  if (pendingCount) {
    h += '<div class="card mb-4" style="border-color:rgba(251,191,36,.3)"><div class="flex items-center gap-2"><i class="fas fa-clock" style="color:var(--warning)"></i><span class="text-sm"><strong>' + pendingCount + '</strong> record(s) awaiting admin approval</span></div></div>';
  }
  if (rejectedCount) {
    h += '<div class="card mb-4" style="border-color:rgba(248,113,113,.3)"><div class="flex items-center gap-2"><i class="fas fa-circle-xmark" style="color:var(--danger)"></i><span class="text-sm"><strong>' + rejectedCount + '</strong> record(s) rejected by admin</span></div></div>';
  }
  h += '</div>';
  return h;
}
function initClockPage() {
  if (state.clockTimeInterval) clearInterval(state.clockTimeInterval);
  var update = function() {
    var ce = document.getElementById('emp-live-clock');
    if (ce) ce.textContent = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var de = document.getElementById('emp-live-date');
    if (de) de.textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var ee = document.getElementById('emp-elapsed');
    if (ee && state.activeRecord) {
      var elapsed = Math.floor((Date.now() - new Date(state.activeRecord.clockIn).getTime()) / 60000);
      ee.textContent = fmtHrs(elapsed/60) + 'h';
    }
    if (!document.getElementById('emp-live-clock')) { clearInterval(state.clockTimeInterval); }
  };
  update();
  state.clockTimeInterval = setInterval(update, 1000);
  if (navigator.geolocation) {
    var site = getSites().find(function(s){return s.id===state.currentEmployee.siteId;});
    if (site) {
      navigator.geolocation.getCurrentPosition(function(p) {
        state.gpsLat = p.coords.latitude;
        state.gpsLng = p.coords.longitude;
        state.gpsDistance = haversine(p.coords.latitude, p.coords.longitude, site.lat, site.lng);
        state.gpsStatus = 'checked';
        navigateEmp('clock');
      }, function() { state.gpsStatus = 'error'; }, { enableHighAccuracy:true, timeout:10000 });
    }
  }
}
function doClockIn() {
  var emp = state.currentEmployee;
  var todayShift = null;
  var allShifts = getShifts();
  for (var i = 0; i < allShifts.length; i++) {
    if (allShifts[i].employeeId === emp.id && allShifts[i].date === todayStr()) { todayShift = allShifts[i]; break; }
  }
  var id = db.ref('records').push().key;
  var record = {
    id:id, employeeId:emp.id, siteId:emp.siteId,
    shiftId: todayShift ? todayShift.id : '',
    clockIn: new Date().toISOString(), clockOut: null,
    status:'clocked_in', regularHours:0, overtimeHours:0, doubleTimeHours:0, totalHours:0,
    dayType: getDayType(todayStr()),
    needsApproval: false, approved: false, rejected: false, approvalReason: '', rejectionReason: ''
  };
  if (!todayShift) { record.needsApproval = true; record.approvalReason = 'No shift scheduled for this day'; }
  fbSet('records/' + id, record);
  state.clockState = 'clocked_in';
  state.activeRecord = record;
  toast('Clocked in' + (record.needsApproval ? ' (requires approval)' : ''), 'success');
  navigateEmp('clock');
}
function doClockOut() {
  if (!state.activeRecord) return;
  var record = state.activeRecord;
  var clockOut = new Date().toISOString();
  var shift = null;
  var allShifts = getShifts();
  for (var i = 0; i < allShifts.length; i++) { if (allShifts[i].id === record.shiftId) { shift = allShifts[i]; break; } }
  var breakMin = shift ? (shift.breakMinutes||0) : (getSettings().defaultBreak||0);
  var tc = getTierConfig();
  var dayType = getDayType(clockOut.slice(0,10));
  var weekWorked = getEmployeeWeekWorkedHours(record.employeeId, clockOut.slice(0,10));
  var hours = calcHours(record.clockIn, clockOut, breakMin, weekWorked, dayType, tc);

  var updates = {
    clockOut: clockOut, status:'completed',
    regularHours: hours.regularHours, overtimeHours: hours.overtimeHours,
    doubleTimeHours: hours.doubleTimeHours, totalHours: hours.totalHours,
    dayType: dayType
  };

  var tempRec = {};
  for (var k in record) { tempRec[k] = record[k]; }
  for (var k in updates) { tempRec[k] = updates[k]; }
  var approval = checkNeedsApproval(tempRec);
  updates.needsApproval = approval.needsApproval;
  updates.approvalReason = approval.reason;
  updates.approved = false;
  updates.rejected = false;

  fbUpdate('records/' + record.id, updates);
  state.clockState = 'idle';
  state.activeRecord = null;
  toast('Clocked out \u2014 ' + fmtHrs(hours.totalHours) + 'h' + (approval.needsApproval ? ' (requires approval)' : ''), 'success');
  navigateEmp('clock');
}

/* ============================================
   EMPLOYEE HISTORY
   ============================================ */
function renderEmpHistory() {
  var emp = state.currentEmployee;
  var recs = getRecords().filter(function(r){return r.employeeId===emp.id && r.status==='completed';}).sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);});
  var h = '<div class="fade-in"><h2 class="text-xl font-bold mb-4">My History</h2>';
  if (!recs.length) { h += '<div class="card text-center py-12"><i class="fas fa-history text-3xl mb-3" style="color:var(--muted)"></i><p style="color:var(--muted)">No records yet</p></div></div>'; return h; }
  h += '<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>NT</th><th>OT 1.5x</th><th>DT 2x</th><th>Total</th><th>Status</th></tr></thead><tbody>';
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i];
    var approvalBadge = '';
    if (r.needsApproval) {
      if (r.approved) approvalBadge = '<span class="badge badge-green" style="font-size:.55rem">Approved</span>';
      else if (r.rejected) approvalBadge = '<span class="badge badge-red" style="font-size:.55rem">Rejected</span>';
      else approvalBadge = '<span class="badge badge-amber" style="font-size:.55rem">Pending</span>';
    }
    h += '<tr><td class="text-xs">' + r.clockIn.slice(0,10) + '</td><td class="mono text-xs">' + fmtTime(new Date(r.clockIn)) + '</td><td class="mono text-xs">' + (r.clockOut?fmtTime(new Date(r.clockOut)):'') + '</td>';
    h += '<td class="mono text-xs">' + fmtHrs(r.regularHours||0) + '</td><td class="mono text-xs">' + fmtHrs(r.overtimeHours||0) + '</td><td class="mono text-xs">' + fmtHrs(r.doubleTimeHours||0) + '</td><td class="mono text-xs font-semibold">' + fmtHrs(r.totalHours||0) + '</td><td>' + approvalBadge + '</td></tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

/* ============================================
   INIT
   ============================================ */
initFirebase(EMBEDDED_FB);
</script>
