<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SitePro Clock In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#090b13;--bg2:#0f1219;--card:#151923;--card2:#1c2130;--border:#252d42;--fg:#e4e6ec;--muted:#6a7199;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24;--purple:#c084fc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 50%,rgba(232,168,56,.05) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(56,189,248,.03) 0%,transparent 50%),radial-gradient(ellipse at 50% 90%,rgba(168,85,247,.025) 0%,transparent 50%);pointer-events:none;z-index:0}
body>*{position:relative;z-index:1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;transition:all .25s ease}
.card:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--border));box-shadow:0 4px 24px rgba(0,0,0,.2)}
.card-glass{background:linear-gradient(135deg,rgba(21,25,35,.9),rgba(28,33,48,.7));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:1.25rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:9px;font-weight:500;font-size:.85rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0c0e16;box-shadow:0 2px 12px rgba(232,168,56,.25)}.btn-primary:hover{box-shadow:0 4px 20px rgba(232,168,56,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-success{background:rgba(52,211,153,.12);color:var(--success);border:1px solid rgba(52,211,153,.25)}.btn-success:hover{background:rgba(52,211,153,.2)}
.btn-sm{padding:.35rem .7rem;font-size:.78rem;border-radius:7px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.55rem .75rem;border-radius:9px;font-family:inherit;font-size:.85rem;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,168,56,.1)}
select option{background:var(--card);color:var(--fg)}
textarea{resize:vertical;min-height:80px;font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.5}
label{font-size:.78rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.25rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.2rem;color:var(--muted);font-size:.85rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.04)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.07);border-left-color:var(--accent)}
.sidebar-link.active::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--accent);border-radius:1px}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{padding:.75rem 1.1rem;border-radius:10px;font-size:.83rem;display:flex;align-items:center;gap:.55rem;animation:toastIn .35s ease;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:auto;backdrop-filter:blur(8px)}
.toast-success{background:rgba(6,95,70,.9);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.toast-error{background:rgba(127,29,29,.9);border:1px solid rgba(248,113,113,.3);color:#fecaca}
.toast-info{background:rgba(12,74,110,.9);border:1px solid rgba(56,189,248,.3);color:#bae6fd}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 40px rgba(52,211,153,.12),inset 0 0 40px rgba(52,211,153,.03)}50%{box-shadow:0 0 70px rgba(52,211,153,.25),inset 0 0 60px rgba(52,211,153,.06)}}
@keyframes breatheOut{0%,100%{box-shadow:0 0 40px rgba(248,113,113,.12),inset 0 0 40px rgba(248,113,113,.03)}50%{box-shadow:0 0 70px rgba(248,113,113,.25),inset 0 0 60px rgba(248,113,113,.06)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .35s ease}
.fade-in-scale{animation:fadeInScale .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .2s}
.modal-overlay.show{opacity:1}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:1.5rem;transform:scale(.95);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.55rem .75rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--card);z-index:2}
td{padding:.55rem .75rem;font-size:.83rem;border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)}
tr:hover td{background:rgba(232,168,56,.025)}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:20px;font-size:.68rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.12);color:var(--success)}.badge-red{background:rgba(248,113,113,.12);color:var(--danger)}.badge-amber{background:rgba(232,168,56,.12);color:var(--accent)}.badge-blue{background:rgba(56,189,248,.12);color:var(--info)}.badge-purple{background:rgba(168,85,247,.12);color:var(--purple)}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}.conn-dot.loading{background:var(--warning);animation:pulseRing 1.2s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;transition:all .2s;background:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-btn:hover{color:var(--fg)}
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .6s ease}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.15rem;position:relative;overflow:hidden;transition:all .25s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.sc-amber::before{background:var(--accent)}.sc-green::before{background:var(--success)}.sc-blue::before{background:var(--info)}.sc-red::before{background:var(--danger)}.sc-purple::before{background:var(--purple)}
.search-box{position:relative}.search-box input{padding-left:2.2rem}.search-box i{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
.clock-face{position:relative;width:260px;height:260px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;user-select:none}
.clock-face.ci{background:radial-gradient(circle at 38% 32%,rgba(52,211,153,.1),var(--card) 65%);border:2.5px solid var(--success);animation:breathe 3s ease-in-out infinite}
.clock-face.ci:hover{transform:scale(1.05)}.clock-face.ci:active{transform:scale(.96)}
.clock-face.co{background:radial-gradient(circle at 38% 32%,rgba(248,113,113,.1),var(--card) 65%);border:2.5px solid var(--danger);animation:breatheOut 2.5s ease-in-out infinite}
.clock-face.co:hover{transform:scale(1.05)}.clock-face.co:active{transform:scale(.96)}
.clock-face.idle{background:radial-gradient(circle at 38% 32%,rgba(232,168,56,.06),var(--card) 65%);border:2.5px solid var(--border)}
.clock-face.idle:hover{border-color:var(--accent)}
.clock-ring{position:absolute;inset:-16px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--border) 60%,transparent);animation:spinSlow 40s linear infinite;pointer-events:none}
.clock-face::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid;opacity:0;animation:pulseRing 2.5s ease-out infinite;pointer-events:none}
.clock-face.ci::after{border-color:var(--success)}.clock-face.co::after{border-color:var(--danger)}
.cf-icon{font-size:2.2rem;margin-bottom:.2rem}.cf-label{font-size:.95rem;font-weight:700;letter-spacing:.04em}.cf-sub{font-size:.68rem;color:var(--muted);margin-top:.1rem}
.emp-hero{background:linear-gradient(180deg,rgba(232,168,56,.04) 0%,transparent 60%);border-radius:18px;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.emp-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,56,.07),transparent 70%);pointer-events:none}
.emp-avatar{width:60px;height:60px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;margin-bottom:.6rem;border:2px solid var(--accent);color:var(--accent);background:var(--card)}
.chart-canvas{width:100%;border-radius:10px}
.filter-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.filter-row .fg{display:flex;flex-direction:column;gap:.2rem;min-width:140px;flex:1}
.filter-row .fg label{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}.empty-state i{font-size:2.5rem;margin-bottom:.75rem;opacity:.3}
.tier-legend{display:flex;gap:1rem;flex-wrap:wrap}
.tier-legend span{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--muted)}
.tier-legend .td{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.format-hint{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.6;white-space:pre;overflow-x:auto}
.format-hint b{color:var(--accent);font-weight:600}
.import-preview{max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:.75rem}
.import-preview table{margin:0}.import-preview th{background:var(--bg2);font-size:.65rem;padding:.4rem .6rem}.import-preview td{font-size:.78rem;padding:.4rem .6rem}
.err-row td{background:rgba(248,113,113,.06)!important}.ok-row td{background:rgba(52,211,153,.04)!important}
.jarrison-info{background:linear-gradient(135deg,rgba(56,189,248,.06),rgba(168,85,247,.04));border:1px solid rgba(56,189,248,.15);border-radius:10px;padding:1rem 1.15rem}
.jarrison-info h4{font-size:.85rem;font-weight:600;color:var(--info);margin-bottom:.4rem}
.jarrison-info p{font-size:.78rem;color:var(--muted);line-height:1.5}
.jarrison-info code{background:var(--bg2);padding:.1rem .35rem;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--fg)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-face{width:210px;height:210px}.filter-row{flex-direction:column}.filter-row .fg{min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div id="loading-screen" class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing...</p></div></div>
<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card-glass w-full max-w-md fade-in-scale" style="border-color:color-mix(in srgb,var(--accent) 15%,var(--border))">
    <div class="text-center mb-6"><div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a);box-shadow:0 4px 20px rgba(232,168,56,.3)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div><h1 class="text-2xl font-bold tracking-tight">SitePro Clock In</h1><p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p></div>

    <div id="login-admin" class="hidden"><div class="mb-3"><label>Username</label><input id="admin-user" type="text" placeholder="admin" autocomplete="off"></div><div class="mb-5"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div><button class="btn btn-primary w-full justify-center" onclick="adminLogin()"><i class="fas fa-right-to-bracket"></i> Sign In</button></div>
    <div id="login-employee"><div class="mb-3"><label>Employee ID</label><input id="emp-id" type="text" placeholder="e.g. EMP001" autocomplete="off" style="text-transform:uppercase"></div><div class="mb-5"><label>PIN</label><input id="emp-pin" type="password" placeholder="4-digit PIN" maxlength="4" inputmode="numeric"></div><button class="btn btn-primary w-full justify-center" onclick="employeeLogin()"><i class="fas fa-right-to-bracket"></i> Clock In Portal</button></div>
  </div>
</div>
<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-4 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div class="min-w-0"><div class="font-bold text-sm truncate">SitePro</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div></div>
    <nav class="py-2 flex-1 overflow-y-auto" id="admin-nav">
      <div class="px-4 py-1.5 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Overview</div>

      <a class="sidebar-link" data-page="shifts"><i class="fas fa-calendar-days w-5 text-center"></i> Shifts</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">Data</div>
      <a class="sidebar-link" data-page="records"><i class="fas fa-clock-rotate-left w-5 text-center"></i> Clock Records</a>
      <a class="sidebar-link" data-page="export"><i class="fas fa-file-export w-5 text-center"></i> Export</a>
      <a class="sidebar-link" data-page="recyclebin"><i class="fas fa-recycle w-5 text-center"></i> Recycle Bin</a>
      <div class="px-4 py-1.5 mt-1 text-xs font-semibold uppercase tracking-wider" style="color:var(--muted);opacity:.4;font-size:.65rem">System</div>
      <a class="sidebar-link" data-page="settings"><i class="fas fa-gear w-5 text-center"></i> Settings</a>
    </nav>
    <div class="p-3 border-t" style="border-color:var(--border)"><button class="btn btn-secondary btn-sm w-full justify-center" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
  </aside>
  <div class="main-content" id="admin-content"></div>
  <button class="fixed top-4 left-4 z-50 btn btn-secondary btn-sm md:hidden" onclick="toggleSidebar()" style="border-radius:10px"><i class="fas fa-bars"></i></button>
</div>

  <div class="min-h-screen flex flex-col">
    <header class="p-3 flex items-center justify-between border-b" style="border-color:var(--border);background:var(--bg2)">

</div>

/* ===== HOURS SYSTEM ===== */
function isHol(ds){return hols().indexOf(ds)!==-1;}
function dayType(ds){var d=new Date(ds+'T12:00:00'),day=d.getDay();if(day===0)return 'Sunday';if(isHol(ds))return 'Holiday';if(day===6)return 'Saturday';return 'Weekday';}
function dayBadge(dt){var cls=dt==='Sunday'?'badge-purple':dt==='Holiday'?'badge-red':dt==='Saturday'?'badge-amber':'badge-blue';return '<span class="badge '+cls+'">'+dt+'</span>';}
function getDailyTarget(dt){var s=sett();if(dt==='Weekday')return s.weekdayDailyTarget||8;if(dt==='Saturday')return s.saturdayDailyTarget||5;return 0;}
function getWeeklyTarget(){return sett().weeklyTarget||45;}
function weekStart(ds){var d=new Date(ds+'T12:00:00'),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return fmtDate(d);}
function weekEnd(ws){var d=new Date(ws+'T12:00:00');d.setDate(d.getDate()+5);return fmtDate(d);}
function calcHours(ci,co,bm,dt){var ms=new Date(co)-new Date(ci),min=Math.max(0,ms/60000-bm),th=Math.round(min/6)/10;if(dt==='Sunday'||dt==='Holiday')return{regularHours:0,unauthOT:0,doubleTimeHours:th,totalHours:th};var tgt=getDailyTarget(dt),reg=Math.min(th,tgt),uot=Math.max(0,th-tgt);return{regularHours:reg,unauthOT:uot,doubleTimeHours:0,totalHours:th};}
function getUOT(r){return(r.unauthOT!=null?r.unauthOT:(r.overtimeHours||0));}
function empWeekTotal(eid,curDate){var ws=weekStart(curDate),we=weekEnd(ws);return recs().filter(function(r){return r.employeeId===eid&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=we;}).reduce(function(s,r){return s+(r.totalHours||0);},0);}
function mondaysInMonth(y,m){var c=0,d=new Date(y,m,1),dw=d.getDay(),toM=dw===0?1:(dw===1?0:8-dw);d.setDate(d.getDate()+toM);while(d.getMonth()===m&&d.getFullYear()===y){c++;d.setDate(d.getDate()+7);}return c;}
function empMonthHours(eid,y,m){var ms=y+'-'+String(m+1).padStart(2,'0');var rs=recs().filter(function(r){return r.employeeId===eid&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,7)===ms;});var t={regular:0,unauthOT:0,doubleTime:0,total:0,count:rs.length};rs.forEach(function(r){t.regular+=(r.regularHours||0);t.unauthOT+=getUOT(r);t.doubleTime+=(r.doubleTimeHours||0);t.total+=(r.totalHours||0);});t.target=getWeeklyTarget()*mondaysInMonth(y,m);t.overTarget=Math.max(0,t.total-t.target);return t;}

function initDashCharts(){
  clearInterval(S.dashInt);
  (function tick(){var el=document.getElementById('dash-clock');if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});else{clearInterval(S.dashInt);return;}S.dashInt=setInterval(tick,1000);})();
  var ws=weekStart(today()),tc=getWeeklyTarget(),data=emps().filter(function(e){return e.active;}).map(function(e){
    var ers=recs().filter(function(r){return r.employeeId===e.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=weekEnd(ws);});
    var reg=0,uot=0,dt=0;ers.forEach(function(r){reg+=(r.regularHours||0);uot+=getUOT(r);dt+=(r.doubleTimeHours||0);});
    return{label:e.firstName+' '+e.lastName.charAt(0)+'.',reg:reg,uot:uot,dt:dt,total:reg+uot+dt};
  });
  drawBar(document.getElementById('chart-weekly'),data,tc);
  var tR=0,tU=0,tD=0;data.forEach(function(d){tR+=d.reg;tU+=d.uot;tD+=d.dt;});
  drawDonut(document.getElementById('chart-donut'),[{v:tR,c:'#34d399'},{v:tU,c:'#f87171'},{v:tD,c:'#c084fc'}]);
}
function drawBar(canvas,data,maxVal){

function renderRecords(){var h='<div class="fade-in"><div class="flex items-center justify-between mb-4"><div><h2 class="text-xl font-bold tracking-tight">Clock Records</h2><p class="text-sm" style="color:var(--muted)">'+recs().length+'</p></div></div><div class="filter-row"><div class="search-box fg" style="min-width:200px"><i class="fas fa-search"></i><input placeholder="Search..." value="'+escHtml(S.searchTerms.records||'')+'" oninput="S.searchTerms.records=this.value;document.getElementById(\'rec-tbody\').innerHTML=recRows()"></div><div class="fg"><label>Date</label><input type="date" value="'+S.recFilterDate+'" onchange="S.recFilterDate=this.value;document.getElementById(\'rec-tbody\').innerHTML=recRows()"></div><div class="fg"><label>Status</label><select onchange="S.recFilterStatus=this.value;document.getElementById(\'rec-tbody\').innerHTML=recRows()"></select><option value="">All</option><option value="completed" '+(S.recFilterStatus==='completed'?'selected':'')+'>Completed</option><option value="clocked_in" '+(S.recFilterStatus==='clocked_in'?'selected':'Active</option></select></div><div class="fg"><label>Site</label><select onchange="S.recFilterSite=this.value;document.getElementById(\'rec-tbody\').innerHTML=recRows()"></select><option value="">All</option>'+sites().map(function(s){return '<option value="'+s.id+'" '+(S.recFilterSite===s.id?'selected':'')+'>'+escHtml(s.name)+'</option>';}).join('')+'</select></div></div><div class="card overflow-x-auto" style="padding:0;max-height:60vh;overflow-y:auto"><table><thead><tr><th>Employee</th><th>Site</th><th>In</th><th>Out</th><th>Total</th><th>Normal Time</th><th>Over Time</th><th>Double Time</th><th>Type</th></tr></thead><tbody id="rec-tbody">'+recRows()+'</tbody></table></div></div></div>';return h;}

function getFiltered(){var from=document.getElementById('exp-from').value,to=document.getElementById('exp-to').value,eid=document.getElementById('exp-emp').value,sid=document.getElementById('exp-site').value;var rc=recs().filter(function(r){return r.status==='completed';}).sort(function(a,b){return new Date(a.clockIn)-new Date(b.clockIn);});if(from)rc=rc.filter(function(r){return(r.clockIn||'').slice(0,10)>=from;});if(to)rc=rc.filter(function(r){return(r.clockIn||'').slice(0,10)<=to;});if(eid)rc=rc.filter(function(r){return r.employeeId===eid;});if(sid)rc=rc.filter(function(r){return r.siteId===sid;});return rc;}

function doReset(){['sites','employees','shifts','records','settings','admin','recycleBin'].forEach(function(p){fbRm(p);});setTimeout(function(){seedData();closeModal();toast('Reset','success');nav('dashboard');},500);}

/* ===== EMPLOYEE CLOCK ===== */
function renderClockPage(){var e=S.emp,site=sites().find(function(s){return s.id===e.siteId;});var isCI=S.clockState==='clocked_in',fc=isCI?'co':'ci',ic=isCI?'fa-arrow-right-from-bracket':'fa-fingerprint',lb=isCI?'CLOCK OUT':'CLOCK IN',sub=isCI?'Tap to end':'Tap to start';var wt=empWeekTotal(e.id,today()),wtLive=wt,wc=getWeeklyTarget();if(isCI&&S.activeRec)wtLive+=(Date.now()-new Date(S.activeRec.clockIn).getTime()/3600000;var wp=Math.min(100,Math.round((wtLive/wc)*100));var ws=weekStart(today()),we=weekEnd(ws),wRecs=recs().filter(function(r){return r.employeeId===e.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=we;});var wR=0,wU=0,wD=0;wRecs.forEach(function(r){wR+=(r.regularHours||0);wU+=getUOT(r);wD+=(r.doubleTimeHours||0);});var h='<div class="fade-in"><div class="emp-hero mb-5"><div class="emp-avatar">'+e.firstName.charAt(0)+e.lastName.charAt(0)+'</div><div class="text-lg font-bold">'+escHtml(e.firstName+' '+e.lastName)+'</div><div class="text-xs" style="color:var(--muted)">'+escHtml(e.employeeId)+' · '+escHtml(site?site.name:'Unknown')+'</div><div class="mono text-3xl font-bold mt-3" id="emp-live-clock">'+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</div><div class="text-xs" style="color:var(--muted)">'+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div></div><div class="flex justify-center mb-5"><div class="clock-face '+fc+'" onclick="handleClock()"><div class="clock-ring"></div><div class="cf-icon"><i class="fas '+ic+'"></i></div><div class="cf-label">'+lb+'</div><div class="cf-sub">'+sub+'</div></div></div></div><div class="text-center mb-5"><div id="gps-status" class="text-xs flex items-center justify-center gap-1.5" style="color:var(--muted)"><span class="conn-dot loading"></span> Checking...</div></div>';
  if(isCI)h+='<div class="text-center mb-5"><div class="text-xs" style="color:var(--muted)">Current shift</div><div class="mono text-2xl font-bold mt-1" style="color:var(--danger)" id="live-elapsed">'+fmtClock(0)+'</div><div class="text-xs mt-1" style="color:var(--muted)">Since '+fmtTime(new Date(S.activeRec.clockIn))+'</div></div>';
  h+='<div class="card mb-4"><div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-chart-simple mr-2" style="color:var(--info)"></i>This Week</h3></div><div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold mb-1"><i class="fas fa-chart-pie mr-2" style="color:var(--info)"></i>Breakdown</h3></div><div class="tier-legend mt-3"><span><span class="td" style="background:var(--success)"></span><span>Normal Time: '+fmtDec(wR)+'</span></span><span><span class="td" style="background:var(--danger)"></span><span>Over Time: '+fmtDec(wU)+'</span></span><span class="td" style="background:var(--purple)"></span>Double Time: '+fmtDec(wD)+'</span></span></div></div></div></div>';var recent=recs().filter(function(r){return r.employeeId===e.id;}).sort(function(a,b){return new Date(b.clockIn||0)-new Date(a.clockIn);}).slice(0,5);}).slice(0,5);if(recent.length){h+='<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-history mr-2" style="color:var(--info)"></i>Recent</h3>';recent.forEach(function(r){h+='<div class="flex items-center justify-between py-1.5 border-b" style="border-color:var(--border)"><div><div><div class="text-xs font-medium">'+(r.clockIn||'').slice(0,10)+' '+dayBadge(r.dayType||dayType((r.clockIn||'').slice(0,10)))+'</div><div class="text-xs" style="color:var(--muted)">'+(r.clockIn||'').slice(11,16)+(r.clockOut?' – '+(r.clockOut?r.clockOut.slice(11,16):'')+'</div></div><div class="text-right flex-shrink-0 ml-2"><div class="mono text-xs font-semibold">'+(r.status==='completed'?fmtDec(r.totalHours):'<span style="color:var(--success)">Active</span>')+'</div></div></div>';});h+='</div></div>';}return h+'</div></div>';return h;}
function renderEmpHistory(){var e=S.emp,now=new Date(),y=now.getFullYear(),m=now.getMonth(),mh=empMonthHours(e.id,y,m);var h='<div class="fade-in"><h2 class="text-xl font-bold tracking-tight mb-5"><span class="text-sm font-normal" style="color:var(--muted)">'+now.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</span></h2><div class="card mb-4"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-chart-bar mr-2" style="color:var(--info)"></i>Monthly Summary</h3><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3"><div><div class="text-xs" style="color:var(--muted)">Total</div><div class="mono text-lg font-bold">'+fmtDec(mh.total)+'</div></div><div class="text-xs" style="color:var(--muted)">Target</div><div class="mono text-lg font-bold" style="color:'+(mh.overTarget>0?'var(--danger)':'var(--muted)')+'">'+fmtDec(mh.overTarget)+'</div></div><div class="text-xs" style="color:var(--muted)">Records</div></div></div><div class="tier-legend mb-2"><span><span class="td" style="background:var(--success)"></span>Normal Time: '+fmtDec(mh.regular)+'</span><span><span class="td" style="background:var(--danger)"></span>Over Time: '+fmtDec(mh.unauthOT)+'</span><span><span class="td" style="background:var(--purple)"></span>Double Time: '+fmtDec(mh.doubleTime)+'</span></span></div>';var pct=Math.min(100,Math.round((mh.total/Math.max(1,mh.target))*100));h+='<div class="progress-track mb-1"><div class="progress-fill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--success),'+(pct>=100?'var(--danger)':'var(--accent)')+')"></div><div class="text-xs mt-1" style="color:var(--muted)">'+pct+'% of target</div></div></div>';var ms=y+'-'+String(m+1).padStart(2,'0');var myRecs=recs().filter(function(r){return r.employeeId===e.id&&r.clockIn&&r.clockIn.slice(0,7)===ms;});h+='<div class="card"><h3 class="text-sm font-semibold mb-3"><i class="fas fa-list mr-2" style="color:var(--info)"></i>Records</h3><div class="overflow-x-auto"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Total</th><th>Normal Time</th><th>Over Time</th><th>Double Time</th></tr></thead><tbody>';myRecs.forEach(function(r){h+='<tr><td class="text-sm">'+r.clockIn.slice(0,10)+'</td><td class="mono text-xs">'+(r.clockOut?r.clockOut.slice(11,16):'—')+'</td class="mono text-xs font-semibold">'+fmtDec(r.totalHours)+'</td><td class="mono text-xs" style="color:var(--success)">'+fmtDec(r.regularHours)+'</td class="mono text-xs" style="color:var(--danger)">'+fmtDec(getUOT(r))+'</td class="mono text-xs" style="color:var(--purple)">'+fmtDec(r.doubleTimeHours)+'</td><td class="text-xs">'+(r.dayType||'')+'</td></tr>';});h+='</tbody></table></div></div>';}return h+'</div></div>';}
function initClockPage(){clearInterval(S.clockInt);clearInterval(S.timerInt);(function tick(){var el=document.getElementById('emp-live-clock');if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});else{clearInterval(S.clockInt);return;}S.clockInt=setInterval(tick,1000);};if(S.clockState==='clocked_in'&&S.activeRec){(function te(){var el=document.getElementById('live-elapsed');if(!el){clearInterval(S.timerInt);return;}var ms=Date.now()-new Date(S.activeRec.clockIn).getTime();el.textContent=fmtClock(ms/3600);S.timerInt=setInterval(te,1000);})();}checkGps();}
function setGps(){if(!navigator.geolocation){toast('Not supported','error');return;}toast('Getting location...','info');navigator.geolocation.getCurrentPosition(function(p){document.getElementById('ms-la').value=p.coords.latitude.toFixed(5);document.getElementById('ms-ln').value=p.coords.longitude.toFixed(5);toast('Done','success');},function(e){toast('GPS: '+e.message,'error');},{enableHighAccuracy:true,timeout:10000});}
function handleClock(){if(S.clockState==='idle')doCI();else doCO();}
function doCI(){var site=sites().find(function(s){return s.id===S.emp.siteId;});if(site&&S.gpsDist!=null&&S.gpsDist>site.radius){openModal('<h3 class="font-bold text-lg mb-3">Outside GPS Zone</h3><p class="text-sm mb-4" style="color:var(--muted)"><strong style="color:var(--danger)">'+Math.round(S.gpsDist)+'m</strong> from '+escHtml(site.name)+' ('+site.radius+'m radius). Clock in anyway?</p><div class="flex gap-3"><button class="btn btn-primary flex-1 justify-center" onclick="closeModal();confirmCI()">Clock In Anyway</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div></div>');return;}
function confirmCI(){var now=new Date().toISOString(),id=db.ref('records').push().key,ts=shifts().find(function(s){return s.employeeId===S.emp.id&&s.date===today();});fbSet('records/'+id,{id:id,employeeId:S.emp.id,siteId:S.emp.siteId,shiftId:ts?ts.id:null,clockIn:now,status:'clocked_in',dayType:dayType(today()),gpsLat:S.gpsLat,gpsLng:S.gpsLng,gpsDistance:S.gpsDist};fbUpd('records/'+id,{clockOut:now,status:'completed',totalHours:calcHours(now,0,dayType(today()),regularHours:calcHours(now,0,dayType(today())),unauthOT:0,doubleTimeHours:0});S.clockState='idle';S.activeRec=null;navEmp('clock');toast('Clocked out — '+fmtDec(calcHours(now,0,dayType(today())),'success');}
function doCO(){if(!S.activeRec)return;var now=new Date().toISOString(),ci=S.activeRec.clockIn,dt=dayType(today()),bm=0;var sh=S.activeRec.shiftId?shifts().find(function(s){return s.id===S.activeRec.shiftId;});if(sh)bm=sh.breakMinutes||0;var hrs=calcHours(ci,now,bm,dt);fbUpd('records/'+S.activeRec.id,{clockOut:now,status:'completed',totalHours:hrs.totalHours,regularHours:hrs.regularHours,unauthOT:hrs.unauthOT,doubleTimeHours:hrs.doubleTimeHours,breakMinutes:bm,dayType:dt});S.clockState='idle';S.activeRec=null;navEmp('clock');toast('Clocked out — '+fmtDec(hrs.totalHours),'success');}

/* ===== INIT ===== */
initFirebase(FB_CONFIG);
document.getElementById('admin-pass').addEventListener('keydown',function(e){if(e.key==='Enter')adminLogin();});
document.getElementById('emp-pin').addEventListener('keydown',function(e){if(e.key==='Enter')employeeLogin();});
var _rt;window.addEventListener('resize',function(){clearTimeout(_rt);_rt=setTimeout(function(){if(S.page==='dashboard')initDashCharts();},250);});</script>
</script>
