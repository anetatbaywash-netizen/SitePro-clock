<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0e16;--bg2:#131620;--card:#1a1e2e;--card2:#212638;--border:#2a3048;--fg:#e2e4ea;--muted:#6b7094;--accent:#e8a838;--accent2:#d4922a;--success:#34d399;--danger:#f87171;--info:#38bdf8;--warning:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:8px;font-weight:500;font-size:.875rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#0c0e16}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.3)}.btn-danger:hover{background:rgba(248,113,113,.25)}
.btn-success{background:rgba(52,211,153,.15);color:var(--success);border:1px solid rgba(52,211,153,.3)}.btn-success:hover{background:rgba(52,211,153,.25)}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:.6rem .8rem;border-radius:8px;font-family:inherit;font-size:.875rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--card);color:var(--fg)}
label{font-size:.8rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.3rem}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;color:var(--muted);font-size:.875rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none}
.sidebar-link:hover{color:var(--fg);background:rgba(232,168,56,.05)}
.sidebar-link.active{color:var(--accent);background:rgba(232,168,56,.08);border-left-color:var(--accent)}
.main-content{margin-left:250px;min-height:100vh;padding:1.5rem 2rem}
.toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.8rem 1.2rem;border-radius:8px;font-size:.85rem;display:flex;align-items:center;gap:.6rem;animation:slideIn .3s ease;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-success{background:#065f46;border:1px solid #34d399;color:#a7f3d0}
.toast-error{background:#7f1d1d;border:1px solid #f87171;color:#fecaca}
.toast-info{background:#0c4a6e;border:1px solid #38bdf8;color:#bae6fd}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 30px rgba(52,211,153,.15)}50%{box-shadow:0 0 60px rgba(52,211,153,.3)}}
@keyframes breathe-out{0%,100%{box-shadow:0 0 30px rgba(248,113,113,.15)}50%{box-shadow:0 0 60px rgba(248,113,113,.3)}}
.fade-in{animation:fadeIn .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:1.5rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.6rem .8rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
td{padding:.6rem .8rem;font-size:.85rem;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}
tr:hover td{background:rgba(232,168,56,.03)}
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-green{background:rgba(52,211,153,.15);color:var(--success)}
.badge-red{background:rgba(248,113,113,.15);color:var(--danger)}
.badge-amber{background:rgba(232,168,56,.15);color:var(--accent)}
.badge-blue{background:rgba(56,189,248,.15);color:var(--info)}
.badge-purple{background:rgba(168,85,247,.15);color:#c084fc}
.bg-pattern{background-image:radial-gradient(circle at 1px 1px,rgba(232,168,56,.04) 1px,transparent 0);background-size:40px 40px}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.conn-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.conn-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.conn-dot.loading{background:var(--warning);animation:pulse-ring 1s infinite}
.tab-btn{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--fg)}
.clock-face{position:relative;width:280px;height:280px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;user-select:none}
.clock-face.clock-in-face{background:radial-gradient(circle at 40% 35%,rgba(52,211,153,.12),var(--card) 70%);border:3px solid var(--success);animation:breathe 3s ease-in-out infinite}
.clock-face.clock-in-face:hover{transform:scale(1.04);border-color:#6ee7b7}
.clock-face.clock-in-face:active{transform:scale(.97)}
.clock-face.clock-out-face{background:radial-gradient(circle at 40% 35%,rgba(248,113,113,.12),var(--card) 70%);border:3px solid var(--danger);animation:breathe-out 2s ease-in-out infinite}
.clock-face.clock-out-face:hover{transform:scale(1.04);border-color:#fca5a5}
.clock-face.clock-out-face:active{transform:scale(.97)}
.clock-face .cf-icon{font-size:2.5rem;margin-bottom:.25rem}
.clock-face .cf-label{font-size:1rem;font-weight:700;letter-spacing:.05em}
.clock-face .cf-sub{font-size:.7rem;color:var(--muted);font-weight:400;margin-top:.15rem}
.clock-face::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:2px solid;opacity:0;animation:pulse-ring 2.5s ease-out infinite;pointer-events:none}
.clock-in-face::after{border-color:var(--success)}
.clock-out-face::after{border-color:var(--danger)}
.big-time{font-family:'JetBrains Mono',monospace;font-size:3.5rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.big-date{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.emp-hero{background:linear-gradient(180deg,rgba(232,168,56,.04) 0%,transparent 60%);border-radius:16px;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.emp-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,56,.08),transparent 70%);pointer-events:none}
.emp-hero .emp-avatar{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;margin-bottom:.75rem;border:2px solid var(--accent);color:var(--accent);background:var(--card)}
.ts-table{border-collapse:collapse;width:100%}
.ts-table th,.ts-table td{border:1px solid var(--border);padding:.45rem .6rem;font-size:.78rem;text-align:center;white-space:nowrap}
.ts-table th{background:var(--bg2);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.7rem}
.ts-table .row-label{background:var(--bg2);color:var(--muted);font-weight:600;text-align:left;min-width:80px;font-size:.75rem}
.ts-table .total-row{background:rgba(232,168,56,.06);font-weight:700}
.ts-table .pay-row{background:rgba(52,211,153,.06);font-weight:700;color:var(--success)}
.ts-table .day-header{color:var(--accent);font-weight:700}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.35rem;max-height:200px;overflow-y:auto;padding:.25rem}
.checkbox-grid label{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--fg);cursor:pointer;padding:.25rem .4rem;border-radius:6px;transition:background .15s}
.checkbox-grid label:hover{background:rgba(232,168,56,.08)}
.checkbox-grid input[type=checkbox]{width:auto;accent-color:var(--accent)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:1rem}.clock-face{width:220px;height:220px}.clock-face .cf-icon{font-size:2rem}.big-time{font-size:2.5rem}}
</style>
</head>
<body class="bg-pattern">
<div id="toast-container" class="toast-container"></div>
<div id="loading-screen" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="inline-block w-10 h-10 rounded-full animate-spin mb-3" style="border:3px solid var(--accent);border-top-color:transparent"></div><p class="text-sm" style="color:var(--muted)">Syncing...</p></div>
</div>
<div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md fade-in" style="border-color:color-mix(in srgb,var(--accent) 20%,var(--border))">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-xl" style="color:#0c0e16"></i></div>
      <h1 class="text-2xl font-bold">SitePro Clock In</h1>
      <p class="text-sm mt-1 flex items-center justify-center gap-2" style="color:var(--muted)">Workforce Time Tracking <span class="conn-dot loading" id="login-conn-dot"></span></p>

    <div class="flex mb-6 border-b" style="border-color:var(--border)">

</div>
<div id="admin-layout" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b" style="border-color:var(--border)"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),#d4922a)"><i class="fas fa-clock text-sm" style="color:#0c0e16"></i></div><div><div class="font-bold text-sm">SitePro Clock In</div><div class="text-xs flex items-center gap-1.5" style="color:var(--muted)"><span class="conn-dot on" id="admin-conn-dot"></span><span id="admin-conn-label">Synced</span></div></div></div></div>

        <a class="sidebar-link" data-epage="history" style="padding:.7rem .5rem;justify-content:center;flex-direction:column;gap:2px"><i class="fas fa-history text-lg"></i><span class="text-xs hidden sm:inline mt-1">History</span></a>

<script>
/* ===== FIREBASE ===== */
var EMBEDDED_FB={apiKey:"AIzaSyAkHU3eWCWTUt3Ks0Vxq3PkgcATtin0Zaw",authDomain:"baywashclock.firebaseapp.com",databaseURL:"https://baywashclock-default-rtdb.firebaseio.com",projectId:"baywashclock",storageBucket:"baywashclock.firebasestorage.app",messagingSenderId:"207388184141",appId:"1:207388184141:web:718d4348bc91672a369604"};
var db=null,fbConnected=false,dataLoaded=0,initialLoadDone=false;
var D={sites:[],employees:[],shifts:[],records:[],settings:{},admin:{},recycleBin:{}};

function initFirebase(config){
  firebase.initializeApp(config);db=firebase.database();
  db.ref('.info/connected').on('value',function(s){fbConnected=s.val()===true;updateConnDots();});
  db.ref('sites').on('value',function(s){D.sites=s.val()?Object.values(s.val()):[];dataLoaded++;checkAllLoaded();});
  db.ref('employees').on('value',function(s){D.employees=s.val()?Object.values(s.val()):[];dataLoaded++;checkAllLoaded();});
  db.ref('shifts').on('value',function(s){D.shifts=s.val()?Object.values(s.val()):[];dataLoaded++;checkAllLoaded();});
  db.ref('records').on('value',function(s){D.records=s.val()?Object.values(s.val()):[];dataLoaded++;checkAllLoaded();updateApprovalBadge();});
  db.ref('settings').on('value',function(s){D.settings=s.val()||{};dataLoaded++;checkAllLoaded();});
  db.ref('admin').on('value',function(s){D.admin=s.val()||{};dataLoaded++;checkAllLoaded();});
  db.ref('recycleBin').on('value',function(s){D.recycleBin=s.val()||{};dataLoaded++;checkAllLoaded();});
}
function checkAllLoaded(){if(dataLoaded>=7&&!initialLoadDone){initialLoadDone=true;document.getElementById('loading-screen').classList.add('hidden');if(!D.admin||!D.admin.username)seedFirebase();cleanExpiredBin();showScreen('login-screen');}}
function updateConnDots(){var cls=fbConnected?'conn-dot on':'conn-dot off',lbl=fbConnected?'Synced':'Offline';document.querySelectorAll('#login-conn-dot,#admin-conn-dot,#emp-conn-dot').forEach(function(d){d.className=cls;});var el=document.getElementById('admin-conn-label');if(el)el.textContent=lbl;}
function fbSet(p,d){if(!db)return;db.ref(p).set(d).catch(function(e){toast('Sync error: '+e.message,'error');});}
function fbUpdate(p,d){if(!db)return;db.ref(p).update(d).catch(function(e){toast('Sync error: '+e.message,'error');});}
function fbRemove(p){if(!db)return;db.ref(p).remove().catch(function(e){toast('Sync error: '+e.message,'error');});}
function getSites(){return D.sites||[];}function getEmployees(){return D.employees||[];}function getShifts(){return D.shifts||[];}function getRecords(){return D.records||[];}function getSettings(){return D.settings||{};}function getHolidays(){return(D.settings&&D.settings.holidays)?D.settings.holidays:[];}function getBinItems(){return D.recycleBin||{};}

function seedFirebase(){
  fbSet('admin',{username:'admin',password:'admin123'});
  fbSet('settings',{weeklyTarget:45,overtimeAfter:45,defaultBreak:30,graceMinutes:10,holidays:[
    '2025-01-01','2025-03-21','2025-04-18','2025-04-21','2025-05-01','2025-05-04','2025-05-25','2025-05-29','2025-08-26','2025-12-10','2025-12-25','2025-12-26',
    '2026-01-01','2026-03-21','2026-04-03','2026-04-06','2026-05-01','2026-05-04','2026-05-14','2026-05-25','2026-08-26','2026-12-10','2026-12-25','2026-12-26',
    '2027-01-01','2027-03-21','2027-03-26','2027-03-29','2027-05-01','2027-05-04','2027-05-06','2027-05-25','2027-08-26','2027-12-10','2027-12-25','2027-12-26',
    '2028-01-01','2028-03-21','2028-04-14','2028-04-17','2028-05-01','2028-05-04','2028-05-25','2028-08-26','2028-12-10','2028-12-25','2028-12-26'
  ]});
  fbSet('recycleBin',{});
  var s1=db.ref('sites').push().key,s2=db.ref('sites').push().key;
  fbSet('sites/'+s1,{id:s1,name:'Baywash Chemicals Windhoek',address:'Windhoek, Namibia',lat:-22.5609,lng:17.0658,radius:100});
  fbSet('sites/'+s2,{id:s2,name:'Baywash Chemicals Swakopmund',address:'Swakopmund, Namibia',lat:-22.6754,lng:14.5256,radius:100});
  var e1=db.ref('employees').push().key,e2=db.ref('employees').push().key,e3=db.ref('employees').push().key;
  fbSet('employees/'+e1,{id:e1,firstName:'James',lastName:'Carter',employeeId:'EMP001',pin:'1234',siteId:s1,active:true});
  fbSet('employees/'+e2,{id:e2,firstName:'Sarah',lastName:'Mitchell',employeeId:'EMP002',pin:'5678',siteId:s1,active:true});
  fbSet('employees/'+e3,{id:e3,firstName:'Daniel',lastName:'Nguyen',employeeId:'EMP003',pin:'4321',siteId:s2,active:true});
}

/* ===== STATE ===== */
var state={loggedIn:false,role:null,currentPage:'dashboard',empPage:'clock',currentEmployee:null,clockState:'idle',activeRecord:null,gpsStatus:'pending',gpsDistance:null,gpsLat:null,gpsLng:null,liveTimerInterval:null,clockTimeInterval:null,exportWeekOffset:0,exportEmpId:null};

/* ===== UTILS ===== */
function fmtDate(d){var dt=d instanceof Date?d:new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtTime(d){var dt=d instanceof Date?d:new Date(d);return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');}
function todayStr(){return fmtDate(new Date());}
function getSiteName(id){var s=getSites().find(function(x){return x.id===id;});return s?s.name:'Unknown';}
function getEmpById(id){return getEmployees().find(function(x){return x.id===id;});}
function haversine(lat1,lon1,lat2,lon2){var R=6371000,t=function(n){return n*Math.PI/180;},dLat=t(lat2-lat1),dLon=t(lon2-lon1),a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
/* Decimal format: 2 decimal places like screenshot */
function fmtHrs(h){return(Math.round((h||0)*100)/100).toFixed(2);}
function timeAgo(ts){var s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function getTierConfig(){var s=getSettings();return{target:s.weeklyTarget||45,otAfter:s.overtimeAfter!=null?s.overtimeAfter:(s.weeklyTarget||45)};}
function timeToMinutes(t){var p=t.split(':'),h=parseInt(p[0]),m=parseInt(p[1]||0);return h*60+m;}
function minutesToTime(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}

/* ===== HOURS CALCULATION ===== */
function isSunday(ds){return new Date(ds+'T12:00:00').getDay()===0;}
function isHoliday(ds){return getHolidays().indexOf(ds)!==-1;}
function getDayType(ds){if(isSunday(ds))return'Sunday';if(isHoliday(ds))return'Holiday';return'Weekday';}
function getWeekStart(ds){var d=new Date(ds+'T12:00:00'),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return fmtDate(d);}
function getWeekDates(ws){var dates=[];for(var i=0;i<7;i++){var d=new Date(ws+'T12:00:00');d.setDate(d.getDate()+i);dates.push(fmtDate(d));}return dates;}

function getEmployeeWeekWorkedHours(empId,curDate){
  var ws=getWeekStart(curDate),we=new Date(ws+'T12:00:00');we.setDate(we.getDate()+6);var wes=fmtDate(we);
  return getRecords().filter(function(r){return r.employeeId===empId&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)>=ws&&r.clockIn.slice(0,10)<=wes&&r.dayType!=='Sunday'&&r.dayType!=='Holiday';}).reduce(function(s,r){return s+(r.totalHours||0);},0);
}

function calcHours(ci,co,bm,weekWorked,dayType,tierCfg){
  var totalMs=new Date(co)-new Date(ci),totalMin=Math.max(0,totalMs/60000-bm),totalHrs=Math.round(totalMin/6)/10;
  if(dayType==='Sunday'||dayType==='Holiday')return{regularHours:0,overtimeHours:0,doubleTimeHours:totalHrs,totalHours:totalHrs};
  var start=weekWorked,end=weekWorked+totalHrs,regular=0,overtime=0;
  if(start<tierCfg.otAfter)regular+=Math.min(end,tierCfg.otAfter)-start;
  if(end>tierCfg.otAfter)overtime+=end-Math.max(start,tierCfg.otAfter);
  return{regularHours:regular,overtimeHours:overtime,doubleTimeHours:0,totalHours:totalHrs};
}

function getMondaysInMonth(year,month){var count=0,d=new Date(year,month,1),dow=d.getDay(),daysToMon=dow===0?1:(dow===1?0:8-dow);d.setDate(d.getDate()+daysToMon);while(d.getMonth()===month&&d.getFullYear()===year){count++;d.setDate(d.getDate()+7);}return count;}
function getEmployeeMonthHours(empId,year,month){
  var tc=getTierConfig(),mondaysInMonth=getMondaysInMonth(year,month),monthlyTarget=tc.target*mondaysInMonth;
  var monthStr=year+'-'+String(month+1).padStart(2,'0');
  var recs=getRecords().filter(function(r){return r.employeeId===empId&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,7)===monthStr;});
  var total={regular:0,overtime:0,doubleTime:0,total:0,recordCount:recs.length};
  recs.forEach(function(r){total.regular+=(r.regularHours||0);total.overtime+=(r.overtimeHours||0);total.doubleTime+=(r.doubleTimeHours||0);total.total+=(r.totalHours||0);});
  total.target=monthlyTarget;total.mondays=mondaysInMonth;total.overTarget=Math.max(0,total.total-monthlyTarget);total.effective=total.regular+total.overtime*1.5+total.doubleTime*2;
  return total;
}

/* ===== APPROVAL LOGIC ===== */
function getGraceMinutes(){return(D.settings&&D.settings.graceMinutes!=null)?D.settings.graceMinutes:10;}

function checkNeedsApproval(record){
  var shift=getShifts().find(function(s){return s.id===record.shiftId;});
  if(!shift)return{needsApproval:true,reason:'No shift scheduled for this day'};
  var grace=getGraceMinutes();
  var ciTime=fmtTime(new Date(record.clockIn));
  var coTime=record.clockOut?fmtTime(new Date(record.clockOut)):null;
  var shiftStartMin=timeToMinutes(shift.startTime);
  var shiftEndMin=timeToMinutes(shift.endTime);
  var ciMin=timeToMinutes(ciTime);
  var reasons=[];
  if(ciMin<shiftStartMin-grace)reasons.push('Clocked in '+minutesToTime(shiftStartMin-ciMin)+' before shift start');
  if(coTime){
    var coMin=timeToMinutes(coTime);
    if(coMin>shiftEndMin+grace)reasons.push('Clocked out '+minutesToTime(coMin-shiftEndMin)+' after shift end');
  }
  if(reasons.length)return{needsApproval:true,reason:reasons.join('; ')};
  return{needsApproval:false,reason:''};
}

function updateApprovalBadge(){
  var pending=getRecords().filter(function(r){return r.needsApproval&&!r.approved&&r.status==='completed';}).length;
  var badge=document.getElementById('approval-badge');
  if(badge){if(pending>0){badge.classList.remove('hidden');badge.textContent=pending;}else badge.classList.add('hidden');}
}

/* ===== RECYCLE BIN ===== */
var BIN_TTL=30*24*60*60*1000;

function restoreFromBin(type,binId){var item=D.recycleBin[type]&&D.recycleBin[type][binId];if(!item)return;fbSet(type+'/'+(item.originalId||item.data.id),item.data);fbRemove('recycleBin/'+type+'/'+binId);toast('Restored','success');navigateAdmin('recyclebin');}
function permanentDeleteBin(type,binId){openModal('<h3 class="font-bold text-lg mb-3">Permanently Delete?</h3><p class="text-sm mb-4" style="color:var(--muted)">This cannot be undone.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="fbRemove(\'recycleBin/'+type+'/'+binId+'\');closeModal();navigateAdmin(\'recyclebin\');toast(\'Permanently deleted\',\'success\')"><i class="fas fa-trash"></i> Delete Forever</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');}
function cleanExpiredBin(){var bin=D.recycleBin;if(!bin)return;var now=Date.now();['sites','employees','shifts','records'].forEach(function(type){if(!bin[type])return;Object.keys(bin[type]).forEach(function(binId){var item=bin[type][binId];if(item.deletedAt&&(now-new Date(item.deletedAt).getTime())>BIN_TTL)fbRemove('recycleBin/'+type+'/'+binId);});});}
function emptyBin(){openModal('<h3 class="font-bold text-lg mb-3">Empty Entire Recycle Bin?</h3><p class="text-sm mb-4" style="color:var(--muted)">All items permanently deleted.</p><div class="flex gap-3"><button class="btn btn-danger flex-1 justify-center" onclick="fbSet(\'recycleBin\',{});closeModal();navigateAdmin(\'recyclebin\');toast(\'Bin emptied\',\'success\')"><i class="fas fa-trash"></i> Empty Bin</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>');}
function renderRecycleBin(){
  var bin=D.recycleBin,types=[{key:'sites',label:'Sites',icon:'fa-location-dot',color:'var(--info)'},{key:'employees',label:'Employees',icon:'fa-users',color:'var(--accent)'},{key:'shifts',label:'Shifts',icon:'fa-calendar-days',color:'var(--success)'},{key:'records',label:'Records',icon:'fa-clock-rotate-left',color:'var(--warning)'}];
  var totalItems=0;types.forEach(function(t){if(bin[t.key])totalItems+=Object.keys(bin[t.key]).length;});
  var h='<div class="fade-in"><div class="flex items-center justify-between mb-6 flex-wrap gap-3"><div><h2 class="text-xl font-bold">Recycle Bin</h2><p class="text-sm" style="color:var(--muted)">'+totalItems+' item'+(totalItems!==1?'s':'')+' &middot; auto-deleted after 30 days</p></div>';
  if(totalItems>0)h+='<button class="btn btn-danger btn-sm" onclick="emptyBin()"><i class="fas fa-trash"></i> Empty Bin</button>';
  h+='</div>';var hasAny=false;
  types.forEach(function(t){var items=bin[t.key]?Object.entries(bin[t.key]):[];if(!items.length)return;hasAny=true;
    h+='<div class="mb-6"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fas '+t.icon+'" style="color:'+t.color+'"></i> '+t.label+' <span class="badge badge-amber">'+items.length+'</span></h3><div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Item</th><th>Deleted</th><th>Expires</th><th>Actions</th></tr></thead><tbody>';
    items.sort(function(a,b){return new Date(b[1].deletedAt)-new Date(a[1].deletedAt);}).forEach(function(entry){var binId=entry[0],item=entry[1],d=item.data,name='—';
      if(t.key==='sites')name=d.name||'Unknown';else if(t.key==='employees')name=(d.firstName||'')+' '+(d.lastName||'')+' ('+(d.employeeId||'?')+')';else if(t.key==='shifts'){var emp=getEmpById(d.employeeId);name=(emp?emp.firstName+' '+emp.lastName:'?')+' &mdash; '+d.date;}else if(t.key==='records'){var emp2=getEmpById(d.employeeId);name=(emp2?emp2.firstName+' '+emp2.lastName:'?')+' &mdash; '+(d.clockIn||'').slice(0,10);}
      var daysLeft=Math.max(0,Math.ceil((new Date(item.deletedAt).getTime()+BIN_TTL-Date.now())/(24*60*60*1000)));var expiryColor=daysLeft<=3?'var(--danger)':daysLeft<=7?'var(--warning)':'var(--muted)';
      h+='<tr><td class="font-medium text-sm">'+name+'</td><td class="text-xs" style="color:var(--muted)">'+timeAgo(item.deletedAt)+'</td><td class="text-xs" style="color:'+expiryColor+'">'+daysLeft+'d left</td><td><div class="flex gap-2"><button class="btn btn-secondary btn-sm" onclick="restoreFromBin(\''+t.key+'\',\''+binId+'\')"><i class="fas fa-rotate-left"></i> Restore</button><button class="btn btn-danger btn-sm" onclick="permanentDeleteBin(\''+t.key+'\',\''+binId+'\')"><i class="fas fa-trash"></i></button></div></td></tr>';});
    h+='</tbody></table></div></div>';});

function renderRecords(){

function buildRecordsTable(recs){

  if(!recs.length)h+='<tr><td colspan="10" class="text-center py-8" style="color:var(--muted)">No records</td></tr>';

    var statusBadge=r.status==='clocked_in'?'<span class="badge badge-green">In</span>':'<span class="badge badge-blue">Done</span>';
    var approvalBadge='';
    if(r.needsApproval){
      if(r.approved)approvalBadge='<span class="badge badge-green">Approved</span>';
      else if(r.rejected)approvalBadge='<span class="badge badge-red">Rejected</span>';
      else approvalBadge='<span class="badge badge-amber">Pending</span>';
    } else {
      approvalBadge='<span style="color:var(--muted);font-size:.7rem">N/A</span>';
    }

  });
  h+='</tbody></table>';return h;
}
function filterRecords(){
  var empId=document.getElementById('rec-filter-emp').value,dateVal=document.getElementById('rec-filter-date').value;
  var recs=getRecords().filter(function(r){
    if(empId&&r.employeeId!==empId)return false;

    return true;
  }).sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);});
  document.getElementById('records-table-wrap').innerHTML=buildRecordsTable(recs);
}

  });

function shiftExportWeek(dir){var d=new Date(state._exportWS+'T12:00:00');d.setDate(d.getDate()+dir*7);state._exportWS=fmtDate(d);navigateAdmin('export');}

function downloadTimesheetCSV(){
  var emp=getEmpById(state.exportEmpId);
  if(!emp){toast('Select employee','error');return;}
  var ws=state._exportWS,weekDates=getWeekDates(ws),dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var site=getSites().find(function(s){return s.id===emp.siteId;});
  var tc=getTierConfig();
  var lines=[];
  lines.push('EMPLOYEE TIMESHEET');
  lines.push('Name:,'+emp.firstName+' '+emp.lastName);
  lines.push('ID:,'+emp.employeeId);
  lines.push('Site:,'+(site?site.name:''));
  lines.push('Period:,'+new Date(weekDates[0]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' - '+new Date(weekDates[6]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
  lines.push('');
  var header=',';weekDates.forEach(function(d,i){header+=dayNames[i]+' '+new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+',';});header+='Total';lines.push(header);

  var rows=['Time In','Time Out','NT','OT 1.5x','DT 2x','Total','Approval','Comments'];
  var totals={nt:0,ot:0,dt:0,total:0};
  rows.forEach(function(rowLabel){
    var line=rowLabel+',';
    var rowTotal=0;
    weekDates.forEach(function(d){
      var rec=getRecords().find(function(r){return r.employeeId===emp.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)===d;});
      var val='';
      if(rowLabel==='Time In')val=rec?fmtTime(new Date(rec.clockIn)):'';
      else if(rowLabel==='Time Out')val=rec&&rec.clockOut?fmtTime(new Date(rec.clockOut)):'';
      else if(rowLabel==='NT'){val=fmtHrs(rec?rec.regularHours||0:0);rowTotal+=0;}
      else if(rowLabel==='OT 1.5x'){val=fmtHrs(rec?rec.overtimeHours||0:0);}
      else if(rowLabel==='DT 2x'){val=fmtHrs(rec?rec.doubleTimeHours||0:0);}
      else if(rowLabel==='Total'){val=fmtHrs(rec?rec.totalHours||0:0);rowTotal=rec?rec.totalHours||0:0;}
      else if(rowLabel==='Approval'){
        if(!rec)val='-';
        else if(!rec.needsApproval)val='OK';
        else if(rec.approved)val='Approved';
        else if(rec.rejected)val='Rejected';
        else val='Pending';
      }
      else if(rowLabel==='Comments'){
        if(!rec)val='';
        else if(rec.needsApproval&&!rec.approved&&!rec.rejected)val='Awaiting approval';
        else if(rec.rejected)val=rec.rejectionReason||'Rejected';
        else if(rec.approvalReason)val=rec.approvalReason;
        else val='';
      }
      line+=val+',';
    });
    /* Compute row totals for NT/OT/DT/Total */
    if(rowLabel==='NT'){weekDates.forEach(function(d){var rec=getRecords().find(function(r){return r.employeeId===emp.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)===d;});totals.nt+=rec?rec.regularHours||0:0;});line+=fmtHrs(totals.nt);}
    else if(rowLabel==='OT 1.5x'){weekDates.forEach(function(d){var rec=getRecords().find(function(r){return r.employeeId===emp.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)===d;});totals.ot+=rec?rec.overtimeHours||0:0;});line+=fmtHrs(totals.ot);}
    else if(rowLabel==='DT 2x'){weekDates.forEach(function(d){var rec=getRecords().find(function(r){return r.employeeId===emp.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)===d;});totals.dt+=rec?rec.doubleTimeHours||0:0;});line+=fmtHrs(totals.dt);}
    else if(rowLabel==='Total'){weekDates.forEach(function(d){var rec=getRecords().find(function(r){return r.employeeId===emp.id&&r.status==='completed'&&r.clockIn&&r.clockIn.slice(0,10)===d;});totals.total+=rec?rec.totalHours||0:0;});line+=fmtHrs(totals.total);}
    else line+='';
    lines.push(line);
  });

  lines.push('');
  lines.push('Period Totals,,,'+fmtHrs(totals.nt)+','+fmtHrs(totals.ot)+','+fmtHrs(totals.dt)+','+fmtHrs(totals.total));
  var payNT=totals.nt,payOT=totals.ot*1.5,payDT=totals.dt*2,payTotal=payNT+payOT+payDT;
  lines.push('Pay Totals (weighted),,,'+fmtHrs(payNT)+','+fmtHrs(payOT)+','+fmtHrs(payDT)+','+fmtHrs(payTotal));
  lines.push('');
  lines.push('Weekly Target: '+fmtHrs(tc.otAfter));

  var csv=lines.join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='Timesheet_'+emp.employeeId+'_'+ws+'.csv';a.click();URL.revokeObjectURL(url);
  toast('CSV downloaded','success');
}

/* ===== SETTINGS ===== */
function renderSettings(){
  var s=getSettings(),tc=getTierConfig();
  var h='<div class="fade-in"><h2 class="text-xl font-bold mb-6">Settings</h2>';
  h+='<div class="grid gap-4 max-w-xl">';
  h+='<div class="card"><h3 class="font-semibold text-sm mb-4"><i class="fas fa-clock mr-2" style="color:var(--accent)"></i>Hours & Tiers</h3><div class="grid gap-4"><div class="grid grid-cols-2 gap-3"><div><label>Weekly Target (hours)</label><input id="s-target" type="number" step="0.5" value="'+(s.weeklyTarget||45)+'"></div><div><label>Overtime After (hours)</label><input id="s-ot" type="number" step="0.5" value="'+(s.overtimeAfter!=null?s.overtimeAfter:45)+'"></div></div><div class="grid grid-cols-2 gap-3"><div><label>Default Break (min)</label><input id="s-break" type="number" value="'+(s.defaultBreak||30)+'"></div><div><label>Grace Period (min)</label><input id="s-grace" type="number" value="'+(s.graceMinutes!=null?s.graceMinutes:10)+'"><p class="text-xs mt-1" style="color:var(--muted)">Minutes before/after shift that don\'t require approval</p></div></div></div></div>';
  h+='<div class="card"><h3 class="font-semibold text-sm mb-4"><i class="fas fa-calendar-xmark mr-2" style="color:var(--danger)"></i>Public Holidays</h3><div><label>Holiday Dates (one per line, YYYY-MM-DD)</label><textarea id="s-holidays" rows="8" style="font-family:\'JetBrains Mono\',monospace;font-size:.75rem;resize:vertical">'+getHolidays().join('\n')+'</textarea></div></div>';
  h+='<div class="card"><h3 class="font-semibold text-sm mb-4"><i class="fas fa-shield-halved mr-2" style="color:var(--info)"></i>Admin Credentials</h3><div class="grid gap-4"><div><label>Username</label><input id="s-admin-user" value="'+(D.admin.username||'')+'"></div><div><label>New Password (leave blank to keep)</label><input id="s-admin-pass" type="password" placeholder="Enter new password"></div></div></div>';
  h+='<button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Save Settings</button>';
  h+='</div></div>';return h;
}
function saveSettings(){
  var target=parseFloat(document.getElementById('s-target').value)||45;
  var ot=parseFloat(document.getElementById('s-ot').value)||target;
  var brk=parseInt(document.getElementById('s-break').value)||30;
  var grace=parseInt(document.getElementById('s-grace').value)||10;
  var holidays=document.getElementById('s-holidays').value.trim().split('\n').map(function(h){return h.trim();}).filter(function(h){return/^\d{4}-\d{2}-\d{2}$/.test(h);});
  fbSet('settings',{weeklyTarget:target,overtimeAfter:ot,defaultBreak:brk,graceMinutes:grace,holidays:holidays});
  var newUser=document.getElementById('s-admin-user').value.trim();
  var newPass=document.getElementById('s-admin-pass').value;
  var updates={username:newUser};
  if(newPass)updates.password=newPass;
  fbUpdate('admin',updates);
  toast('Settings saved','success');
}

/* ===== EMPLOYEE CLOCK PAGE ===== */
function renderClockPage(){
  var emp=state.currentEmployee,site=getSites().find(function(s){return s.id===emp.siteId;});
  var now=new Date();
  var h='<div class="fade-in"><div class="emp-hero mb-6"><div class="emp-avatar">'+emp.firstName[0]+emp.lastName[0]+'</div><div class="text-lg font-bold">'+emp.firstName+' '+emp.lastName+'</div><div class="text-sm" style="color:var(--muted)">'+emp.employeeId+' &middot; '+(site?site.name:'')+'</div><div class="big-time mt-4" id="emp-live-clock">'+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</div><div class="big-date" id="emp-live-date">'+now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div>';
  /* Today's shift info */
  var todayShift=getShifts().find(function(s){return s.employeeId===emp.id&&s.date===todayStr();});
  if(todayShift){
    h+='<div class="card mb-4"><div class="text-xs font-semibold mb-2" style="color:var(--muted)">TODAY\'S SHIFT</div><div class="flex items-center gap-4"><span class="mono text-sm" style="color:var(--accent)">'+todayShift.startTime+' - '+todayShift.endTime+'</span><span class="badge badge-blue">'+(todayShift.targetHours||'auto')+'h</span>'+(todayShift.breakMinutes?'<span class="text-xs" style="color:var(--muted)">'+todayShift.breakMinutes+'m break</span>':'')+'</div></div>';
  } else {
    h+='<div class="card mb-4" style="border-color:rgba(248,113,113,.3)"><div class="flex items-center gap-2"><i class="fas fa-triangle-exclamation" style="color:var(--warning)"></i><span class="text-sm">No shift scheduled today &mdash; clocking in will require approval</span></div></div>';
  }
  /* GPS status */
  if(state.gpsStatus==='checked'){
    var gpsOk=state.gpsDistance!=null&&site&&state.gpsDistance<=site.radius;
    h+='<div class="card mb-4"><div class="flex items-center gap-2"><i class="fas '+(gpsOk?'fa-location-dot':'fa-location-crosshairs')+'" style="color:'+(gpsOk?'var(--success)':'var(--warning)')+'"></i><span class="text-xs" style="color:var(--muted)">GPS: '+(gpsOk?'On site ('+Math.round(state.gpsDistance)+'m)':'Off site ('+(state.gpsDistance!=null?Math.round(state.gpsDistance)+'m':'N/A')+')')+'</span></div></div>';
  }
  /* Clock button */
  h+='<div class="flex justify-center mb-6">';
  if(state.clockState==='idle'){
    h+='<div class="clock-face clock-in-face" onclick="doClockIn()"><div class="cf-icon"><i class="fas fa-fingerprint"></i></div><div class="cf-label">CLOCK IN</div><div class="cf-sub">Tap to start</div></div>';
  } else {
    var elapsed=Math.floor((Date.now()-new Date(state.activeRecord.clockIn).getTime())/60000);
    h+='<div class="clock-face clock-out-face" onclick="doClockOut()"><div class="cf-icon"><i class="fas fa-fingerprint"></i></div><div class="cf-label">CLOCK OUT</div><div class="cf-sub mono" id="emp-elapsed">'+fmtHrs(elapsed/60)+'h</div></div>';
  }
  h+='</div>';
  /* Pending approval notice */
  var pendingRecs=getRecords().filter(function(r){return r.employeeId===emp.id&&r.needsApproval&&!r.approved&&!r.rejected&&r.status==='completed';});
  if(pendingRecs.length){
    h+='<div class="card mb-4" style="border-color:rgba(251,191,36,.3)"><div class="flex items-center gap-2"><i class="fas fa-clock" style="color:var(--warning)"></i><span class="text-sm"><strong>'+pendingRecs.length+'</strong> record(s) awaiting admin approval</span></div></div>';
  }
  /* Rejected notice */
  var rejectedRecs=getRecords().filter(function(r){return r.employeeId===emp.id&&r.rejected&&r.status==='completed';});
  if(rejectedRecs.length){
    h+='<div class="card mb-4" style="border-color:rgba(248,113,113,.3)"><div class="flex items-center gap-2"><i class="fas fa-circle-xmark" style="color:var(--danger)"></i><span class="text-sm"><strong>'+rejectedRecs.length+'</strong> record(s) rejected by admin</span></div></div>';
  }
  h+='</div>';return h;
}
function initClockPage(){
  if(state.clockTimeInterval)clearInterval(state.clockTimeInterval);
  var update=function(){
    var ce=document.getElementById('emp-live-clock');if(ce)ce.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var de=document.getElementById('emp-live-date');if(de)de.textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var ee=document.getElementById('emp-elapsed');
    if(ee&&state.activeRecord){var elapsed=Math.floor((Date.now()-new Date(state.activeRecord.clockIn).getTime())/60000);ee.textContent=fmtHrs(elapsed/60)+'h';}
    if(!document.getElementById('emp-live-clock')){clearInterval(state.clockTimeInterval);}
  };
  update();state.clockTimeInterval=setInterval(update,1000);
  /* Check GPS */
  if(navigator.geolocation){
    var site=getSites().find(function(s){return s.id===state.currentEmployee.siteId;});
    if(site){
      navigator.geolocation.getCurrentPosition(function(p){
        state.gpsLat=p.coords.latitude;state.gpsLng=p.coords.longitude;
        state.gpsDistance=haversine(p.coords.latitude,p.coords.longitude,site.lat,site.lng);
        state.gpsStatus='checked';
        navigateEmp('clock');
      },function(){state.gpsStatus='error';},{enableHighAccuracy:true,timeout:10000});
    }
  }
}
function doClockIn(){
  var emp=state.currentEmployee;
  var todayShift=getShifts().find(function(s){return s.employeeId===emp.id&&s.date===todayStr();});
  var id=db.ref('records').push().key;
  var record={id:id,employeeId:emp.id,siteId:emp.siteId,shiftId:todayShift?todayShift.id:'',clockIn:new Date().toISOString(),clockOut:null,status:'clocked_in',regularHours:0,overtimeHours:0,doubleTimeHours:0,totalHours:0,dayType:getDayType(todayStr()),needsApproval:false,approved:false,rejected:false,approvalReason:'',rejectionReason:''};
  /* If no shift, flag for approval */
  if(!todayShift){record.needsApproval=true;record.approvalReason='No shift scheduled for this day';}
  fbSet('records/'+id,record);
  state.clockState='clocked_in';state.activeRecord=record;
  toast('Clocked in'+(record.needsApproval?' (requires approval)':''),'success');
  navigateEmp('clock');
}
function doClockOut(){
  if(!state.activeRecord)return;
  var record=state.activeRecord;
  var clockOut=new Date().toISOString();
  var shift=getShifts().find(function(s){return s.id===record.shiftId;});
  var breakMin=shift?shift.breakMinutes||0:(getSettings().defaultBreak||0);
  var tc=getTierConfig();
  var dayType=getDayType(clockOut.slice(0,10));
  var weekWorked=getEmployeeWeekWorkedHours(record.employeeId,clockOut.slice(0,10));
  var hours=calcHours(record.clockIn,clockOut,breakMin,weekWorked,dayType,tc);
  var updates={clockOut:clockOut,status:'completed',regularHours:hours.regularHours,overtimeHours:hours.overtimeHours,doubleTimeHours:hours.doubleTimeHours,totalHours:hours.totalHours,dayType:dayType};
  /* Check approval */
  var approval=checkNeedsApproval(Object.assign({},record,updates));
  updates.needsApproval=approval.needsApproval;
  updates.approvalReason=approval.reason;
  updates.approved=false;updates.rejected=false;
  fbUpdate('records/'+record.id,updates);
  state.clockState='idle';state.activeRecord=null;
  toast('Clocked out &mdash; '+fmtHrs(hours.totalHours)+'h'+(approval.needsApproval?' (requires approval)':''),'success');
  navigateEmp('clock');
}

/* ===== EMPLOYEE HISTORY ===== */
function renderEmpHistory(){
  var emp=state.currentEmployee;
  var recs=getRecords().filter(function(r){return r.employeeId===emp.id&&r.status==='completed';}).sort(function(a,b){return new Date(b.clockIn)-new Date(a.clockIn);});
  var h='<div class="fade-in"><h2 class="text-xl font-bold mb-4">My History</h2>';
  if(!recs.length){h+='<div class="card text-center py-12"><i class="fas fa-history text-3xl mb-3" style="color:var(--muted)"></i><p style="color:var(--muted)">No records yet</p></div>';h+='</div>';return h;}
  h+='<div class="card overflow-x-auto" style="padding:0"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>NT</th><th>OT 1.5x</th><th>DT 2x</th><th>Total</th><th>Status</th></tr></thead><tbody>';
  recs.forEach(function(r){
    var approvalBadge='';
    if(r.needsApproval){
      if(r.approved)approvalBadge='<span class="badge badge-green" style="font-size:.55rem">Approved</span>';
      else if(r.rejected)approvalBadge='<span class="badge badge-red" style="font-size:.55rem">Rejected</span>';
      else approvalBadge='<span class="badge badge-amber" style="font-size:.55rem">Pending</span>';
    }
    h+='<tr><td class="text-xs">'+r.clockIn.slice(0,10)+'</td><td class="mono text-xs">'+fmtTime(new Date(r.clockIn))+'</td><td class="mono text-xs">'+(r.clockOut?fmtTime(new Date(r.clockOut)):'')+'</td><td class="mono text-xs">'+fmtHrs(r.regularHours||0)+'</td><td class="mono text-xs">'+fmtHrs(r.overtimeHours||0)+'</td><td class="mono text-xs">'+fmtHrs(r.doubleTimeHours||0)+'</td><td class="mono text-xs font-semibold">'+fmtHrs(r.totalHours||0)+'</td><td>'+approvalBadge+'</td></tr>';
  });
  h+='</tbody></table></div></div>';return h;
}

initFirebase(EMBEDDED_FB);
